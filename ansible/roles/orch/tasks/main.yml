# orch: venv, установка пакета, симлинки точек входа, плагин в aoe, бэкап базы.
#
# Роль не перезапускает `aoe serve`: рестарт демона обрывает живые сессии
# агентов. Впервые поставленный плагин демон подхватывает при своём
# следующем старте — реестр плагинов читается один раз за процесс
# (`src/plugin/mod.rs`, `reload_registry`). Роль об этом говорит и не делает
# вид, что панель появилась сама.

- name: Каталог состояния orch
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ base_deploy_user }}"
    group: "{{ base_deploy_user }}"
    mode: '0755'
  loop:
    - "{{ orch_state_dir }}"
    - "{{ orch_state_dir }}/inbox"
    # Правленые владельцем цепочки: их пишет страница настроек, а движок
    # предпочитает их заводским (orch/src/orch/chain.py, path_of).
    - "{{ orch_state_dir }}/chains"
    # Правленые владельцем описания побочных ролей и токен бота: их тоже
    # пишет страница настроек, и песочница юнита открывает ей эти каталоги.
    - "{{ orch_state_dir }}/asides"
    - "{{ orch_state_dir }}/secrets"

- name: Есть ли исходники orch на машине
  # Роль ставит пакет из рабочей копии репозитория, а не из PyPI: orch —
  # часть этого репозитория и версионируется вместе с ним.
  ansible.builtin.stat:
    path: "{{ orch_src }}/pyproject.toml"
  register: orch_sources
  check_mode: false

- name: Сказать, что без исходников ставить нечего
  ansible.builtin.debug:
    msg:
      - "{{ orch_src }}/pyproject.toml не найден — orch не ставлю."
      - "Исходники приезжают на машину ролью pull вместе с остальным репозиторием."
  when: not orch_sources.stat.exists

- name: Установка orch
  when: orch_sources.stat.exists
  become: true
  become_user: "{{ base_deploy_user }}"
  block:

    - name: Python 3.12 и venv на месте
      ansible.builtin.command:
        cmd: python3.12 --version
      register: orch_python
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Без Python 3.12 дальше нельзя
      ansible.builtin.assert:
        that: orch_python.rc == 0
        fail_msg: >-
          python3.12 не найден. Его ставит роль base; прогони site.yml
          по порядку, без пропуска тегов.

    - name: Виртуальное окружение orch
      ansible.builtin.command:
        cmd: "python3.12 -m venv {{ orch_venv }}"
        creates: "{{ orch_venv }}/bin/python"

    - name: Пакет orch поставлен из рабочей копии
      # `-e`: правка кода в репозитории действует после перезапуска воркера
      # плагина (`aoe plugin disable` / `enable`), без переустановки.
      ansible.builtin.pip:
        name: "{{ orch_src }}"
        editable: true
        virtualenv: "{{ orch_venv }}"
        state: forcereinstall
      register: orch_pip
      changed_when: orch_pip is changed

    - name: База задач заведена и мигрирована
      # `orch doctor` открывает базу, применяет миграции и печатает, что
      # не так. Ненулевой код — не повод падать: он бывает и когда демон
      # AoE ещё не поднят.
      ansible.builtin.command:
        cmd: "{{ orch_venv }}/bin/orch doctor"
      register: orch_doctor
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Что сказал doctor
      ansible.builtin.debug:
        var: orch_doctor.stdout_lines
      when: orch_doctor.stdout_lines | default([]) | length > 0

- name: Точки входа в PATH демона
  # PATH демона и сессий агентов: /usr/local/sbin:/usr/local/bin:/usr/sbin:
  # /usr/bin:/snap/bin — без ~/.local/bin. Роли зовут `orch` по имени, а
  # манифест плагина — `orch-plugin` с `system = true`.
  ansible.builtin.file:
    src: "{{ orch_venv }}/bin/{{ item }}"
    dest: "{{ orch_bin_dir }}/{{ item }}"
    state: link
    force: true
  loop:
    - orch
    - orch-plugin
  when: orch_sources.stat.exists

- name: Настройки aoe, от которых зависит orch
  # Ключи лежат в разных разделах, и это проверено по живому config.toml:
  # rate_limit_auto_resume — в [acp], smart_rename — в [session]. Вписать
  # оба в один раздел значит тихо не настроить ничего.
  #
  # rate_limit_auto_resume: после лимита провайдера AoE сам возобновляет
  # сессию и один раз перевыдаёт прерванный промпт, а движок ничего не
  # шлёт повторно (orch/PLAN.md §5).
  # smart_rename: включено. Сессиям движок сам ставит титул при создании
  # («T12 · plan»), а AoE переименовывает только сессии с дефолтным именем
  # цивилизации (SkipReason::NameNotDefault), так что имя шага не трогается.
  # Выключать его значило лишать имён ручные сессии владельца.
  ansible.builtin.lineinfile:
    path: "/home/{{ base_deploy_user }}/.config/agent-of-empires/config.toml"
    regexp: "^{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
    insertafter: "^\\[{{ item.section }}\\]\\s*$"
    create: true
    owner: "{{ base_deploy_user }}"
    group: "{{ base_deploy_user }}"
    mode: '0644'
  loop:
    - { section: acp, key: rate_limit_auto_resume, value: 'true' }
    - { section: session, key: smart_rename, value: 'true' }
  loop_control:
    label: "[{{ item.section }}] {{ item.key }}"

- name: Плагин orch
  when: orch_sources.stat.exists and not ansible_check_mode
  become: true
  become_user: "{{ base_deploy_user }}"
  block:

    - name: Плагин уже установлен
      ansible.builtin.command:
        cmd: aoe plugin list
      register: orch_plugin_list
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Поставить плагин orch
      # `--yes` выдаёт объявленные в манифесте права без вопроса: на этой
      # машине человек в консоли не сидит.
      ansible.builtin.command:
        cmd: "aoe plugin install --yes {{ orch_src }}"
      register: orch_plugin_install
      when: orch_plugin_id not in (orch_plugin_list.stdout | default(''))
      changed_when: orch_plugin_install.rc == 0

    - name: Обновить плагин, если манифест изменился
      ansible.builtin.command:
        cmd: "aoe plugin update {{ orch_plugin_id }} --yes"
      register: orch_plugin_update
      when: orch_plugin_id in (orch_plugin_list.stdout | default(''))
      changed_when: "'updated' in (orch_plugin_update.stdout | default('') | lower)"
      failed_when: false

- name: Как включить панель, если демон её ещё не видит
  # Демон читает реестр плагинов один раз за процесс. Роль его не
  # перезапускает намеренно: рестарт оборвёт живые сессии агентов.
  ansible.builtin.debug:
    msg:
      - "Плагин orch установлен на диск."
      - "Панель появляется в дашборде после ближайшего перезапуска `aoe serve`:"
      - "  systemctl restart aoe-web   — оборвёт живые сессии, делать осознанно."
      - "Дальше правки кода подхватываются без рестарта: `aoe plugin disable`/`enable`."
  when: orch_sources.stat.exists

- name: Страница настройки цепочек
  # Отдельная служба, а не панель в AoE: панель плагина не умеет ни полей
  # ввода, ни выпадающих списков (docs/plugin-api.md), а настройка цепочки —
  # это форма. Своей карточки на дашборде у страницы нет: к ней ведёт
  # шестерёнка на карточке Agent of Empires (роль ports, INFRA_GEAR).
  when: orch_sources.stat.exists
  block:

    - name: Скрипт страницы цепочек
      ansible.builtin.copy:
        src: orch-chains
        dest: "{{ orch_bin_dir }}/orch-chains"
        owner: root
        group: root
        mode: '0755'
      register: orch_chains_script

    # Сайдбар AoE зарастает: движок архивирует сессии закрытых задач, роли
    # уходят туда сами. Архивные старше нескольких дней уезжают в корзину,
    # откуда их ещё можно вернуть; безвозвратное удаление владелец зовёт сам.
    - name: Скрипт суточной уборки сайдбара
      ansible.builtin.copy:
        src: orch-sweep
        dest: "{{ orch_bin_dir }}/orch-sweep"
        owner: root
        group: root
        mode: '0755'

    - name: Юнит и таймер уборки сайдбара
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - orch-sweep.service
        - orch-sweep.timer

    - name: Таймер уборки включён
      ansible.builtin.systemd:
        name: orch-sweep.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: Юнит страницы цепочек
      ansible.builtin.template:
        src: orch-chains.service.j2
        dest: /etc/systemd/system/orch-chains.service
        owner: root
        group: root
        mode: '0644'
      register: orch_chains_unit

    # Намеренно не обработчик: служба поднимается следующей задачей.
    - name: Перечитать systemd, если юнит изменился  # noqa: no-handler
      ansible.builtin.systemd:
        daemon_reload: true
      when: orch_chains_unit.changed

    - name: Есть ли уже юнит страницы цепочек
      ansible.builtin.stat:
        path: /etc/systemd/system/orch-chains.service
      register: orch_chains_unit_exists
      check_mode: false
      when: ansible_check_mode

    - name: Страница цепочек включена и работает
      ansible.builtin.systemd:
        name: orch-chains
        enabled: true
        state: "{{ 'restarted' if (orch_chains_script.changed or orch_chains_unit.changed) else 'started' }}"
      when: not (ansible_check_mode and not (orch_chains_unit_exists.stat.exists | default(false)))

- name: Каталог бэкапов базы задач
  ansible.builtin.file:
    path: "{{ orch_backup_dir }}"
    state: directory
    owner: "{{ base_deploy_user }}"
    group: "{{ base_deploy_user }}"
    mode: '0750'

- name: Скрипт снимка базы задач
  # Отдельным файлом, а не строкой в cron: этот же скрипт зовёт страница
  # обновлений перед сменой версии службы (`updates_services[].backup`),
  # и в двух местах он должен быть один.
  ansible.builtin.copy:
    src: orch-backup.sh
    dest: "{{ orch_bin_dir }}/orch-backup.sh"
    owner: root
    group: root
    mode: '0755'

- name: Ежедневный снимок базы задач вместе с настройками aoe
  ansible.builtin.cron:
    name: "orch: снимок базы задач"
    user: "{{ base_deploy_user }}"
    minute: "17"
    hour: "4"
    job: >-
      ORCH_STATE_DIR={{ orch_state_dir }}
      ORCH_BACKUP_DIR={{ orch_backup_dir }}
      ORCH_BACKUP_KEEP={{ orch_backup_keep }}
      {{ orch_bin_dir }}/orch-backup.sh
