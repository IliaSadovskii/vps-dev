---
# Роли и цепочки шагов — в работающий Kandev, через его же HTTP API.
#
# Почему API, а не файлы на диск: у Kandev содержимое доски живёт в SQLite,
# и у него нет каталога, который читался бы при старте (docs/configuration —
# config.yaml описывает только запуск службы). Единственный поддерживаемый
# вход — API, тот же, которым пользуется интерфейс.
#
# Порядок обязателен: сначала промпты, потом цепочки. Шаг ссылается на роль
# через `@имя`, и цепочка, приехавшая раньше своих ролей, разворачивала бы
# ссылки в пустоту.
#
# Ничего не удаляем. Ни встроенных промптов Kandev, ни цепочки «Development»,
# ни того, что человек завёл руками: роль только добавляет и обновляет своё.

- name: Сказать, почему в сухом прогоне доска не наполняется
  # uri ходит по сети и в --check, а на свежей машине службы ещё нет:
  # роль kandev поднимает её этим же прогоном, которого в сухом не было.
  ansible.builtin.debug:
    msg: >-
      Сухой прогон: наполнение доски пропускаю.
      Настоящий прогон положит роли из {{ seed_content_dir }}/prompts
      и цепочки из {{ seed_content_dir }}/workflows.
  when: ansible_check_mode

- name: Наполнение доски
  when: not ansible_check_mode
  block:

    - name: Дождаться, пока Kandev начнёт отвечать
      # Не wait_for по порту: порт открывается раньше, чем служба готова
      # отвечать по API, и первый же запрос ниже упал бы на пустом ответе.
      ansible.builtin.uri:
        url: "{{ seed_api }}/workspaces"
        method: GET
      register: seed_workspaces
      until: seed_workspaces.status == 200
      retries: "{{ (seed_wait_seconds | int / 2) | int }}"
      delay: 2
      changed_when: false

    - name: Рабочее пространство, в которое кладём
      ansible.builtin.set_fact:
        seed_workspace_id: >-
          {{ (seed_workspaces.json.workspaces
              | selectattr('name', 'equalto', seed_workspace_name) | first).id
             if seed_workspace_name
             else seed_workspaces.json.workspaces[0].id }}

    # ═══ Роли ════════════════════════════════════════════════════════════

    - name: Файлы ролей
      ansible.builtin.set_fact:
        seed_prompt_files: "{{ q('fileglob', seed_content_dir ~ '/prompts/*.md') | sort }}"

    - name: Роли, которые в Kandev уже есть
      # Именем, а не идентификатором: имя — это то, чем на роль ссылается
      # шаг (`@implement`), и то, чем её называет файл. Идентификатор
      # Kandev выдаёт сам, и в репозитории его знать неоткуда.
      ansible.builtin.uri:
        url: "{{ seed_api }}/prompts"
        method: GET
      register: seed_prompts_now
      changed_when: false

    - name: Указатель «имя роли -> запись»
      ansible.builtin.set_fact:
        seed_known: >-
          {{ dict(seed_prompts_now.json.prompts | map(attribute='name')
                  | zip(seed_prompts_now.json.prompts)) }}

    - name: Новые роли
      ansible.builtin.uri:
        url: "{{ seed_api }}/prompts"
        method: POST
        body_format: json
        body:
          name: "{{ seed_name }}"
          content: "{{ lookup('file', item) }}"
        status_code: [200, 201]
      loop: "{{ seed_prompt_files }}"
      loop_control:
        label: "{{ seed_name }}"
      vars:
        seed_name: "{{ item | basename | splitext | first }}"
      when: seed_name not in seed_known
      # uri сам о себе changed не сообщает никогда — ни на POST, ни на
      # PATCH: изменением он считает только запись файла на диск. Без
      # этой строки прогон, заводящий роли с нуля, отчитывался бы
      # `changed=0`, и правда о том, что машина изменилась, терялась.
      changed_when: true

    - name: Изменившиеся роли
      # Обновляем только своё. Встроенные промпты Kandev (`code-review`,
      # `open-pr` и прочие) редактируемы, но правит их владелец доски, а не
      # выкатка: совпадение имени с файлом здесь — повод отойти, а не писать.
      ansible.builtin.uri:
        url: "{{ seed_api }}/prompts/{{ seed_known[seed_name].id }}"
        method: PATCH
        body_format: json
        body:
          content: "{{ lookup('file', item) }}"
        status_code: [200]
      loop: "{{ seed_prompt_files }}"
      loop_control:
        label: "{{ seed_name }}"
      vars:
        seed_name: "{{ item | basename | splitext | first }}"
      when:
        - seed_name in seed_known
        - not seed_known[seed_name].builtin
        - seed_known[seed_name].content != lookup('file', item)
      changed_when: true

    - name: Роли, чьё имя занято встроенным промптом Kandev
      ansible.builtin.debug:
        msg: >-
          Роль «{{ item | basename | splitext | first }}» не положена:
          так называется встроенный промпт Kandev. Переименуйте файл,
          иначе шаги с `@{{ item | basename | splitext | first }}`
          развернутся во встроенный текст, а не в ваш.
      loop: "{{ seed_prompt_files }}"
      loop_control:
        label: "{{ item | basename }}"
      when: seed_known[item | basename | splitext | first].builtin | default(false)

    # ═══ Цепочки ═════════════════════════════════════════════════════════

    - name: Файлы цепочек
      # YAML разбираем здесь, а не в скрипте: у Ansible PyYAML есть всегда,
      # у машины — не обязательно.
      ansible.builtin.set_fact:
        seed_workflow_files: >-
          {{ seed_workflow_files | default([])
             + [{'name': item | basename,
                 'doc': lookup('file', item) | from_yaml}] }}
      loop: "{{ q('fileglob', seed_content_dir ~ '/workflows/*.yml') | sort }}"
      loop_control:
        label: "{{ item | basename }}"

    - name: Скрипт сверки цепочек
      # Лежит на машине, а не гоняется через `script`: тому модулю нечем
      # передать stdin, а входа у скрипта на десятки килобайт.
      ansible.builtin.copy:
        src: kandev-seed-workflows
        dest: "{{ seed_tool_dir }}/kandev-seed-workflows"
        mode: "0755"

    - name: Тексты ролей для подстановки в колонки
      # Ссылки `@имя` в колонках разворачивает скрипт, а не Kandev: после
      # сброса памяти и в ходе по сообщению человека Kandev отдаёт агенту
      # `@имя` буквально (проверено на v0.93.0). В файлах ссылки остаются.
      ansible.builtin.set_fact:
        seed_prompt_texts: >-
          {{ seed_prompt_texts | default({})
             | combine({item | basename | splitext | first:
                        lookup('file', item)}) }}
      loop: "{{ seed_prompt_files }}"
      loop_control:
        label: "{{ item | basename }}"

    - name: Цепочки шагов
      # Не родной импорт, а своя сверка: импорт аддитивен по имени и молча
      # пропускает занятое, а нам нужно, чтобы исправленная цепочка
      # обновилась на месте. Скрипт находит цепочку по имени, колонки — по
      # именам внутри неё, и сохраняет их идентификаторы, чтобы задачи в
      # колонках остались на месте. Подробности в шапке скрипта.
      ansible.builtin.command:
        argv: ["{{ seed_tool_dir }}/kandev-seed-workflows"]
        stdin: >-
          {{ {'api': seed_api,
              'workspace_id': seed_workspace_id,
              'prompts': seed_prompt_texts | default({}),
              'files': seed_workflow_files | default([])} | to_json }}
      register: seed_workflows
      changed_when: >-
        (seed_workflows.stdout | from_json).created | length > 0
        or (seed_workflows.stdout | from_json).updated | length > 0

    - name: Цепочки, которые не удалось обновить
      # Не падение прогона: доска в состоянии, которое требует руки человека
      # (задачи в убранной колонке, профиль агента из файла).
      ansible.builtin.debug:
        msg: "{{ item }}"
      loop: "{{ (seed_workflows.stdout | from_json).warnings }}"

    - name: Что получилось
      ansible.builtin.debug:
        msg: >-
          Доска наполнена: ролей в каталоге {{ seed_prompt_files | length }};
          цепочек создано
          {{ (seed_workflows.stdout | from_json).created | join(', ') | default('—', true) }},
          обновлено
          {{ (seed_workflows.stdout | from_json).updated | join(', ') | default('—', true) }},
          без изменений
          {{ (seed_workflows.stdout | from_json).unchanged | join(', ') | default('—', true) }}.
