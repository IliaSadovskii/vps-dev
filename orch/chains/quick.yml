# Quick — короткая дорожка: реализация тест-первой, два чтения ревью кода,
# правки, черновик PR. Одна остановка на владельце — приёмка PR. Для мелкой
# правки, где замысел ясен из текста задачи: опечатка, строка в документации,
# узкий баг с известной причиной.
#
# Чем отличается от соседних: от standard — нет разведки и плана, от deep —
# ещё и выбора решения. Ревью кода, правки и владение тестами те же самые:
# короткая дорожка экономит на замысле, а не на проверке.
#
# Почему шаги замысла выброшены целиком, а не сделаны необязательными: схема
# цепочки не знает условных шагов (`orch/src/orch/chain.py`, `_step`), и
# «пустая разведка» стоила бы хода, а решала бы ноль.
#
# `scoping.md` в этой цепочке не появится. Команды проверок, раскладку файлов
# тестов (она же `PATTERNS` скрипта владения тестами) и строку `Навыки:` роли
# берут из репозитория и текста задачи — это описано в самих промптах
# (`prompts/common-test-ownership.md`, `prompts/common-protocol.md`).
#
# Формат — orch/PLAN.md §4. Роль шага — orch/prompts/role-<id>.md,
# подагенты — sub-*.md, общие правила — common-*.md, навыки — skill-*.md.
# Модель: Claude Opus 5 с окном 1M на всех шагах, усилие medium.
name: quick
# common-test-ownership даётся не всем: скрипт владения тестами запускают
# Реализация и Ревью кода, а Правки обязаны знать, что тест им не свой.
includes: [common-protocol, common-git-safety]

# Листы автономии: пресет заполняет переключатели задачи, дальше их можно
# менять в панели по ходу. По умолчанию — как записано в шагах.
presets:
  # Пресет — это ответ на один вопрос: где владелец участвует. Ворота (задача
  # встаёт) и вопросы (роль спрашивает посреди хода) ходят парой: и то, и
  # другое — внимание владельца внутри одного шага.

  default:
    when: >-
      как записано в шагах: вопрос Реализации, если задача непонятна, и
      приёмка PR. Выбор по умолчанию, когда нет причин иначе
    set: {}

  auto:
    when: >-
      участвую только в итоге: ни ворот, ни вопросов до готового PR.
      Когда цепочке доверяешь и нужен результат
    set: { "*.after": false, "*.ask": false, pr.after: true, pr.ask: true }

  step-by-step:
    when: >-
      участвую на каждом шаге: ворота после каждого и вопросы разрешены.
      Для незнакомого проекта и когда проверяешь саму цепочку
    set: { "*.after": true, "*.ask": true }

# Память шага — `context`: `fresh` — новая сессия, `own` — заход в своей же
# прошлой сессии этого шага, `continue` — в сессии предыдущего шага. Причины
# выбора расписаны у каждого шага ниже и в `orch/chains/deep.yml:49-57`.
steps:
  - id: implementation
    includes: [common-test-ownership]
    run: { agent: claude, model: "opus[1m]", effort: medium }
    context: fresh
    # Поля `prompt` нет вовсе: Реализация здесь первый шаг, и читать ей
    # нечего. На возврате по исходу `tests` файлы Ревью кода ей называет сам
    # движок вместе с путями (`orch/src/orch/promptctx.py`, файлы отправителя),
    # так что вписывать их в `reads` и получать «этих файлов нет» на первом же
    # ходу незачем.
    artifact: [implementation.md]
    next: code-review
    # Вопрос владельцу разрешён, в отличие от deep (`deep.yml:122`): там до
    # Реализации задачу трижды уточнили, здесь — ни разу, и до ворот PR это
    # единственная точка контакта.
    human: { ask: true }

  - id: code-review
    includes: [common-test-ownership]
    run: { agent: claude, model: "opus[1m]", effort: medium }
    # Перечитка идёт в своей же сессии: свежесть взгляда живёт не здесь, а в
    # подагентах — их запускают заново на каждом заходе, и дифф читают они.
    context: own
    prompt: { reads: [implementation.md, review-fixes.md] }
    artifact: [review.md, review-defects.md, review-security.md, review-simplicity.md]
    next:
      findings: review-fixes
      tests: implementation     # находка про тесты: их правит только Реализация
      clean: pr                 # чинить нечего — сразу черновик PR
    human: { ask: false }
    limits: { max_runs: 2 }      # первое чтение и, если Правки попросят, перечитка

  - id: review-fixes
    includes: [common-test-ownership]
    run: { agent: claude, model: "opus[1m]", effort: medium }
    # Второй заход правок идёт в той же сессии: автор помнит, что уже чинил и
    # от чего отказался.
    context: own
    prompt: { reads: [review.md, review-defects.md, review-security.md, review-simplicity.md] }
    artifact: [review-fixes.md]
    next:
      review: code-review        # правки задели поведение — пусть перечитают
      ready: pr                  # закрыто, перечитывать нечего
    # Ворот здесь нет, в отличие от deep (`deep.yml:157-160`): единственная
    # остановка короткой дорожки — приёмка PR, а починенный код виден в её
    # диффе. Раз нет `after`, нельзя и `moves` — линтер отвергает `moves` без
    # `after`; вернуть работу в правки владелец может кнопкой с ворот PR.
    human: { ask: false }
    limits: { max_runs: 3 }      # круг с ревью и круг по кнопке с ворот PR

  - id: pr
    run: { agent: claude, model: "opus[1m]", effort: medium }
    context: fresh
    prompt: { reads: [implementation.md, review.md, review-fixes.md, remarks.md] }
    # `remarks.md` — заметки владельца с прошлых ворот. В `artifact` его нет
    # намеренно: он пишется после `orch done`, пока задача стоит, а движок
    # требует артефакты в момент сдачи. На первом заходе файла просто нет.
    artifact: [pull-request.md]
    next: done
    human:
      after: true                # приёмка; выключается только пресетом или руками
      ask: false
      moves: [review-fixes, implementation]
