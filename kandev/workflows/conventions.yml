# Conventions — завести или обновить файл соглашений проекта для агентов
# (AGENTS.md, CLAUDE.md с @AGENTS.md).
#
# Служебная цепочка на два хода: агент собирает соглашения по коду и
# спрашивает владельца о том, чего в коде нет, человек читает и принимает.
# Нужна до первой задачи на Deep: роли той цепочки читают этот файл первым
# после каждого сброса памяти.
#
# Возврат — заметками на Review и перетаскиванием на Conventions, когда
# мысль закончена; память не сбрасывается, агент видит все заметки.
version: 1
type: kandev_workflow
workflows:
  - name: Conventions
    description: "AGENTS.md / CLAUDE.md: собрать соглашения по коду, спросить владельца о приоритетах, отдать на приёмку."
    prompt: |
      @custom-git-safety
    steps:
      - name: Backlog
        position: 0
        color: bg-neutral-400
        prompt: &gate |
          Эта колонка — ворота человека. Человек думает вслух; ты здесь не
          работаешь. Сообщение здесь — заметка для той роли, которой человек
          перетащит карточку; она прочитает все заметки разом. Ответь одной
          строкой по-русски, что заметка записана и её прочитает следующая роль.
          Ничего не открывай, не меняй, не коммить, не вызывай step_complete_kandev
          и move_task_kandev: карточку двигает человек. На прямой вопрос, ответ на
          который уже есть в этом разговоре, ответь одним-двумя предложениями.
        events: {}
        is_start_step: true
        show_in_command_panel: false
        allow_manual_move: true
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false

      - name: Conventions
        position: 1
        color: bg-purple-500
        prompt: |
          @custom-conventions

          Колонка сейчас: Conventions. Если в этой сессии ты уже работал, карточку
          вернули сюда: прочитай все заметки человека с прошлого раза и
          действуй по ним.

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Ворота человека: прочитать файл, при PR — diff. Принять — в Done.
      # Поправить — написать, что не так, и перетащить на Conventions.
      - name: Review
        position: 2
        color: bg-yellow-500
        prompt: *gate
        events: {}
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false

      - name: Done
        position: 3
        color: bg-green-500
        prompt: *gate
        events: {}
        is_start_step: false
        show_in_command_panel: false
        allow_manual_move: true
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false
