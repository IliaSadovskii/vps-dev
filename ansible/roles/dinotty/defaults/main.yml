# Терминал в браузере (dinotty). Занял место ttyd, который стоял здесь
# раньше: на телефоне у ttyd нет ни Ctrl, ни Esc, ни стрелок — на экранной
# клавиатуре их просто нет, и настройкой это не лечится. Здесь они нарисованы
# на экране, есть свои сочетания под палец, панели, файлы рядом с консолью
# и установка на домашний экран как приложение (PWA).
#
# Порт остался прежний, 8066: закладки и карточка на дашборде те же.
# Сессии свои, не tmux: сессию `console` от ttyd он не покажет.
#
# Пароля нет, как и у остальных служб машины: границу держит Tailscale.
# Токена в настройках нет намеренно — с пустым токеном dinotty не спрашивает
# вход вовсе (это не описано в его документации, но так работает
# auth_middleware: пустой токен — пропускать всё).
dinotty_version: "0.24.3"

# Контрольных сумм рядом с релизом dinotty не публикует — в отличие от ttyd
# и File Browser, которым get_url читает SHA256SUMS прямо с GitHub. Берём то,
# что GitHub считает для вложения сам:
#   gh api repos/xichan96/dinotty/releases/tags/v0.24.3 \
#     --jq '.assets[] | select(.name|test("^dinotty-server_")) | .name+"  "+.digest'
# При смене версии обновить обе строки — иначе get_url остановится на сверке.
dinotty_deb_sha256:
  amd64: "101555dfe26bb1eefd4c213e943c38da121b386f9ba6c147e798c82764e4cc31"
  arm64: "acea6c01b9979f0973c007d924df5d047cadac21cddcb62e548c86ee6c6f664e"

# Порт из инфра-заповедника 8060-8079 (см. roles/ports/files/ports).
dinotty_port: 8066

# А на этом порту служба слушает НА САМОМ ДЕЛЕ, и он не случайно другой.
# dinotty умеет только --port и всегда садится на 0.0.0.0 — то есть занял бы
# 8066 и на адресе машины в частной сети тоже. Именно туда должен сесть
# tailscaled, чтобы отдать сервис по TLS (`ss -ltn` покажет его слушателей
# на 100.x.y.z:8060…8070) — на занятом порту он бы просто не поднялся.
#
# Поэтому служба уходит на порт вне раздаваемого диапазона 8000-8999 — тот же
# номер, только с семёркой, — а на 127.0.0.1:8066 слушает шим systemd
# (см. templates): его находит ports-web в `ss -ltn` и публикует сервис
# как любую другую службу хоста.
#
# Обратная сторона: на 7066 терминал отвечает и напрямую из частной сети,
# по http. Правилом брандмауэра это намеренно не закрыто — порядок правил
# ufw пришлось бы держать вручную, а выигрыша нет: внутри частной сети
# трафик и так шифрует Tailscale, и пароля здесь нет ни на одном входе.
# Помнить стоит один адрес — TLS на 8066, на него и ведёт дашборд.
dinotty_internal_port: 7066

# Где открывается терминал.
dinotty_cwd: "{{ base_projects_dir }}"

dinotty_config_dir: /etc/dinotty
