# Только разведка: вопрос, на который нужен ответ, а не изменение в коде.
#
# Ни одного шага, который трогает файлы, — намеренно. Итог такой доски
# читается человеком и превращается в задачу для другой доски.
version: 1
type: kandev_workflow
workflows:
  - name: Разведка
    description: "Ответить на вопрос: как это принято решать и чем."
    steps:
      - name: Вопрос
        position: 0
        color: bg-neutral-400
        is_start_step: true
        allow_manual_move: true

      - name: Как решают
        position: 1
        color: bg-purple-500
        prompt: |
          @context
          @research-web

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        allow_manual_move: true

      - name: Чем решать
        position: 2
        color: bg-purple-500
        prompt: |
          @research-libs

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        allow_manual_move: true

      - name: Варианты
        position: 3
        color: bg-purple-500
        prompt: |
          @brainstorm

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        allow_manual_move: true

      - name: Прочитать
        position: 4
        color: bg-green-500
        allow_manual_move: true
        show_in_command_panel: true
