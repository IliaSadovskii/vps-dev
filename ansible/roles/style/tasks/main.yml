# Стиль разговора агентов: один текст, четыре ссылки, страница с кнопкой.
# См. defaults/main.yml — зачем так.

- name: Каталог состояния
  ansible.builtin.file:
    path: "{{ style_state_dir }}"
    state: directory
    owner: "{{ style_user }}"
    group: "{{ style_user }}"
    mode: '0755'

- name: Заготовка текста — один раз
  # force: false — роль кладёт текст, только если файла нет. Дальше его
  # правит человек со страницы, и перезапись стёрла бы правки.
  ansible.builtin.copy:
    src: agent-style.md
    dest: "{{ style_file }}"
    owner: "{{ style_user }}"
    group: "{{ style_user }}"
    mode: '0644'
    force: false

- name: Каталог справок по машине
  ansible.builtin.file:
    path: "{{ style_machine_dir }}"
    state: directory
    owner: "{{ style_user }}"
    group: "{{ style_user }}"
    mode: '0755'

- name: Справки по машине — по одной на тему
  # Роли browser и context7 кладут сюда же свои, browser.md и context7.md.
  ansible.builtin.template:
    src: "machine-{{ item }}.md.j2"
    dest: "{{ style_machine_dir }}/{{ item }}.md"
    owner: "{{ style_user }}"
    group: "{{ style_user }}"
    mode: '0644'
  loop: [ports, mail, limits]

- name: Каталог шаблонов работы
  ansible.builtin.file:
    path: "{{ style_work_dir }}"
    state: directory
    owner: "{{ style_user }}"
    group: "{{ style_user }}"
    mode: '0755'

- name: Шаблоны работы — на них ссылаются правила блока «как работать»
  # Почему отдельный каталог и не скилл — см. style_work_dir в defaults.
  ansible.builtin.template:
    src: "work-{{ item }}.md.j2"
    dest: "{{ style_work_dir }}/{{ item }}.md"
    owner: "{{ style_user }}"
    group: "{{ style_user }}"
    mode: '0644'
  loop: [review]

- name: Как работать — общие правила для любого агента и проекта
  # Стиль работы владельца, не зависит ни от стека, ни от проекта
  # (аудит промптов 2026-10-19; раздел «Ревью» и передача по порогу
  # контекста — 2026-10-27). Первым в файле:
  # правила, читаемые раньше, держатся лучше. Свои маркеры — как у блока
  # «Эта машина» ниже.
  ansible.builtin.blockinfile:
    path: "{{ style_file }}"
    marker: "<!-- ─────── vps-dev: как работать, пишет выкатка ─────── {mark} -->"
    block: "{{ lookup('template', 'prompt-work.md.j2') }}"
    insertbefore: BOF
    owner: "{{ style_user }}"
    group: "{{ style_user }}"
    mode: '0644'

- name: Оглавление справок в общем промпте
  # Одна строка на тему: по ней видно, нужна справка или нет. Остальной
  # текст промпта пишет человек на странице :8071, поэтому пишем только
  # между своими маркерами. Пустая строка в начале блока отделяет его от
  # текста человека: файл читают и глазами, на странице.
  ansible.builtin.blockinfile:
    path: "{{ style_file }}"
    # Маркер — сам по себе разделитель: файл читают глазами на странице
    # :8071, и текст человека не должен слипаться с нашим блоком.
    # Переносом строки в маркере это не решается: blockinfile тогда не
    # находит свой же блок и дописывает второй (проверено).
    marker: "<!-- ─────── vps-dev: машина, пишет выкатка ─────── {mark} -->"
    block: "{{ lookup('template', 'prompt-machine.md.j2') }}"
    owner: "{{ style_user }}"
    group: "{{ style_user }}"
    mode: '0644'

# ═══ Ссылки в домашнем каталоге ══════════════════════════════════════

- name: Каталоги CLI, куда ведут ссылки  # noqa: risky-file-permissions
  # Права не задаём: у существующих каталогов (~/.codex — 0700, его завёл
  # сам Codex) они свои, и менять их не наше дело; новый получит umask.
  ansible.builtin.file:
    path: "/home/{{ style_user }}/{{ item.path | dirname }}"
    state: directory
    owner: "{{ style_user }}"
    group: "{{ style_user }}"
  loop: "{{ style_targets }}"
  loop_control:
    label: "{{ item.name }}"

- name: Что сейчас на месте ссылок
  ansible.builtin.stat:
    path: "/home/{{ style_user }}/{{ item.path }}"
  loop: "{{ style_targets }}"
  loop_control:
    label: "{{ item.name }}"
  register: style_present

- name: Обычный файл на месте ссылки — отложить рядом
  # Человек мог написать свои инструкции до этой роли. Не стираем: файл
  # переезжает с суффиксом .before-style, и об этом сказано в конце.
  ansible.builtin.command:
    argv:
      - mv
      - "-n"
      - "/home/{{ style_user }}/{{ item.item.path }}"
      - "/home/{{ style_user }}/{{ item.item.path }}.before-style"
  loop: "{{ style_present.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.stat.exists
    - not item.stat.islnk
  changed_when: true

- name: Ссылки на общий текст
  ansible.builtin.file:
    src: "{{ style_file }}"
    dest: "/home/{{ style_user }}/{{ item.path }}"
    state: link
    owner: "{{ style_user }}"
    group: "{{ style_user }}"
    force: true
  loop: "{{ style_targets }}"
  loop_control:
    label: "{{ item.name }}"

# ═══ Claude Code: стиль вывода, скиллы, хук передачи, без хуков aoe ═══

- name: Хук передачи по порогу контекста (context-handoff)
  # Раньше слияния в settings.json: хук ссылается на этот файл.
  ansible.builtin.copy:
    src: context-handoff
    dest: "{{ style_install_dir }}/context-handoff"
    owner: root
    group: root
    mode: '0755'
  register: style_context_handoff_file

- name: Сторож команд, стирающих базу (guard-destructive-db)
  ansible.builtin.copy:
    src: guard-destructive-db
    dest: "{{ style_install_dir }}/guard-destructive-db"
    owner: root
    group: root
    mode: '0755'

- name: Сторож арх-тестов и решений плана (guard-decisions)
  # Субагент не правит tests/Arch и раздел «Решения» плана, кроме
  # разрешения в задании; почему и как — в docstring скрипта.
  ansible.builtin.copy:
    src: guard-decisions
    dest: "{{ style_install_dir }}/guard-decisions"
    owner: root
    group: root
    mode: '0755'
  register: style_guard_decisions_file

- name: Есть ли settings.json Claude Code
  ansible.builtin.stat:
    path: "/home/{{ style_user }}/.claude/settings.json"
  register: style_claude_settings

- name: Прочитать settings.json
  ansible.builtin.slurp:
    src: "/home/{{ style_user }}/.claude/settings.json"
  register: style_claude_raw
  when: style_claude_settings.stat.exists

- name: Текущие настройки Claude Code
  ansible.builtin.set_fact:
    style_claude_now: >-
      {{ (style_claude_raw.content | b64decode | from_json)
         if style_claude_settings.stat.exists else {} }}

- name: Без хуков Agent of Empires
  # aoe дописывал свои хуки во все события, с меткой `# aoe-hooks` в конце
  # команды. aoe с машины снят (roles/paseo) — убираем их; группа, где
  # других хуков не было, уходит целиком, событие без групп — тоже.
  # Чужие хуки остаются как были.
  ansible.builtin.set_fact:
    style_claude_base: >-
      {%- set hooks = {} -%}
      {%- for event, groups in (style_claude_now.hooks | default({}, true)).items() -%}
      {%-   set kept = [] -%}
      {%-   for group in groups | default([], true) -%}
      {%-     set handlers = group.hooks | default([], true) -%}
      {%-     set others = [] -%}
      {%-     for handler in handlers -%}
      {%-       if '# aoe-hooks' not in (handler.command | default('', true) | string) %}{% set _ = others.append(handler) %}{% endif -%}
      {%-     endfor -%}
      {%-     if others | length == handlers | length %}{% set _ = kept.append(group) -%}
      {%-     elif others %}{% set _ = kept.append(group | combine({'hooks': others})) %}{% endif -%}
      {%-   endfor -%}
      {%-   if kept or not groups %}{% set _ = hooks.update({event: kept or groups}) %}{% endif -%}
      {%- endfor -%}
      {{ style_claude_now | combine({'hooks': hooks})
         if style_claude_now.hooks | default({}, true) else style_claude_now }}

- name: Желаемые outputStyle и skillOverrides
  ansible.builtin.set_fact:
    style_claude_want: >-
      {{ style_claude_base | combine({
           'outputStyle': style_claude_output_style,
           'skillOverrides': (style_claude_now.skillOverrides | default({}))
                             | combine(style_claude_skill_overrides)}) }}

- name: Чужие группы хуков PostToolBatch — начать с пустого
  # Чужие хуки в файле есть и могут появиться в этом же событии. Своя группа — та, где ровно один хук и его команда начинается
  # с пути скрипта и пробела: её убираем (порог мог поменяться) и ставим
  # заново в конец; чужие, даже если упоминают путь, остаются как были.
  # hooks: null в файле — как пусто. Циклом set_fact, а не циклом внутри
  # шаблона: шаблон с {% %} отдаёт строку, и её превращение обратно в
  # список зависит от версии Ansible. Почему PostToolBatch — см. docstring
  # скрипта.
  ansible.builtin.set_fact:
    style_claude_batch_others: []

- name: Чужие группы хуков PostToolBatch
  ansible.builtin.set_fact:
    style_claude_batch_others: "{{ style_claude_batch_others + [item] }}"
  loop: "{{ (style_claude_want.hooks | default({}, true)).PostToolBatch | default([], true) }}"
  loop_control:
    label: "{{ item | to_json | truncate(80) }}"
  when: >-
    not ((item.hooks | default([], true) | length) == 1
         and ((item.hooks | default([], true) | first).command | default('', true) | string)
             .startswith(style_install_dir ~ '/context-handoff '))

- name: Желаемый хук context-handoff в PostToolBatch
  ansible.builtin.set_fact:
    style_claude_want: >-
      {{ style_claude_want | combine({'hooks': (style_claude_want.hooks | default({}, true)) | combine({
           'PostToolBatch': style_claude_batch_others + [style_claude_context_hook]})}) }}
  vars:
    style_claude_context_hook:
      hooks:
        - type: command
          command: >-
            {{ style_install_dir }}/context-handoff
            {{ style_context_handoff_limit | int }} {{ style_context_handoff_step | int }}
          timeout: 10

- name: Чужие группы хуков PreToolUse — начать с пустого
  # Как с PostToolBatch: своя группа — один хук с одним из сторожей, в том числе
  # по прежнему пути в ~/.claude/hooks, где он жил до переноса в репозиторий.
  ansible.builtin.set_fact:
    style_claude_pre_others: []

- name: Чужие группы хуков PreToolUse
  ansible.builtin.set_fact:
    style_claude_pre_others: "{{ style_claude_pre_others + [item] }}"
  loop: "{{ (style_claude_want.hooks | default({}, true)).PreToolUse | default([], true) }}"
  loop_control:
    label: "{{ item | to_json | truncate(80) }}"
  when: >-
    not ((item.hooks | default([], true) | length) == 1
         and ((item.hooks | default([], true) | first).command | default('', true) | string)
             in [style_install_dir ~ '/guard-destructive-db',
                 style_install_dir ~ '/guard-decisions',
                 '/home/' ~ style_user ~ '/.claude/hooks/guard-destructive-db.sh'])

- name: Желаемые сторожа в PreToolUse
  ansible.builtin.set_fact:
    style_claude_want: >-
      {{ style_claude_want | combine({'hooks': (style_claude_want.hooks | default({}, true)) | combine({
           'PreToolUse': style_claude_pre_others + [style_claude_guard_hook, style_claude_decisions_hook]})}) }}
  vars:
    style_claude_guard_hook:
      matcher: Bash
      hooks:
        - type: command
          command: "{{ style_install_dir }}/guard-destructive-db"
          timeout: 10
    style_claude_decisions_hook:
      matcher: "Edit|Write|MultiEdit|NotebookEdit|Bash"
      hooks:
        - type: command
          command: "{{ style_install_dir }}/guard-decisions"
          timeout: 10

- name: Ключи outputStyle, skillOverrides и хуки context-handoff и сторожа в settings.json, без хуков aoe
  # Файлом владеет сам Claude Code (тема, уведомления, чужие хуки), поэтому
  # меняем свои ключи, вычищаем хуки aoe и переписываем остальное как было.
  ansible.builtin.copy:
    dest: "/home/{{ style_user }}/.claude/settings.json"
    owner: "{{ style_user }}"
    group: "{{ style_user }}"
    mode: '0644'
    content: "{{ style_claude_want | to_nice_json }}\n"
  when: style_claude_want != style_claude_now

- name: Без прежней копии сторожа в ~/.claude/hooks
  ansible.builtin.file:
    path: "/home/{{ style_user }}/.claude/hooks/guard-destructive-db.sh"
    state: absent

- name: Живая проверка хуков (hook-probe)
  # Claude Code может поменять формат журнала или раскладку каталогов, а
  # хуки ошибки глотают нарочно и тогда тихо перестают работать. Проба
  # гоняет установленный хук на свежем журнале субагента этой машины; что
  # и как проверяется — в docstring скрипта.
  ansible.builtin.copy:
    src: hook-probe
    dest: "{{ style_install_dir }}/hook-probe"
    owner: root
    group: root
    mode: '0755'
  register: style_hook_probe_file

- name: Где в роли лежит версия новее установленной (хук или проба)
  # В check-режиме новая версия ещё не встала, проверен прежний хук: его
  # сбой — предупреждение, а не падение выкатки.
  ansible.builtin.set_fact:
    style_hook_new:
      context-handoff: "{{ style_context_handoff_file.changed or style_hook_probe_file.changed }}"
      guard-decisions: "{{ style_guard_decisions_file.changed or style_hook_probe_file.changed }}"

- name: Хуки context-handoff и guard-decisions работают на живых журналах
  # От владельца журналов: журналы только читаются, хук идёт с временным
  # HOME. И при выкатке, и в make check. Вывод: ok / silent / moved —
  # проверено; skip — проверить было нечем.
  ansible.builtin.command:
    argv:
      - "{{ style_install_dir }}/hook-probe"
      - "{{ item }}"
      - "{{ style_install_dir }}/{{ item }}"
      - "/home/{{ style_user }}"
  loop: [context-handoff, guard-decisions]
  become: true
  become_user: "{{ style_user }}"
  register: style_hook_probes
  check_mode: false
  changed_when: false
  failed_when: false

- name: Сбой живой проверки хуков — выкатка упадёт в конце (post_tasks в site.yml)
  # Не fail здесь: остальные роли должны примениться, а итог выкатки —
  # красный (решение владельца 2026-11-11, план decisions-hold, Р10а).
  ansible.builtin.set_fact:
    style_hook_probe_failures: >-
      {{ style_hook_probe_failures | default([]) + [item.item ~ ': '
         ~ ((item.stdout | default('', true)) ~ ' ' ~ (item.stderr | default(item.msg | default(''), true))) | trim] }}
  loop: "{{ style_hook_probes.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.rc | default(1) != 0 or item.stdout | default('') is match('(silent|moved):')
    - not (ansible_check_mode and style_hook_new[item.item] | bool)

- name: ВНИМАНИЕ — живая проверка хука не прошла (проверка шла по прежней версии)
  ansible.builtin.debug:
    msg: >-
      {{ item.item }}: в роли лежит другая версия хука или пробы — она встанет при выкатке;
      проверен установленный: {{ item.stdout | default(item.msg | default(''), true) | trim }}
  loop: "{{ style_hook_probes.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.rc | default(1) != 0 or item.stdout | default('') is match('(silent|moved):')
    - ansible_check_mode and style_hook_new[item.item] | bool

# ═══ Служба ══════════════════════════════════════════════════════════

- name: Последние действия субагента (agent-log)
  ansible.builtin.copy:
    src: agent-log
    dest: "{{ style_install_dir }}/agent-log"
    owner: root
    group: root
    mode: '0755'

- name: Скрипт службы
  ansible.builtin.copy:
    src: vps-dev-style
    dest: "{{ style_install_dir }}/vps-dev-style"
    owner: root
    group: root
    mode: '0755'
  register: style_script

- name: Служба
  ansible.builtin.template:
    src: vps-dev-style.service.j2
    dest: /etc/systemd/system/vps-dev-style.service
    owner: root
    group: root
    mode: '0644'
  register: style_unit

# Намеренно не обработчик: службу поднимает следующая задача, обработчик опоздал бы.
- name: Перечитать systemd, если юнит изменился  # noqa: no-handler
  ansible.builtin.systemd:
    daemon_reload: true
  when: style_unit.changed

- name: Есть ли уже юнит
  ansible.builtin.stat:
    path: /etc/systemd/system/vps-dev-style.service
  register: style_unit_exists
  check_mode: false
  when: ansible_check_mode

- name: Служба включена и работает
  ansible.builtin.systemd:
    name: vps-dev-style
    enabled: true
    state: "{{ 'restarted' if (style_script.changed or style_unit.changed) else 'started' }}"
  when: not (ansible_check_mode and not (style_unit_exists.stat.exists | default(false)))

- name: Куда смотреть
  ansible.builtin.debug:
    msg: >-
      Общий промпт для всех агентов: порт {{ style_port }} на дашборде, текст в
      {{ style_file }}, ссылки:
      {{ style_targets | map(attribute='path') | join(', ') }}.
      {% set moved = style_present.results | selectattr('stat.exists') | rejectattr('stat.islnk') | map(attribute='item.path') | list %}
      {% if moved %}Прежние файлы отложены рядом с суффиксом .before-style: {{ moved | join(', ') }} — перенесите из них нужное на страницу.{% endif %}
