[defaults]
# Два источника. /servers.yml — реестр машин, он лежит в корне infra/
# и смонтирован в контейнер отдельным файлом; inventory/ — всё остальное,
# что инвентарь знает, но машиной не является.
inventory            = /servers.yml,inventory
# Пути к ролям задаются здесь, а не переменной окружения в образе.
# Раньше строка была ниже по приоритету, чем ANSIBLE_ROLES_PATH из Dockerfile,
# и не действовала вовсе: поправить её было нельзя, а исчезни переменная —
# виноватой выглядела бы именно она.
roles_path           = roles:/usr/share/ansible/roles
host_key_checking    = True
# Понятный вывод: результат каждой задачи в читаемом виде.
# Раньше для этого ставили отдельный плагин, теперь это встроенный параметр.
result_format        = yaml
# Заметно ускоряет прогон: Ansible собирает сведения о сервере один раз
# и держит их сутки, вместо того чтобы опрашивать при каждом запуске.
fact_caching         = jsonfile
fact_caching_connection = .facts
# Час, а не сутки: после перезагрузки или смены имени решения не должны
# приниматься по вчерашним данным.
fact_caching_timeout = 3600
# Работа идёт по одному серверу, параллелить нечего.
forks                = 5
# Не спрашивать пароль sudo: доступ по ключу, пользователь в группе sudo.
become_ask_pass      = False
interpreter_python   = auto_silent
# Только local_tmp — каталог на УПРАВЛЯЮЩЕЙ машине. Ansible работает
# в контейнере, где домашнего каталога пользователя нет.
#
# remote_tmp (каталог на сервере) намеренно оставлен по умолчанию: там
# домашние каталоги есть, а фиксированное имя в общедоступном /tmp создало
# бы каталог с правами root, куда потом не запишется задача от deploy.
local_tmp            = /tmp/.ansible-local
# Полное имя обязательно: короткое молча не срабатывает, и тайминги
# задач просто не выводятся.
callbacks_enabled    = ansible.posix.profile_tasks
# Файлы .retry не нужны: хост один, повторять выборочно нечего.
retry_files_enabled  = False
timeout              = 30

[ssh_connection]
# Держать соединение открытым между задачами: без этого каждая задача
# заново поднимает SSH-сессию, и прогон растягивается втрое.
pipelining           = True
# Отпечатки ключей серверов лежат рядом с кодом: домашний каталог
# смонтирован только на чтение, дописать туда нельзя.
ssh_args             = -o ControlMaster=auto -o ControlPersist=300s -o PreferredAuthentications=publickey -o UserKnownHostsFile=/work/known_hosts -o IdentitiesOnly=yes
