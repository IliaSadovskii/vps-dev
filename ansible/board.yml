# Наполнение доски Kandev — с самой машины, без секретов и без SSH.
#
# Отдельный сценарий, а не site.yml с тегом. Причина не в скорости: site.yml
# заходит на машину по ключу SSH и знает пароль root, а оба лежат в секретах
# форка и на самой машине их нет — и быть не должно. Роли seed не нужно
# ни то, ни другое: она ходит только на 127.0.0.1, где у Kandev
# аутентификация выключена (см. roles/kandev/templates/config.yaml.j2).
#
# Отсюда и `become: false`: наполнение доски — не действие суперпользователя,
# и просить sudo ради HTTP-запроса на loopback значило бы просить его зря.

- name: Роли и цепочки — в Kandev на этой машине
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  # Порт берём из defaults роли kandev, а не переписываем сюда числом:
  # второй источник правды о номере порта однажды разошёлся бы с первым,
  # и разошёлся бы молча — запрос просто ушёл бы в никуда.
  vars_files:
    - roles/kandev/defaults/main.yml

  roles:
    - role: seed
      tags: [seed]
