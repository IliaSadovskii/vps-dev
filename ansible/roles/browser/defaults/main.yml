---
# Браузер для агентов: общий контейнер с Chromium, агенты водят его с хоста.
#
# ЗАЧЕМ. Агент пишет интерфейс и не видит его. Ему нужен браузер, чтобы
# открыть свою же страницу, кликнуть, снять экран, прочитать консоль и
# прогнать сквозной сценарий.
#
# ПОЧЕМУ В КОНТЕЙНЕРЕ. Проекты живут в докере и свои тесты гоняют внутри
# своих образов — серверу для этого не нужно ничего. Единственный, кому
# браузер нужен на этой стороне, — агент, а он работает на хосте. Ставить
# ради него полгигабайта браузера и десяток системных библиотек в хост
# незачем: браузер живёт в контейнере, а на хосте остаётся тонкий
# посредник (Playwright MCP), который подключается к нему по отладочному
# протоколу Chrome. Тот же адрес доступен и контейнерам проектов, если
# им понадобится браузер без своего образа.
#
# СЕТЬ — HOST, как у vps-proxy: браузер должен видеть 127.0.0.1:80xx —
# порты проектов, дашборд, Kandev. С bridge-сетью пришлось бы объяснять
# каждому проекту, каким именем его звать.

# Образ: официальный от Playwright, той же версии, что посредник, — иначе
# протокол может разъехаться. Тег с датой, а не latest: браузер обновляется
# сменой строки здесь, а не молча под работающими проверками.
browser_image: "mcr.microsoft.com/playwright:v1.63.0-noble"
browser_container: vps-browser

# Куда контейнер пускает отладочный протокол. Только loopback: наружу
# ничего не отдаём, а хосту и другим контейнерам этого адреса достаточно.
# 9222 — общепринятый порт Chrome DevTools Protocol, вне диапазона портов
# проектов (80xx/90xx), см. RESERVED_BASES в roles/ports/files/ports.
browser_cdp_host: 127.0.0.1
browser_cdp_port: 9222

# Потолок памяти. У машины 8 ГБ, на ней же Kandev, агенты и проекты;
# без потолка одна тяжёлая страница вытеснит их в своп. Полтора гигабайта
# хватает на несколько вкладок, а лишнее браузер отдаёт назад.
browser_memory_limit: 1500m
# Разделяемая память: у контейнера её по умолчанию 64 МБ, и Chromium на
# этом падает на первой же странице с картинками.
browser_shm_size: 1g

# Каталог состояния: описание контейнера и профиль браузера.
browser_state_dir: /var/lib/vps-dev/browser

# От чьего имени работают агенты — им прописываются настройки MCP.
browser_user: "{{ base_deploy_user }}"

# Посредник: MCP-сервер Playwright, ставится глобально npm. Версии у него
# свои (0.0.x) и с версией Playwright не совпадают — не путать с тегом
# образа выше. Закрепляем: инструмент, который агенты зовут в каждой
# задаче, не должен меняться сам по себе.
browser_mcp_package: "@playwright/mcp@0.0.80"
# Имя команды, которую даёт этот пакет.
browser_mcp_command: /usr/bin/playwright-mcp
# Имя, под которым инструмент видят агенты. Короткое: оно мелькает в
# каждом вызове.
browser_mcp_name: browser

# Справочник по машине — роль дописывает в него раздел про браузер между
# своими маркерами. Тот же путь, что style_machine_file у роли style:
# роли не видят defaults друг друга, поэтому он назван здесь ещё раз.
# В общий промпт браузер не пишется: там на весь справочник пять строк
# указателя, и это осознанно — промпт читается на каждом ходу.
browser_prompt_file: /var/lib/vps-dev/style/machine.md
