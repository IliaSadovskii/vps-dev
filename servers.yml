# Реестр машин.
#
# Единственное место, где перечислены серверы. Отсюда их берёт Ansible,
# отсюда же может брать любой другой инструмент: это обычный YAML.
#
# Добавить машину — дописать блок в hosts. Больше нигде ничего править
# не надо: команды сами покажут её в списке и предложат выбрать.
#
# Адрес в частной сети здесь НЕ хранится. Машина входит в сеть под своим
# именем, и адрес всегда можно спросить у самой сети. Хранить его значило
# бы завести копию, которая однажды разъедется с реальностью.

all:
  children:
    dev:
      hosts:
        # Образец. Свою машину заводи командой: make new h=имя ip=адрес
        #
        #   vps-dev-fsn1:
        #     dev_public_address: 1.2.3.4
        #     dev_provider: Hetzner
        #     dev_hardware: "CX32 — 4 ядра, 8 ГБ"
        #     # Отпечаток дописывается после первой выкатки — она его покажет.
        #     dev_host_fingerprint: "SHA256:…"
        dev-hel1-3:
          dev_public_address: 2.29.16.226
          dev_provider: Hetzner
          dev_hardware: "4 ядра, 8 ГБ, 80 ГБ диск"
          # Сверен 2026-09-02 по ssh_host_ed25519_key.pub на самой машине.
          dev_host_fingerprint: "SHA256:ikel9bPoT8sYhfX6vQ/xBOywUd6n8Ep3OO9ocUpu9oA"

      vars:
        # ═══ Кто ходит на эти машины ═════════════════════════════════════
        #
        # Открытые ключи, которым разрешён вход. Закрытые части лежат
        # у владельцев; сюда попадают только открытые — их не жалко хранить
        # в репозитории.
        #
        # Список — единственный источник правды о том, кому можно войти.
        # Убрал строку, прогнал настройку — доступ отозван: задача стирает
        # с машины все ключи, которых здесь нет.
        #
        # Ключей должно быть минимум два, с разных машин. Иначе поломка
        # одной из них означает потерю управления сервером.
        base_deploy_ssh_keys:
          - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPR0SuaUoQ9pHUW5jOsCX4wM1UCtW16j/0QBSV8PlwmE vps-dev-runner → vps-dev"
          # - "ssh-ed25519 AAAA… github-actions"
          # - "ssh-ed25519 AAAA… ноутбук"

        # Пароль root. Нужен ровно для одного: аварийного входа через
        # веб-консоль провайдера, когда сеть недоступна и по SSH не зайти.
        # По SSH бесполезен — вход по паролю запрещён целиком.
        #
        # Берётся из окружения, а не хранится здесь: у каждой машины должен
        # быть свой. Один хеш в репозитории означал бы один пароль на весь парк.
        base_root_password: "{{ lookup('env', 'VPS_DEV_ROOT_PASSWORD') | default('', true) }}"


        # ═══ Что ставится на машину ══════════════════════════════════════
        #
        # CLI агентов. Ни один не зашит: Kandev работает с ними через ACP
        # одинаково, поэтому набор — вопрос вкуса и подписок владельца.
        # Убрал строку — на машине его не будет.
        #
        # Вход в каждый проходит человек, браузером, один раз. Автоматизировать
        # нельзя: свой OAuth в чужом коде запрещён у всех провайдеров.
        dev_agent_clis:
          - claude
          - codex
          - gemini
          - opencode

        # Версия Kandev. Точная, а не latest: релизы выходят раз в два дня,
        # миграции схемы применяются при старте, и откат на старый образ
        # против мигрированной базы не гарантирован.
        kandev_version: "0.93.0"

        # ═══ Как подключаться ════════════════════════════════════════════
        # Куда подключаться по умолчанию. Обвязка почти всегда перебивает это
        # адресом из частной сети, найденным по имени машины; публичный адрес
        # остаётся запасным путём.
        ansible_host: "{{ dev_public_address }}"

        # Пользователь постоянный. На свежей машине его ещё нет — туда
        # обвязка заходит под root (передаёт dev_bootstrap_user=root) и
        # заводит его сама, а роль base посреди прогона переключается на dev.
        #
        # Именно через отдельную переменную, а не через -e ansible_user=root:
        # extra-var сильнее любого set_fact, и переключение на dev в роли
        # base молча не срабатывало бы — весь первый прогон шёл бы под root,
        # а первый же обрыв соединения после закрытия root-входа ронял бы
        # его с UNREACHABLE. Ровно так один раз и случилось.
        ansible_user: "{{ dev_bootstrap_user | default(dev_login_user) }}"
        # Имя постоянного пользователя — одно место на всё: и для входа
        # (ansible_user, make ssh), и для роли base (base_deploy_user).
        dev_login_user: dev
        base_deploy_user: "{{ dev_login_user }}"
        # Путь внутри контейнера. Сам файл ключа монтируется туда обвязкой.
        ansible_ssh_private_key_file: /ssh/key
