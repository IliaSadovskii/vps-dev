---
# Обновление служб машины кнопкой, без похода в терминал и без правки
# репозитория.
#
# ЗАЧЕМ. Версии служб закреплены в репозитории — это правильно для новой
# машины, но плохо для живой: чтобы поднять Kandev, приходится править
# файл, коммитить и катить. А форк отдан другим людям, и присылать
# владельцу пул-реквест ради своей же машины никто не станет.
#
# КАК СНЯТА ГЛАВНАЯ ЛОВУШКА. Обновление на машине живёт ровно до
# следующей выкатки: она вернёт то, что записано в файлах репозитория.
# Поэтому выбранная версия пишется в отдельный файл на машине
# ({{ updates_overrides_file }}), которого в репозитории нет, а сценарий
# читает его первым делом (см. pre_tasks в site.yml). Версия из
# репозитория остаётся значением по умолчанию: она нужна свежей машине и
# тому, кто ничего не трогал.
#
# ВОЗВРАТ. Две дороги, обе без терминала. Точечная: у службы, которую
# обновляли, на странице есть кнопка «вернуть» с прежней версией — она
# ставится тем же путём. Общая: кнопка «сбросить все версии» стирает файл
# целиком, и следующая выкатка возвращает машину ровно к репозиторию.
#
# ПОЧЕМУ НЕ «ОБНОВИТЬ ВСЁ». Одной кнопкой ехало бы девять служб разом, и
# когда что-то сломается, виновника пришлось бы искать перебором. Здесь
# только поштучно.

# Порт из инфра-заповедника 8060-8079, следом за общим промптом.
updates_port: 8072

# Каталог состояния: очередь заданий, журналы прогонов, кэш версий.
updates_state_dir: /var/lib/vps-dev/updates

# Файл выбранных версий. НЕ в репозитории и намеренно: это состояние
# конкретной машины. Сценарий подхватывает его в pre_tasks.
updates_overrides_file: /var/lib/vps-dev/versions.yml

# Копия репозитория на машине — из неё запускается выкатка одной роли.
# Её кладёт scripts/lib.sh (ansible_pull_run) при каждом прогоне, значит
# она свежа настолько, насколько давно катили. Обновление службы это не
# ломает: меняется только номер версии, а роли берутся из этой копии —
# те, что и так стоят на машине.
updates_repo_dir: "/home/{{ base_deploy_user }}/.vps-dev/src"

# От чьего имени работает страница. Само обновление делает не она, а
# служба-исполнитель от root: страница только кладёт задание в очередь.
updates_user: "{{ base_deploy_user }}"

updates_install_dir: /usr/local/bin

# ═══ Что умеем обновлять ═════════════════════════════════════════════
#
# Поля записи:
#   id       — короткое имя в очереди и в журнале
#   name     — как показывать человеку
#   var      — переменная версии, её и пишем в файл выбранных версий
#   tags     — метки ролей, которые надо прогнать после смены версии
#   source   — где смотреть, что вышло: github (владелец/репозиторий)
#              или npm (имя пакета)
#   ref      — сам адрес источника
#   strip_v  — у тега релиза срезать ведущую «v» (в переменной версии её
#              нет; сверяется по значению из репозитория)
#   warn     — чем рискуем: показывается рядом с кнопкой
#   backup   — снять снимок базы перед обновлением (только Kandev)
#
# Чего здесь нет и почему: caddy стоит на плавающем теге 2-alpine и
# обновляется сам; браузер привязан к версии Playwright и меняется вместе
# с посредником; Ansible на машине (pull) обновлять с этой же страницы
# нельзя — она бы дёргала стул, на котором сидит.
updates_services:
  - id: kandev
    name: Kandev
    var: kandev_version
    tags: [kandev]
    source: npm
    ref: kandev
    strip_v: true
    backup: true
    warn: >-
      Применяет миграции базы при старте, и обратной дороги у них нет.
      Перед обновлением снимается снимок базы; возврат версии без
      восстановления снимка может не подняться.
  - id: aoe
    name: Agent of Empires
    var: aoe_version
    tags: [aoe]
    source: github
    ref: agent-of-empires/agent-of-empires
    strip_v: false
    warn: >-
      Держит сессии агентов в tmux; после обновления идущие сессии лучше
      перезапустить.
  - id: codeserver
    name: VS Code
    var: codeserver_version
    tags: [codeserver]
    source: github
    ref: coder/code-server
    strip_v: true
  - id: dinotty
    name: Терминал
    var: dinotty_version
    tags: [dinotty]
    source: github
    ref: xichan96/dinotty
    strip_v: true
  - id: files
    name: Файлы
    var: files_version
    tags: [files]
    source: github
    ref: filebrowser/filebrowser
    strip_v: true
  - id: monitor
    name: Мониторинг
    var: monitor_version
    tags: [monitor]
    source: github
    ref: henrygd/beszel
    strip_v: true
  - id: logs
    name: Dozzle
    var: logs_image
    tags: [logs]
    source: github
    ref: amir20/dozzle
    strip_v: false
    image: "amir20/dozzle:{tag}"
  - id: mail
    name: Почта
    var: mail_image
    tags: [mail]
    source: github
    ref: axllent/mailpit
    strip_v: false
    image: "axllent/mailpit:{tag}"
  - id: dbclient
    name: DbGate
    var: dbclient_image
    tags: [dbclient]
    source: github
    ref: dbgate/dbgate
    strip_v: true
    image: "dbgate/dbgate:{tag}"

# Как часто спрашивать источники, что вышло. Релизы выходят не чаще
# нескольких раз в неделю, поэтому раз в час — с запасом.
updates_poll_seconds: 3600
