# Журналы контейнеров в браузере (Dozzle).

logs_dir: /srv/vps-dev/logs

# Версия закреплена: пустое значение (или latest) означало бы «последняя»,
# и один и тот же прогон в разные дни ставил бы разное. Взято из образца
# у листейта — свежая на момент написания роли и там же проверена в деле.
logs_image: amir20/dozzle:v10.8.0

# Порт на адресе частной сети. Первый в инфра-диапазоне 8060-8079
# (см. bin/ports в /home/dev/vps): 8060 — Dozzle, 8061 — DbGate.
logs_port: 8060

logs_container_name: vps-dev-logs

# Он ничего не хранит и не считает — просто читает поток от Docker.
# 96 МБ с запасом при обычном расходе около 47.
logs_memory_limit: 96m
