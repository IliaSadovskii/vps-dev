# Agent of Empires (aoe) — поговорить с агентом в терминале или из браузера,
# без доски. Ставим на хост, тем же официальным установщиком, что описан
# в github.com/agent-of-empires/agent-of-empires/docs/installation.md —
# curl-скрипт scripts/install.sh или `brew install aoe`. Здесь не то и не
# другое: install.sh всегда качает "latest" через GitHub API (проверено
# чтением самого скрипта — переменной для версии в нём нет), а brew есть
# не на всех хостах. Поэтому качаем архив релиза сами, тем же URL и той же
# схемой имени файла, что использует их install.sh, но с версией
# зафиксированной, а не "последней".
aoe_version: "v1.15.2"

aoe_install_dir: /usr/local/bin

# Веб-панель. По умолчанию включена: официальный бинарник с GitHub Releases
# уже несёт её в себе — проверено запуском `aoe serve` из скачанного
# архива, отдаёт полноценный дашборд без какой-либо досборки. README
# описывает `--features web` только для сборки ИЗ ИСХОДНИКОВ (нужен
# Node.js и C-тулчейн для SQLite/libgit2/OpenSSL/liblzma/AWS-LC) — но это
# путь для того, кто сам собирает aoe, а не для готового релизного архива,
# которым ставит эта роль. Тулчейн на машину поэтому не идёт, он не нужен.
aoe_web_enabled: true

# Порт — из общего реестра инфраструктурных портов машины (см. README
# vps-dev и roles/kandev/defaults): 8064 занят Kandev, 8065 — aoe.
aoe_web_port: 8065
