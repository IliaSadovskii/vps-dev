# Проверка, что новый доступ работает. Выполняется МЕЖДУ выдачей ключей
# пользователю и закрытием входа под root (см. порядок в tasks/main.yml).
#
# Зачем: следующий шаг (ssh.yml) запрещает вход под root по сети. Если ключи
# в списке окажутся неверными или с опечаткой, мы закроем единственную
# работающую дверь и останемся снаружи. Дальше — только веб-консоль
# провайдера и пароль root из менеджера паролей.
#
# Это то самое правило «сначала проверить доступ, потом закрывать старый».

- name: Сказать, что в pull-режиме вход проверять нечем и незачем
  # Прогон уже идёт на самой машине под {{ base_deploy_user }} с sudo —
  # то есть новая дверь не просто открыта, мы в неё уже вошли.
  ansible.builtin.debug:
    msg: "Прогон идёт на самой машине под {{ base_deploy_user }} — вход уже подтверждён самим этим прогоном."
  when: dev_pull_mode | default(false) | bool

- name: Проверить вход под {{ base_deploy_user }}
  # Заходим на сервер его же средствами, как это сделал бы человек.
  # delegate_to: localhost — команда выполняется на управляющей машине
  # (в контейнере ansible-runner), то есть проверяется настоящий путь
  # снаружи, а не изнутри сервера.
  ansible.builtin.command:
    argv:
      - ssh
      - -o
      - BatchMode=yes
      - -o
      - ConnectTimeout=10
      # Отпечаток хоста здесь не проверяем намеренно: на свежей машине
      # его ещё нет в списке известных. Подлинность подтверждается тем,
      # что мы только что настроили эту машину по тому же адресу.
      - -o
      - StrictHostKeyChecking=no
      - -o
      - UserKnownHostsFile=/dev/null
      - -i
      # Явно из данных хоста: при выполнении на управляющей машине обычные
      # переменные подключения разрешаются неоднозначно (мы делегировали
      # выполнение на localhost, а не на inventory_hostname).
      - "{{ hostvars[inventory_hostname].ansible_ssh_private_key_file }}"
      - "{{ base_deploy_user }}@{{ hostvars[inventory_hostname].ansible_host }}"
      # Проверяем не только вход, но и права администратора: сразу после
      # этого шага вход под root закрывается, и всё дальше держится на sudo.
      - "sudo -n true"
  delegate_to: localhost
  become: false
  register: access_check
  changed_when: false
  failed_when: false
  check_mode: false
  when: not (dev_pull_mode | default(false) | bool)

- name: Остановиться, если вход не работает
  # В сухом прогоне на свежей машине пользователя ещё нет — проверять
  # нечего, и падение здесь остановило бы саму возможность посмотреть,
  # что вообще будет сделано.
  when:
    - not ansible_check_mode
    - not (dev_pull_mode | default(false) | bool)
  ansible.builtin.assert:
    that: access_check.rc == 0
    fail_msg: >
      Не удалось войти как {{ base_deploy_user }}@{{ hostvars[inventory_hostname].ansible_host }}.
      Настройка остановлена ДО закрытия входа под root — доступ к серверу
      сохранён. Проверь список base_deploy_ssh_keys в servers.yml: там
      должен быть открытый ключ той машины, с которой запускаешь.
      Ошибка: {{ access_check.stderr | default('нет вывода') | trim }}
    success_msg: "Вход под {{ base_deploy_user }} работает — можно закрывать root"
