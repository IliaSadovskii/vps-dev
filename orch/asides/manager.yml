# Менеджер проекта — побочная роль (`ASIDE-PLAN.md` §11). Просыпается, когда
# задача доведена до конца или снята, и делает две вещи, которых не делает
# ни один шаг цепочки: смотрит на законченную задачу целиком и сверяет с ней
# бэклог.
#
# Памяти между прогонами у него нет и ни у кого нет: копилки сняты
# (2026-09-09). Всё, что стоит помнить дольше одной задачи, уезжает в
# документацию проекта — туда, где это прочтёт и человек, и любая роль с
# первого взгляда. Поэтому у Менеджера своя копия проекта и право коммитить:
# он открывает PR с правкой документов, а владелец читает и решает. Не
# созрело до документа — не помним вовсе.
#
# Бэклог он сверяет потому, что законченная задача может сделать лежащие в
# нём заявки неверными, а увидеть это некому: шаг видит свою задачу,
# владелец смотрит доску глазами. Задачи он не двигает.
name: manager
title: Менеджер проекта
# Знак служебной сессии в сайдбаре — как у Наладчика и стенда.
icon: "📋"
scope: project
enabled: false

workspace: task            # копия задачи — читать, что было сделано
mirror: worktree:project   # своя копия проекта — писать документацию в свою ветку
rights: [read, patch, pr]
# Просыпается один раз — на закрытии задачи. Второй ход про запас: сессия
# может умереть на полпути, и движок заведёт её заново.
budget: { runs_per_task: 2 }

wakes:
  - on: [done, closed]
    title: Задача доведена до конца или снята
    prompt: role-manager
    run: { agent: claude, model: sonnet, effort: medium }
