# Значения по умолчанию роли heartbeat.

# Сервер уведомлений — публичный ntfy.sh, а не свой. Свой сервер за
# Tailscale здесь стоял и был снят: телефон и так получает уведомления
# через ntfy.sh идеально, а лишняя служба на машине — лишнее место, где
# что-то ломается. Цена: на публичном сервере имя топика — это пароль,
# угадавший строку читает всё, что в неё публиковали. Поэтому ntfy_topic
# хранится секретом (VPS_DEV_NTFY_TOPIC) и должен быть длинной случайной
# строкой, а не словом.
heartbeat_ntfy_url: "https://ntfy.sh"

# Топик берётся из окружения: scripts/lib.sh включает VPS_DEV_NTFY_TOPIC
# в SECRETS — список всего, что вообще доезжает до контейнера с Ansible.
# Имя без префикса роли намеренно: топик общий для всего, что на машине
# шлёт уведомления, а не принадлежность heartbeat.
ntfy_topic: "{{ lookup('env', 'VPS_DEV_NTFY_TOPIC') | default('', true) }}"

# Как часто проверять машину. Пять минут — тот же порядок величины, с каким
# человек вообще смотрит на дашборд; чаще незачем, реже — узнаём о беде
# с опозданием на полчаса.
heartbeat_interval: "5min"

# Ниже этого свободного места на диске — уже повод сказать вслух: место
# кончается всегда неожиданно, и лучше узнать заранее, чем когда что-то
# перестанет запускаться.
heartbeat_disk_free_min_percent: 10

# Ключевые службы, без которых машина фактически не работает по назначению.
# docker держит все контейнеры (kandev, aoe, дашборд и так далее), tailscaled —
# единственный вход на машину: наружу не смотрит ничего, кроме частной сети
# (см. ansible/site.yml).
heartbeat_watched_services:
  - docker
  - tailscaled
