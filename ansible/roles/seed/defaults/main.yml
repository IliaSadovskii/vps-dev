# Наполнение доски Kandev: роли агентов и цепочки шагов.
#
# Роль kandev ставит и охраняет службу; эта — кладёт в неё содержимое.
# Разделены намеренно: служба меняется редко и ломается дорого, содержимое
# правится каждый день и не должно требовать выкатки самой доски.

# Откуда берётся содержимое. Каталог верхнего уровня, а не files/ внутри
# роли: он самодостаточен и однажды уедет в отдельный репозиторий целиком
# (см. kandev/README.md). Ansible до него добирается путём, а не lookup'ом
# по имени роли, — чтобы этот переезд был переносом каталога, а не
# переписыванием роли.
seed_content_dir: "{{ playbook_dir }}/../kandev"

# Куда складывать. Тот же адрес, на котором служба слушает у роли kandev.
# Аутентификация у Kandev по умолчанию выключена, а слушает он только
# loopback — поэтому запросы идут без ключа и только с самой машины.
seed_api: "http://127.0.0.1:{{ kandev_port }}/api/v1"

# Рабочее пространство, в которое кладём цепочки. Пустая строка — «первое,
# какое есть»: на свежей машине Kandev заводит ровно одно («My projects»),
# и называть его в переменной значило бы дублировать чужое умолчание.
seed_workspace_name: ""

# Сколько ждать службу. Роль kandev запускает её этим же прогоном, и
# несколько секунд между стартом и готовностью HTTP — норма, а не сбой.
seed_wait_seconds: 60
