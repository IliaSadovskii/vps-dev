# fail2ban для sshd.
#
# Обоснование мягких порогов — в defaults/main.yml, дословно из старого
# setup-server.sh: вход только по ключу, поэтому перебор пароля невозможен
# в принципе, а жёсткие пороги с эскалацией срока раньше приводили
# к самобану владельца при входе с динамического IP.

- name: Настройки fail2ban для sshd
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: '0644'
    owner: root
    group: root
  notify: Перечитать fail2ban

- name: Есть ли уже служба fail2ban
  # Сухой прогон на свежей машине пакет не ставит, а systemd не умеет
  # проверять службу, которой нет, — задача ниже упала бы. На настроенной
  # машине служба на месте, и здесь всё проверяется как обычно.
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/fail2ban.service
  register: base_fail2ban_unit
  check_mode: false
  # Только в сухом прогоне: на настоящем это лишний круг по SSH,
  # а условия ниже без сухого прогона и так истинны.
  when: ansible_check_mode

- name: Служба fail2ban включена
  ansible.builtin.systemd_service:
    name: fail2ban
    state: started
    enabled: true
  when: not (ansible_check_mode and not (base_fail2ban_unit.stat.exists | default(false)))
