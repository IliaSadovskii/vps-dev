# Реестр машин — единственный файл, который правит владелец форка.
#
# Здесь только своё: машины, ключи доступа, набор CLI агентов. Всё, что
# меняется вместе с этим репозиторием (версии, как подключаться, откуда
# брать пароль root), лежит в ansible/inventory/dev.yml — поэтому Sync fork
# не приносит конфликтов в этот файл.
#
# Отсюда машины берёт Ansible, отсюда же может брать любой другой
# инструмент: это обычный YAML. Добавить машину — дописать блок в hosts.
#
# Адрес в частной сети здесь НЕ хранится. Машина входит в сеть под своим
# именем, и адрес всегда можно спросить у самой сети. Хранить его значило
# бы завести копию, которая однажды разъедется с реальностью.

all:
  children:
    dev:
      hosts:
        # Образец. Свою машину заводи командой: make new h=имя ip=адрес
        #
        #   vps-dev-fsn1:
        #     dev_public_address: 1.2.3.4
        #     dev_provider: Hetzner
        #     dev_hardware: "CX32 — 4 ядра, 8 ГБ"
        #     # Отпечаток дописывается после первой выкатки — она его покажет.
        #     dev_host_fingerprint: "SHA256:…"
        dev-hel1-3:
          dev_public_address: 2.29.16.226
          dev_provider: Hetzner
          dev_hardware: "4 ядра, 8 ГБ, 80 ГБ диск"
          # Сверен 2026-09-02 по ssh_host_ed25519_key.pub на самой машине.
          dev_host_fingerprint: "SHA256:ikel9bPoT8sYhfX6vQ/xBOywUd6n8Ep3OO9ocUpu9oA"

      vars:
        # ═══ Кто ходит на эти машины ═════════════════════════════════════
        #
        # Открытые ключи, которым разрешён вход. Закрытые части лежат
        # у владельцев; сюда попадают только открытые — их не жалко хранить
        # в репозитории.
        #
        # Список — единственный источник правды о том, кому можно войти.
        # Убрал строку, прогнал настройку — доступ отозван: задача стирает
        # с машины все ключи, которых здесь нет.
        #
        # Ключей должно быть минимум два, с разных машин. Иначе поломка
        # одной из них означает потерю управления сервером.
        base_deploy_ssh_keys:
          - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPR0SuaUoQ9pHUW5jOsCX4wM1UCtW16j/0QBSV8PlwmE vps-dev-runner → vps-dev"
          # - "ssh-ed25519 AAAA… github-actions"
          # - "ssh-ed25519 AAAA… ноутбук"

        # ═══ Что ставится на машину ══════════════════════════════════════
        #
        # CLI агентов. Ни один не зашит: Kandev работает с ними через ACP
        # одинаково, поэтому набор — вопрос вкуса и подписок владельца.
        # Убрал строку — на машине его не будет.
        #
        # Вход в каждый проходит человек, браузером, один раз. Автоматизировать
        # нельзя: свой OAuth в чужом коде запрещён у всех провайдеров.
        dev_agent_clis:
          - claude
          - codex
          - gemini
          - opencode
