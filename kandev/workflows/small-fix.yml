# Мелкая правка: понятно, что делать, разведка и план были бы церемонией.
#
# Те же роли @implement и @verify, что в feature.yml, — ровно ради этого
# промпты и вынесены в отдельную сущность.
version: 1
type: kandev_workflow
workflows:
  - name: Мелкая правка
    description: Без разведки и плана — сразу работа, проверка, ревью.
    steps:
      - name: Входящие
        position: 0
        color: bg-neutral-400
        is_start_step: true
        allow_manual_move: true

      - name: Работа
        position: 1
        color: bg-blue-500
        prompt: |
          @context
          @implement

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        allow_manual_move: true

      - name: Проверка
        position: 2
        color: bg-blue-500
        prompt: |
          @verify
          @review-self
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        allow_manual_move: true

      - name: На ревью
        position: 3
        color: bg-yellow-500
        allow_manual_move: true
        show_in_command_panel: true

      - name: Готово
        position: 4
        color: bg-green-500
        allow_manual_move: true
