# Переменные группы dev, которые принадлежат этому репозиторию, а не форку.
#
# Форк правит только servers.yml (машины, ключи, набор агентов). Всё, что
# обновляется вместе с кодом — версии, способ подключения, откуда берётся
# пароль root, — лежит здесь, чтобы Sync fork не давал конфликтов
# в servers.yml. Ansible складывает переменные группы из обоих файлов.

all:
  children:
    dev:
      vars:
        # ═══ Версии ══════════════════════════════════════════════════════

        # Версия Kandev. Точная, а не latest: релизы выходят раз в два дня,
        # миграции схемы применяются при старте, и откат на старый образ
        # против мигрированной базы не гарантирован.
        kandev_version: "0.93.0"

        # ═══ Пароль root ═════════════════════════════════════════════════
        #
        # Нужен ровно для одного: аварийного входа через веб-консоль
        # провайдера, когда сеть недоступна и по SSH не зайти. По SSH
        # бесполезен — вход по паролю запрещён целиком.
        #
        # Берётся из окружения, а не хранится в файле: у каждой машины
        # должен быть свой. Один хеш в репозитории означал бы один пароль
        # на весь парк.
        base_root_password: "{{ lookup('env', 'VPS_DEV_ROOT_PASSWORD') | default('', true) }}"

        # ═══ Как подключаться ════════════════════════════════════════════

        # Куда подключаться по умолчанию. Обвязка почти всегда перебивает это
        # адресом из частной сети, найденным по имени машины; публичный адрес
        # остаётся запасным путём.
        ansible_host: "{{ dev_public_address }}"

        # Пользователь постоянный. На свежей машине его ещё нет — туда
        # обвязка заходит под root (передаёт dev_bootstrap_user=root) и
        # заводит его сама, а роль base посреди прогона переключается на dev.
        #
        # Именно через отдельную переменную, а не через -e ansible_user=root:
        # extra-var сильнее любого set_fact, и переключение на dev в роли
        # base молча не срабатывало бы — весь первый прогон шёл бы под root,
        # а первый же обрыв соединения после закрытия root-входа ронял бы
        # его с UNREACHABLE. Ровно так один раз и случилось.
        ansible_user: "{{ dev_bootstrap_user | default(dev_login_user) }}"
        # Имя постоянного пользователя — одно место на всё: и для входа
        # (ansible_user, make ssh), и для роли base (base_deploy_user).
        dev_login_user: dev
        base_deploy_user: "{{ dev_login_user }}"
        # Путь внутри контейнера. Сам файл ключа монтируется туда обвязкой.
        ansible_ssh_private_key_file: /ssh/key
