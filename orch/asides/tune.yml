# Наладчик — побочная роль при прогоне (`ASIDE-PLAN.md` §11). Смотрит не на
# задачу, а на то, как её ведёт оркестратор: правильно ли собран входной
# промпт, что роль делала внутри хода, доедет ли её выход до следующего
# шага. Находки уходят владельцу; правки промптов и цепочек Наладчик
# коммитит в свою ветку vps-dev и сам открывает PR — по одному на прогон.
#
# Выключен по умолчанию: побочные роли включаются руками на странице
# «Агенты», иначе чужая машина получила бы агентов молча.
name: tune
title: Наладчик
scope: run
enabled: false

# Правит живое дерево — только там правка подействует на текущий прогон:
# движок читает промпты и цепочки именно оттуда. Коммитит не там, а в своей
# копии-ветке: в живом дереве лежит незакоммиченная работа владельца.
# Прогон при этом перестаёт быть воспроизводимым, и это осознанная цена:
# починить сейчас важнее, чем сохранить чистоту показаний.
workspace: repo:~/projects/vps-dev
mirror: worktree:~/projects/vps-dev
memory: machine

# `hold` — остановить ход и позвать владельца. Двигать задачу, принимать за
# владельца и откатывать файлы Наладчик не может: это необратимо.
rights: [read, hold, patch, pr]
requires: [notify]
chains: [deep, blueprint]
budget: { runs_per_task: 24, max_live: 1 }

wakes:
  # Проверка входа почти бесплатна и ловит кривой промпт до того, как роль
  # потратила час. Разбирать тут нечего — сверка, значит Sonnet.
  - on: [run_started]
    prompt: role-tune-start
    run: { agent: claude, model: sonnet, effort: low }

  # Разбор хода: скелет транскрипта, выбранный исход, годится ли выход для
  # следующего шага. Здесь нужно суждение — Opus.
  - on: [run_ended]
    prompt: role-tune-review
    run: { agent: claude, model: "opus[1m]", effort: medium }

  # Сторожа движка: ход идёт слишком долго, стоит слишком дорого, сессия в
  # ошибке. Повод посмотреть немедленно, а не после хода.
  - on: [watch_overtime, watch_cost, aside_lost, watch_out_of_bounds, watch_pushed, watch_file_clash]
    prompt: role-tune-alarm
    run: { agent: claude, model: "opus[1m]", effort: medium }

  # Владелец ответил на находку: исполнить то, что он выбрал.
  - on: [note_decided]
    prompt: role-tune-apply
    run: { agent: claude, model: "opus[1m]", effort: medium }

  # Прогон кончился: сводка владельцу и напоминание про PR с правками.
  # Заодно признак жизни — иначе «чисто» не отличить от «сломался и молчит».
  - on: [done, closed]
    prompt: role-tune-summary
    run: { agent: claude, model: sonnet, effort: medium }
