# Обработчики: выполняются один раз в конце ЭТОГО ПРОИГРЫВАНИЯ (после всех
# ролей site.yml, не сразу после base), и только если что-то менялось.
#
# Это важно для перезапуска sshd: он откладывается до конца всего прогона
# намеренно, а не потому что забыли про flush_handlers. К моменту, когда
# ssh.yml пишет новый файл настроек, дальнейшие задачи роли уже переключены
# на пользователя {{ base_deploy_user }} (см. tasks/main.yml) и работают
# через УЖЕ действующий, ещё не изменённый sshd — то есть ничего не зависит
# от того, когда именно применится новый конфиг. Перезапускать сервис входа
# посреди длинного прогона, где отваливались бы другие роли, — лишний риск
# без выгоды.

- name: Перезапустить sshd
  # reload-or-restart, а не reload: в Ubuntu 24.04 порт слушает ssh.socket,
  # а сама служба может быть неактивна — тогда «перечитать настройки»
  # неактивной службы вернуло бы ошибку. Мы отключаем сокет-активацию
  # отдельной задачей (см. ssh.yml), но эта форма безопасна в обоих случаях.
  #
  # Текущие сессии при этом не рвутся: sshd не закрывает уже установленные
  # соединения при перезапуске — рвётся только возможность открыть новые
  # по старым правилам.
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded
    force: true

- name: Перечитать fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: reloaded

- name: Подключить новый файл подкачки при загрузке
  # fstab-запись нужна только на будущие перезагрузки: сам файл уже
  # включён командой swapon внутри задачи, которая его создала (см.
  # tasks/swap.yml) — эта подкачка работает и без этого обработчика,
  # просто не переживёт перезагрузку без записи в fstab.
  ansible.posix.mount:
    name: none
    src: "{{ base_swap_new_file }}"
    fstype: swap
    opts: sw
    state: present
