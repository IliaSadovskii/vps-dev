---
# Автоматическая уборка Docker — см. комментарий в самом скрипте
# (roles/dockergc/files/vps-dev-docker-gc) за подробным «почему».

dockergc_install_dir: /usr/local/bin
dockergc_state_dir: /var/lib/vps-dev/dockergc
dockergc_log_file: "{{ dockergc_state_dir }}/dockergc.log"

# Остановленный контейнер, чей проект ещё жив (папка на месте) — сколько
# часов ждать, прежде чем снести. Даёт время заметить неожиданное падение.
dockergc_exited_grace_hours: 24

# Образ compose-проекта, на который не смотрит ни один контейнер (ни
# рабочий, ни остановленный) — сколько часов ждать. Дольше, чем у
# контейнеров: сюда же попадают проекты, которые просто временно
# остановили без явного намерения удалить.
dockergc_image_grace_hours: 72

# Кэш сборки старше стольки часов — снимается целиком, он ничей и
# восстанавливается сам на следующей сборке.
dockergc_buildcache_max_age_hours: 168

# Когда убирать. После полуночи, но не одновременно с уборкой AoE
# (orch-sweep, 05:30) и опросом версий служб — ничего не делят, но нет
# смысла толкаться на диске в одну минуту.
dockergc_oncalendar: "*-*-* 06:00:00"

# ═══ Кэши (npm, apt, systemd journal) ═════════════════════════════════
#
# Раз в неделю, не каждый день — см. комментарий в самом скрипте
# (files/vps-dev-cache-gc): npm-кэш дороже терять часто, чем редко.
cachegc_log_file: "{{ dockergc_state_dir }}/cachegc.log"
cachegc_journal_keep_days: 14
cachegc_oncalendar: "Sun *-*-* 06:15:00"
