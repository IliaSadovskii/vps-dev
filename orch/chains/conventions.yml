# Conventions — завести или обновить файл соглашений проекта для агентов
# (AGENTS.md, CLAUDE.md = @AGENTS.md). Прогнать до первой задачи Deep по
# проекту: роли Deep читают этот файл первым.
#
# Автор собирает соглашения по коду и спрашивает владельца о том, чего в коде
# нет; сверка открывает всё, что автор процитировал; владелец читает и
# принимает. Сверка продолжает сессию автора? Нет: память свежая нарочно, автор
# только что держал весь репозиторий в голове и свою строку не перечитает.
name: conventions
includes: [common-protocol, common-git-safety]

# Листы автономии: пресет заполняет переключатели задачи, дальше их можно
# менять в панели по ходу. Короткой цепочке пресеты нужны не меньше длинной:
# без них задача, заведённая с `--preset auto`, отвергалась молча — заявка
# исчезала, и владелец не понимал, куда (прогон 2026-09-10).
presets:
  default:
    when: >-
      как записано в шагах: вопросы автору соглашений и приёмка итога.
      Выбор по умолчанию, когда нет причин иначе
    set: {}

  auto:
    when: >-
      участвую только в итоге: ни вопросов, ни ворот до готовых соглашений
    # Ворота только на успехе: `rework` — это круг внутри цепочки, и
    # владельцу на нём решать нечего (прогон T42, 2026-09-10).
    set: { "*.after": false, "*.ask": false, conventions-check.after: [ok] }

  step-by-step:
    when: >-
      участвую на каждом шаге: ворота после каждого и вопросы разрешены
    set: { "*.after": true, "*.ask": true }

steps:
  - id: conventions
    run: { agent: claude, model: "opus[1m]", effort: medium }
    context: fresh
    artifact: [conventions.md]
    next: conventions-check
    human: { ask: true }         # приоритеты и границы знает только владелец

  - id: conventions-check
    run: { agent: claude, model: "opus[1m]", effort: medium }
    context: fresh
    prompt: { reads: [conventions.md] }
    artifact: [conventions-review.md]
    next:
      ok: done
      rework: conventions
    human:
      after: [ok]
      ask: false
      moves: [conventions]
    limits: { max_runs: 3 }
