# Клиент баз данных (DbGate). Одна веб-морда на все базы всех проектов
# вместо клиента в каждом контейнере отдельно.

dbclient_dir: /srv/vps-dev/dbclient

# Версия закреплена точно — тот же смысл, что у logs_image: не latest,
# иначе повторный прогон через полгода мог бы принести другое поведение.
# У образца (setup-dev.sh) была плавающая latest — здесь сознательно нет.
dbclient_image: dbgate/dbgate:7.2.6

dbclient_container_name: vps-dev-dbclient

# Порт на адресе частной сети. Второй в инфра-диапазоне 8060-8069
# (см. bin/ports в /home/dev/vps): 8060 занят Dozzle.
dbclient_port: 8061

# Docker-том, а не каталог на хосте: сохранённые подключения переживают
# пересоздание контейнера, а формат данных внутри — забота самого DbGate.
dbclient_volume: vps-dev-dbclient-data

# Веб-клиент тяжелее Dozzle (Node.js, редактор в браузере). Число — начальная
# оценка, не измерение.
# ПРОВЕРИТЬ: реальный расход памяти после недели использования и поднять
# при необходимости.
dbclient_memory_limit: 512m

# Как опознаём базу данных среди чужих контейнеров: по имени образа.
# Список — движки, которыми пользуются проекты на этом сервере. Тот же
# список, что был в setup-dev.sh (step_db_client).
dbclient_db_image_pattern: 'postgres|mysql|mariadb|mongo'
