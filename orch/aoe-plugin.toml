# Плагин orch: движок оркестратора и панели. Воркер — точка входа
# `orch-plugin` из venv, положенная симлинком в /usr/local/bin, поэтому
# `system = true`: правки кода действуют после disable/enable без
# переустановки плагина (orch/HANDOFF.md).
id = "dev.sadovskii.orch"
name = "orch"
version = "0.1.0"
api_version = 13
aoe_version = ">=1.15.0, <2.0.0"
description = "Оркестратор ролей: цепочка шагов, ворота владельца, панель задач."

capabilities = [
  "runtime.worker",
  "session.read",
  "notifications",
]

[[ui]]
slot = "home-pane"
id = "tasks"

[[ui]]
slot = "pane"
id = "task"

# Бейдж на строке сессии в сайдбаре: подсветку «зовёт» хост рисует сам по
# флагу `urgent`, который ставит движок, а бейдж говорит, зачем звать —
# ворота, вопрос, какой шаг (orch/UX-PLAN.md).
[[ui]]
slot = "row-badge"
id = "step"

# Третий вход в мастера: палитра (Ctrl+K) из любой сессии проекта — проект
# берётся из этой сессии, вписывать ничего не надо.
[[commands]]
id = "new"
title = "orch: новая задача"
description = "Открыть мастера задачи для проекта этой сессии."

[[commands]]
id = "status"
title = "orch: состояние"
description = "Что движок думает о задачах прямо сейчас."

[[settings]]
key = "poll_secs"
label = "Интервал опроса AoE, с"
type = "integer"
default = 5
min = 2
max = 60

[[settings]]
key = "max_running"
label = "Сколько задач едет одновременно"
type = "integer"
default = 3
min = 1
max = 20

[[settings]]
key = "cost_warn_usd"
label = "Порог предупреждения о стоимости хода, $"
type = "integer"
default = 5
min = 0
max = 1000

[[settings]]
key = "aoe_url"
label = "Адрес демона AoE"
description = "Куда движок ходит за сессиями. Меняется только при своём порту демона."
type = "string"
default = "http://127.0.0.1:8065"
advanced = true

[[settings]]
key = "projects_dir"
label = "Каталог проектов"
description = "Где искать репозитории для кнопки «Новая задача». Проекты вне его тоже можно назвать мастеру словами."
type = "string"
default = "/projects"

[[settings]]
key = "cheap_model"
label = "Модель служебных ходов"
description = "Чем убирать стенд закрытой задачи — там нечего решать, нужна самая дешёвая."
type = "string"
default = "haiku"
advanced = true

[[settings]]
key = "default_chain"
label = "Цепочка по умолчанию"
type = "string"
default = "deep"

[runtime]
kind = "command"
command = ["orch-plugin"]
system = true
