---
# Стиль разговора агентов с владельцем: один текст на все CLI, правится
# со страницы.
#
# Зачем. У каждого CLI агента есть файл в домашнем каталоге, который он
# читает перед любым разговором в любом проекте: Claude Code —
# ~/.claude/CLAUDE.md, Codex — ~/.codex/AGENTS.md, Gemini — ~/.gemini/GEMINI.md,
# OpenCode — ~/.config/opencode/AGENTS.md. Четыре файла с одним текстом
# разъедутся через неделю. Поэтому текст один — в каталоге состояния
# платформы, а четыре файла — символические ссылки на него. Служба на
# своём порту показывает текст в поле и сохраняет по кнопке; агенты
# подхватывают его при старте следующего разговора.

# Порт из инфра-заповедника 8060-8079 (см. RESERVED_BASES в
# roles/ports/files/ports), следующий за лимитами.
style_port: 8071

# Каталог состояния. /var/lib, а не $HOME: службы должны работать без
# активного логина владельца (тот же довод, что у ports_base_dir).
style_state_dir: /var/lib/vps-dev/style

# Сам текст — единственный экземпляр. Роль кладёт заготовку один раз и
# больше файл не трогает: его правит человек со страницы, и перезапись
# стёрла бы правки на следующем прогоне.
style_file: "{{ style_state_dir }}/agent-style.md"

# От чьего имени работает служба и кому принадлежат ссылки: тот же
# пользователь, под которым запускаются агенты.
style_user: "{{ base_deploy_user }}"

# Куда ведут ссылки — по одному файлу на CLI, пути от домашнего каталога.
# Каждый путь подтверждён документацией CLI 2026-09-04: глобальные
# инструкции пользователя, читаются в любом проекте поверх файла проекта.
# Существующий обычный файл на этом месте роль не стирает — переносит
# рядом с суффиксом .before-style и говорит об этом.
style_targets:
  - name: Claude Code
    path: .claude/CLAUDE.md
  - name: Codex
    path: .codex/AGENTS.md
  - name: Gemini CLI
    path: .gemini/GEMINI.md
  - name: OpenCode
    path: .config/opencode/AGENTS.md

# Встроенный стиль вывода Claude Code (с 2.1.237): результат первой
# строкой, без рассказа о том, что агент сейчас сделает. Дополняет текст,
# а не заменяет его: стиль вывода Claude напоминает себе по ходу
# разговора, файл читается один раз при старте. Ключ дописывается в
# ~/.claude/settings.json, остальное содержимое файла не трогается.
style_claude_output_style: Concise

# Куда ставится сам скрипт службы.
style_install_dir: /usr/local/bin
