---
# Роль-дополнение к geerlingguy.docker — сама она движок не ставит.
#
# ПОЧЕМУ ЗАВИСИМОСТЬ, А НЕ ПРОСТО СОСЕДНИЙ ПУНКТ В site.yml.
# Движок должен быть установлен ДО того, как эта роль допишет daemon.json
# и перезапустит его. Через meta-зависимость geerlingguy.docker
# гарантированно отрабатывает первой, в каком бы месте site.yml ни стоял
# вызов dockerd и по какой бы метке его ни запускали: выборочный прогон
# по метке `docker` не может запустить одну роль без другой.
#
# daemon.json при этом пишет ТОЛЬКО dockerd (см. defaults/main.yml):
# geerlingguy.docker получает пустой docker_daemon_options и файл не трогает.
#
# Параметры движка (docker_users и прочие) задаются на роли dockerd
# в site.yml и достаются сюда как зависимости.
dependencies:
  - role: geerlingguy.docker
