---
# Лимиты подписок агентов в одном месте: сколько израсходовано в текущем
# пятичасовом окне и в недельном — у Claude, Codex и китайских планов.
#
# Зачем своё, а не готовое. Всё, что нашлось, живёт не там, где нужно:
# Usage4Claude — строка меню macOS, claude-codex-usage-dashboard — Windows,
# aimo — расширение Chromium (на машине без графики не запустится),
# openusage — приложение macOS. Единственный self-hosted веб-дашборд
# (how-much-ai) — пять коммитов и без китайских провайдеров. Своего кода
# здесь на один файл: вся работа — сходить в три места и нарисовать полоски.
#
# ОТКУДА БЕРУТСЯ ЦИФРЫ. У каждого поставщика свой способ, общего нет:
#
#   Claude  GET api.anthropic.com/api/oauth/usage с токеном, который
#           Claude Code хранит в ~/.claude/.credentials.json. Отдаёт
#           пятичасовое окно, недельное и недельное по моделям.
#   Codex   отдельной точки нет вовсе: OpenAI присылает остаток лимита
#           в ответе на каждый запрос, а Codex CLI складывает его в журнал
#           сессии (~/.codex/sessions/**.jsonl). Читаем последнюю запись —
#           поэтому цифра Codex ровно настолько свежая, насколько давно
#           агент работал, и на карточке всегда написано, когда она снята.
#   z.ai    GET api.z.ai/api/monitor/usage/quota/limit с ключом плана.
#
# Через какой клиент работает агент — Claude Code, Codex, OpenCode — на цифры
# не влияет: клиент только транспорт, остаток подписки знает лишь поставщик.
# Своего «сколько осталось» OpenCode не отдаёт (`opencode stats` считает токены
# и стоимость его же сессий), поэтому на каждого поставщика — свой адаптер
# в PROVIDERS. Ключ при этом второй раз вписывать не нужно: план, подключённый
# в OpenCode, оставляет ключ в его auth.json, и служба берёт его оттуда сама.
#
# Ключей роль никуда не прописывает и токенов не обновляет: она только
# читает. Обновлять токен Claude нельзя принципиально — файл кредов пишет
# сам Claude Code, и второй писатель однажды затрёт свежую сессию.

# Порт из инфра-заповедника. 8060-8069 занят целиком (Dozzle 8060 … почта
# 8069), поэтому заповедник расширен на второй десяток — 8070-8079,
# см. RESERVED_BASES в roles/ports/files/ports.
limits_port: 8070

# Каталог состояния. /var/lib, а не $HOME: служба работает без активного
# логина владельца (тот же довод, что у ports_base_dir).
limits_state_dir: /var/lib/vps-dev/limits

# От чьего имени работает служба. Обязательно тот же пользователь, под
# которым запускаются агенты: их файлы с токенами (~/.claude, ~/.codex)
# лежат с правами 0600 на него, и другому пользователю их не прочесть.
limits_user: "{{ base_deploy_user }}"

# Как часто опрашивать поставщиков. Минута — компромисс: лимит за меньший
# срок заметно не меняется, а лишние запросы к чужому API ни к чему.
limits_poll_seconds: 60

# Файл с ключами тех планов, где токена на машине нет (z.ai и подобные).
# Роль создаёт его пустым с подсказками и больше никогда не трогает:
# ключи вписывает человек, перезапись стёрла бы их на следующем прогоне.
limits_secrets_file: "{{ limits_state_dir }}/providers.env"

# Куда ставится сам скрипт службы.
limits_install_dir: /usr/local/bin
