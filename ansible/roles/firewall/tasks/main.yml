# Брандмауэр машины: закрыть наружу ВСЁ, кроме входа в частную сеть.
#
# Отличие от боевого сервера листейта — не в деталях, а в самой сути. Там
# 80 и 443 остаются открытыми, только сужены до сетей Cloudflare: сайт
# должен быть виден миру. Здесь сайта нет. Сервер разработки не смотрит
# наружу НИЧЕМ: ни 22 после входа в частную сеть, ни тем более 80 или 443.
# Поэтому здесь нет ни тяни списка сетей Cloudflare, ни аварийной кнопки —
# их нечем и незачем адаптировать, они просто не нужны.
#
# Роль идёт ПОСЛЕ tailscale (см. ansible/site.yml): закрывать публичный
# вход можно только убедившись, что запасной путь уже работает.
#
# Роль делает две разные вещи, и разными средствами — это ключевое, что
# в ней стоит понимать.
#
# 1. СЛУЖБЫ САМОЙ МАШИНЫ — через ufw. Всё, что слушает порт на хосте
#    напрямую (сейчас это только SSH), проходит через обычные цепочки
#    INPUT/OUTPUT, которые ufw видит и умеет фильтровать.
#
# 2. ПОРТЫ, ОПУБЛИКОВАННЫЕ КОНТЕЙНЕРАМИ, — через цепочку DOCKER-USER.
#    До них ufw не достаёт вообще: Docker публикует порты, вписывая
#    правила прямо в iptables ДО цепочек UFW, поэтому
#    `ufw default deny incoming` контейнеров не касается вообще. Настройка
#    "ip" в daemon.json тоже не спасает: она действует только на дефолтную
#    bridge-сеть, а docker compose создаёт для каждого проекта свою — и
#    публикует на 0.0.0.0. Проверено на этом сервере (в старом bash-скрипте,
#    откуда перенесена эта роль): `docker run` слушал 127.0.0.1, а поднятый
#    рядом compose — 0.0.0.0, и база проекта оказалась доступна из интернета.
#
#    Расхожий совет «пишите 127.0.0.1:8000:8000 в compose» отвергнут
#    намеренно: он перекладывает безопасность на каждый проект, и одна
#    опечатка в чужом репозитории открывает базу наружу. Защита должна быть
#    на платформе — то есть здесь, а не в каждом отдельном docker-compose.yml.
#
#    У Docker для этого случая есть предусмотренная цепочка DOCKER-USER: она
#    проходится ДО его собственных правил, и то, что мы в неё положим,
#    действует. Кладём напрямую в /etc/ufw/after.rules и after6.rules —
#    их ufw читает и применяет сам при каждом `ufw reload` и при каждой
#    загрузке машины, отдельная systemd-служба под это не нужна.

- name: Пакет брандмауэра
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Узнать адрес в частной сети
  ansible.builtin.command: tailscale ip -4
  register: firewall_ts_ip
  changed_when: false
  failed_when: false
  # Чтение адреса ничего не меняет и безопасно в сухом прогоне. Без этого
  # сухой прогон пропустил бы задачу, следующие получили бы пустой факт
  # и всегда решали бы, что частной сети нет.
  check_mode: false

- name: Проверить, что по частной сети реально входится
  # Адрес в частной сети — ещё не дверь. Машина может стоять в сети и быть
  # недостижимой для нас: правила доступа (ACL) не пускают наши устройства
  # к tag:server, маршрут ещё не поднялся, ключ не подхватился. Закрыть 22
  # по одному факту адреса — значит один раз остаться снаружи. Поэтому
  # то же правило, что и у root-входа в roles/base: сначала открыть новую
  # дверь и войти в неё, потом заколачивать старую.
  #
  # Входим с управляющей машины (контейнер с Ansible: в CI он в сети через
  # tailscale/github-action, локально — через Tailscale хозяина) под
  # {{ base_deploy_user }} по адресу частной сети. Несколько попыток:
  # сразу после входа в сеть маршрут готов не мгновенно.
  ansible.builtin.command:
    argv:
      - ssh
      - -o
      - BatchMode=yes
      - -o
      - ConnectTimeout=10
      - -o
      - StrictHostKeyChecking=no
      - -o
      - UserKnownHostsFile=/dev/null
      - -i
      - "{{ hostvars[inventory_hostname].ansible_ssh_private_key_file }}"
      - "{{ base_deploy_user }}@{{ firewall_ts_ip.stdout | trim }}"
      - "true"
  delegate_to: localhost
  become: false
  register: firewall_tailnet_login
  changed_when: false
  failed_when: false
  check_mode: false
  retries: 6
  delay: 5
  until: firewall_tailnet_login.rc == 0
  when: firewall_ts_ip.rc == 0 and (firewall_ts_ip.stdout | trim | length > 0)

- name: Решить, можно ли закрывать публичный SSH
  ansible.builtin.set_fact:
    firewall_tailnet_ok: >-
      {{ firewall_ts_ip.rc == 0
         and (firewall_ts_ip.stdout | trim | length > 0)
         and (firewall_tailnet_login.rc | default(1)) == 0 }}

- name: Узнать, включён ли уже брандмауэр
  # Нужно ниже: на уже настроенной машине публичный SSH закрыт, и если
  # сегодня проверка входа по частной сети не прошла (скажем, прогон идёт
  # с машины вне сети), открывать 22 заново нельзя — это откат защиты.
  # Открыть его можно только на свежей машине, где брандмауэр ещё не
  # включался и это единственная дверь.
  ansible.builtin.command: ufw status
  register: firewall_ufw_status
  changed_when: false
  check_mode: false

- name: Разрешить всё входящее из частной сети
  # Именно по имени устройства, а не по подсети: устройство существует
  # только пока Tailscale работает. Отвалится он — правило перестанет
  # действовать само, и мы не будем думать, что защищены.
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ firewall_tailscale_interface }}"
    route: false

- name: Разрешить прямые соединения Tailscale
  # Без этого порта устройства не могут установить прямое соединение,
  # и трафик идёт через ретранслятор Tailscale — работает, но заметно
  # медленнее.
  community.general.ufw:
    rule: allow
    port: "{{ firewall_tailscale_direct_port }}"
    proto: udp

- name: Закрыть публичный SSH
  when: firewall_tailnet_ok | bool
  block:
    - name: Убрать разрешение публичного SSH
      community.general.ufw:
        rule: allow
        port: "{{ firewall_ssh_port }}"
        proto: tcp
        delete: true

    - name: Сказать, что вход теперь только через частную сеть
      ansible.builtin.debug:
        msg:
          - "Публичный SSH закрыт. Вход по частной сети проверен: {{ base_deploy_user }}@{{ firewall_ts_ip.stdout | trim }}"
          - "Запасной путь — веб-консоль провайдера, пароль root в менеджере паролей."

- name: Оставить публичный SSH на свежей машине, пока частной сети нет
  # Молча оставить порт открытым нельзя: человек будет думать, что закрыт.
  # Но и закрывать нельзя — это единственная работающая дверь. Разрешение
  # ставим явно (а не полагаемся на то, что оно уже есть) — на свежей
  # машине до этой задачи ufw ещё ни разу не запускался.
  when:
    - not (firewall_tailnet_ok | bool)
    - "'Status: active' not in firewall_ufw_status.stdout"
  block:
    - name: Разрешить публичный SSH
      community.general.ufw:
        rule: allow
        port: "{{ firewall_ssh_port }}"
        proto: tcp

    - name: ВНИМАНИЕ — предупредить, что вход по частной сети не работает
      ansible.builtin.debug:
        msg:
          - "ВНИМАНИЕ: вход на машину по частной сети не подтверждён, публичный SSH оставлен открытым."
          - "Адрес в частной сети: {{ firewall_ts_ip.stdout | default('нет', true) | trim }}"
          - "Ответ на попытку входа: {{ firewall_tailnet_login.stderr | default('машина не в сети', true) | trim }}"
          - "Закрыть 22 сейчас значило бы отрезать себя от машины."
          - "Проверь, что Tailscale поднялся, а управляющая машина и твои устройства допущены к tag:server, и прогони настройку заново."

- name: ВНИМАНИЕ — на настроенной машине вход по частной сети не подтверждён
  # Брандмауэр уже включён, 22 уже закрыт — ничего не трогаем, только
  # говорим. Чаще всего это прогон с машины, которой нет в частной сети.
  ansible.builtin.debug:
    msg:
      - "ВНИМАНИЕ: с этой управляющей машины вход по частной сети не подтверждён."
      - "Брандмауэр уже настроен, правила не меняю. Если прогон идёт с машины вне сети — это ожидаемо."
  when:
    - not (firewall_tailnet_ok | bool)
    - "'Status: active' in firewall_ufw_status.stdout"

- name: Исходящие разрешены, входящие закрыты
  # Политика по умолчанию — для всего, что не разрешено правилом выше явно.
  # 80 и 443 сюда не попадают никогда: в отличие от боевого сервера, здесь
  # их не открывает ни бутстрап, ни эта роль, ни одна другая — сайта на этой
  # машине нет, и порту незачем быть открытым.
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Включить брандмауэр
  # Установленные соединения переживают включение: правило состояния ufw
  # ставит первым сам. Прогон, который сейчас идёт по SSH, не оборвётся —
  # даже если следующая задача выше закрыла порт 22: закрытие останавливает
  # НОВЫЕ подключения, а не то, что уже установлено.
  community.general.ufw:
    state: enabled

# ═══ Контейнеры: закрыть доступ из интернета ═══════════════════════════
#
# ГЛАВНАЯ ЗАЩИТА проектов на этой машине — см. объяснение вверху файла.
#
# Правило: в DOCKER-USER пропускаем ("RETURN") входящее с интерфейса
# частной сети и с loopback, а также трафик самих контейнеров — docker0
# и compose-сети (br-*, имя всегда с этим префиксом): без них контейнеры
# не достучались бы друг до друга и до интернета (apt, npm, реестры
# образов), и легло бы вообще всё, что здесь поднято. Все остальные
# источники, то есть внешний интерфейс машины и только он, — DROP.
#
# ПРОВЕРИТЬ: постановка задачи для этой роли говорит короче — «отбрасывать
# всё, что пришло не с tailscale0 и не с loopback» — и не упоминает docker0
# и br+ отдельно. Оставлены они намеренно: без RETURN для них цепочка рвёт
# не только вход из интернета, но и трафик контейнер-контейнер, и выход
# самих контейнеров наружу (--ctstate RELATED,ESTABLISHED тут не спасает —
# это НОВЫЕ соединения, которые контейнер открывает сам). Ровно так собрано
# то же место в /home/dev/vps/setup-dev.sh (step_firewall) — этот файл
# просто переносит его правило целиком, а не только вырезку про tailscale0
# и loopback. Если это расхождение с постановкой задачи ложное — проверить
# и вырезать docker0/br+ явно.
- name: Правила для контейнеров в цепочке DOCKER-USER
  ansible.builtin.blockinfile:
    path: "{{ item }}"
    # Матчим по префиксу комментария (marker), а не по всей строке: если
    # роль или переменную с меткой однажды переименуют, блок не задублируется
    # в файле — blockinfile найдёт прежний по тому же marker и заменит его.
    marker: "# {mark} {{ firewall_docker_user_marker }}"
    create: false
    block: |
      *filter
      :DOCKER-USER - [0:0]
      -A DOCKER-USER -m conntrack --ctstate RELATED,ESTABLISHED -j RETURN
      -A DOCKER-USER -i {{ firewall_tailscale_interface }} -j RETURN
      -A DOCKER-USER -i lo -j RETURN
      -A DOCKER-USER -i docker0 -j RETURN
      -A DOCKER-USER -i br+ -j RETURN
      -A DOCKER-USER -j DROP
      COMMIT
  loop:
    - /etc/ufw/after.rules
    - /etc/ufw/after6.rules
  register: firewall_docker_user_rules

# Намеренно не обработчик: обработчик сработал бы в конце всего прогона, а до конца ещё далеко.
- name: Перечитать правила брандмауэра, если цепочка DOCKER-USER изменилась  # noqa: no-handler
  # after.rules и after6.rules ufw читает только при (пере)загрузке своих
  # правил — правкой файла на диске цепочка DOCKER-USER не обновляется сама.
  # Перечитываем здесь же, а не обработчиком в конце прогона: ниже идут
  # роли, которые ходят в чужие службы и умеют упасть, и упади любая из
  # них — машина осталась бы с пустой цепочкой DOCKER-USER до следующего
  # успешного прогона или перезагрузки. Тот же принцип, что и у порядка
  # ролей в site.yml: закрыть дверь раньше, чем что-то может сломаться.
  community.general.ufw:
    state: reloaded
  when: firewall_docker_user_rules is changed
