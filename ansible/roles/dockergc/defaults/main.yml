---
# Автоматическая уборка Docker — см. комментарий в самом скрипте
# (roles/dockergc/files/vps-dev-docker-gc) за подробным «почему».

dockergc_install_dir: /usr/local/bin
dockergc_state_dir: /var/lib/vps-dev/dockergc
dockergc_log_file: "{{ dockergc_state_dir }}/dockergc.log"

# Остановленный контейнер, чей проект ещё жив (папка на месте) — сколько
# часов ждать, прежде чем снести. Даёт время заметить неожиданное падение.
dockergc_exited_grace_hours: 24

# Образ compose-проекта, на который не смотрит ни один контейнер (ни
# рабочий, ни остановленный) — сколько часов ждать. Дольше, чем у
# контейнеров: сюда же попадают проекты, которые просто временно
# остановили без явного намерения удалить.
dockergc_image_grace_hours: 72

# Кэш сборки старше стольки часов — снимается целиком, он ничей и
# восстанавливается сам на следующей сборке.
dockergc_buildcache_max_age_hours: 168

# И потолок по размеру: всё, что сверх, снимается с самого старого, в каждый
# прогон. Тот же предел, что builder.gc в daemon.json (roles/dockerd), — тот
# действует с перезапуска движка, этот с первого прогона.
dockergc_buildcache_max_size: "5GB"

# Том, на который не смотрит ни один контейнер, у проекта без единого
# контейнера, — сколько часов подряд ждать, прежде чем снести. Отсчёт с
# первого прогона, заметившего том бесхозным (Docker сам этого не помнит).
dockergc_volume_grace_hours: 24

# Проекты, тома которых не сносятся никогда, даже погашенные: живые стенды,
# данные которых нужны. Имя compose-проекта (метка
# com.docker.compose.project) или префикс имени тома до «_». Задаётся на
# машину в servers.yml; здесь — стенды этой машины на момент написания.
# Отдельный том можно защитить и меткой vps-dev.keep в compose-файле.
dockergc_protected_projects:
  - listate
  - listate-contour
  - listate-platform

# Когда убирать. После полуночи, но не одновременно с уборкой AoE
# (orch-sweep, 05:30) и опросом версий служб — ничего не делят, но нет
# смысла толкаться на диске в одну минуту.
dockergc_oncalendar: "*-*-* 06:00:00"

# ═══ Кэши (npm, apt, systemd journal) ═════════════════════════════════
#
# Раз в неделю, не каждый день — см. комментарий в самом скрипте
# (files/vps-dev-cache-gc): npm-кэш дороже терять часто, чем редко.
cachegc_log_file: "{{ dockergc_state_dir }}/cachegc.log"
cachegc_journal_keep_days: 14
cachegc_oncalendar: "Sun *-*-* 06:15:00"

# ═══ Сторож диска (vps-dev-disk-guard) ════════════════════════════════
#
# Раз в час, по заполненности, а не по возрасту — см. комментарий в самом
# скрипте (files/vps-dev-disk-guard).

# Выше этого процента — жёсткий проход и уведомление. heartbeat кричит при
# 90% (heartbeat_disk_free_min_percent: 10) — у сторожа запас в 10 пунктов,
# чтобы до крика дело доходило только тогда, когда убрать нечего.
diskguard_threshold_percent: 80

# Общий каталог для вторых стендов и временных копий репозиториев — один
# на машину, а не где попало в /tmp. Правило для агентов — в
# machine/ports.md (roles/style). Брошенное здесь сторож убирает сам.
diskguard_stands_dir: "{{ base_projects_dir }}/.stands"

# Копия, в которой ничего не менялось столько часов, без контейнеров и
# процессов, без несохранённой работы в git, — брошенная.
diskguard_idle_hours: 24

# Если и после жёсткого прохода выше порога — напоминать не чаще.
diskguard_notify_every_hours: 6

diskguard_oncalendar: "hourly"
diskguard_log_file: "{{ dockergc_state_dir }}/diskguard.log"

# Канал уведомлений — тот же ntfy, что у heartbeat; нового не заводим.
# Пустой топик — уведомлений нет, сторож только пишет журнал.
diskguard_ntfy_topic: "{{ ntfy_topic | default(lookup('env', 'VPS_DEV_NTFY_TOPIC'), true) }}"
diskguard_ntfy_url: "{{ heartbeat_ntfy_url | default('https://ntfy.sh') }}/{{ diskguard_ntfy_topic }}"

# ═══ Журналы ═══════════════════════════════════════════════════════════
#
# Потолок журнала systemd. По умолчанию journald держит до 10% диска
# (до 4 ГБ на этой машине), а недельная уборка по сроку его не ограничивает
# по объёму: болтливая служба за неделю успевала бы набрать гигабайты.
journald_system_max_use: "500M"

# /tmp: systemd по умолчанию чистит его через 30 дней — за это время
# агенты оставляют там гигабайты логов, снимков и выкладок. Неделя.
# Копии репозиториев убирает сторож раньше, через сутки.
tmpfiles_tmp_max_age: "7d"
