# Фича целиком: от «непонятно, как делать» до «готово к ревью».
#
# Промпты шагов — только ссылки @имя на роли из ../prompts. Тела ролей здесь
# нет намеренно: те же @implement и @verify стоят в small-fix.yml, и держать
# их в двух местах значит однажды поправить одно и забыть другое.
#
# Цепочка сама везёт задачу вперёд (on_turn_complete: move_to_next), но
# останавливается перед «Реализацией»: план утверждает человек. Без этих
# ворот один неверно понятый запрос уехал бы прямо в код.
version: 1
type: kandev_workflow
workflows:
  - name: Фича целиком
    description: Разведка, замысел, план, ворота человека, реализация, проверка.
    steps:
      - name: Входящие
        position: 0
        color: bg-neutral-400
        is_start_step: true
        allow_manual_move: true

      - name: Разведка
        position: 1
        color: bg-purple-500
        prompt: |
          @context
          @research-web
          @research-libs

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        allow_manual_move: true

      - name: Замысел
        position: 2
        color: bg-purple-500
        prompt: |
          @brainstorm

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        allow_manual_move: true

      - name: План
        position: 3
        color: bg-purple-500
        prompt: |
          @plan

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        allow_manual_move: true

      # Ворота. Ни auto_start_agent, ни move_to_next: задача стоит здесь,
      # пока человек не прочитает план и не двинет её дальше рукой.
      - name: План на утверждение
        position: 4
        color: bg-orange-500
        allow_manual_move: true
        show_in_command_panel: true

      - name: Реализация
        position: 5
        color: bg-blue-500
        prompt: |
          @context
          @implement

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        allow_manual_move: true

      - name: Проверка
        position: 6
        color: bg-blue-500
        prompt: |
          @verify
          @review-self
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        allow_manual_move: true

      - name: На ревью
        position: 7
        color: bg-yellow-500
        allow_manual_move: true
        show_in_command_panel: true

      - name: Готово
        position: 8
        color: bg-green-500
        allow_manual_move: true
