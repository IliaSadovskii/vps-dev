# Главный сценарий: превращает чистую Ubuntu в сервер разработки.
#
# Запускается сколько угодно раз. Второй запуск на настроенной машине
# ничего не меняет и печатает changed=0 — это признак, что всё на месте.
#
#   make apply       первый прогон на свежей машине: отметить «первое
#                    подключение» у кнопки, локально — VPS_DEV_TRUST_NEW_HOST=1
#   make check       показать, что изменится, ничего не трогая
#
# Чем этот сервер отличается от боевого: наружу не смотрит НИЧЕГО. Ни 80,
# ни 443, ни 22 после того, как поднялась частная сеть. Единственный вход —
# Tailscale. Поэтому здесь нет ни Cloudflare, ни доменов, ни сертификатов:
# всё это нужно, только когда сайт открыт публике.
#
# Порядок ролей не случаен и менять его нельзя.

- name: Сервер разработки с агентами
  hosts: dev
  become: true
  # Только базовые факты: полный сбор (железо, диски, сеть) занимает
  # секунды на каждом прогоне, а из него здесь ничего не читается.
  gather_subset: [min]

  pre_tasks:
    - name: Проверить, что система та, под которую всё написано
      # Именно 24.04, а не «не ниже». Переход на новый выпуск — осознанное
      # решение, а не то, что случается само при заказе очередной машины.
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version == "24.04"
        fail_msg: >
          Нужна Ubuntu 24.04.
          Здесь: {{ ansible_distribution }} {{ ansible_distribution_version }}.
        success_msg: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
      tags: always

    - name: Показать, к чему подключились
      ansible.builtin.debug:
        msg: >
          {{ inventory_hostname }} ({{ ansible_host }}),
          {{ ansible_distribution }} {{ ansible_distribution_version }},
          пользователь {{ ansible_user }}
      tags: always

    - name: Разово обновить систему
      # Образ провайдера отстаёт на месяцы, а автообновления доберутся
      # до заплаток только со следующим срабатыванием таймера.
      ansible.builtin.apt:
        upgrade: safe
        update_cache: true
        cache_valid_time: 3600
      when: ansible_user == "root"
      tags: [always, upgrade]

    - name: Есть ли уже Docker
      # Нужно ниже роли dockerd: в сухом прогоне на машине без Docker
      # готовая geerlingguy.docker падает на группе docker, которой ещё нет,
      # и обойти это изнутри чужой роли нельзя — только пропустить её целиком.
      ansible.builtin.stat:
        path: /usr/bin/dockerd
      register: dev_dockerd
      check_mode: false
      # Только в сухом прогоне: на настоящем это лишний круг по SSH,
      # а условия ниже без сухого прогона и так истинны.
      when: ansible_check_mode
      tags: always

    - name: Сказать, что в сухом прогоне Docker пропускается
      ansible.builtin.debug:
        msg: >-
          Сухой прогон: Docker ещё не установлен — роль dockerd пропускаю.
          Настоящий прогон поставит движок и запишет daemon.json
          (см. roles/dockerd/defaults/main.yml).
      when: ansible_check_mode and not (dev_dockerd.stat.exists | default(false))
      tags: always

  roles:
    # ═══ Машина ══════════════════════════════════════════════════════════

    # Заводит пользователя и укрепляет вход. Первой, потому что всё
    # остальное работает уже под этим пользователем.
    - role: base
      tags: [base]

    # Частная сеть. До Docker и до всего остального: через неё идёт вход
    # на машину после закрытия публичного SSH.
    - role: artis3n.tailscale.machine
      tags: [tailscale]
      # Пропускаем в двух случаях. Первый: сухой прогон — роль его не умеет,
      # внутри неё `tailscale status --json` в режиме --check не выполняется,
      # а следующая задача разбирает пустой ответ и падает. Второй: машина
      # уже в сети, а ключ у нас одноразовый.
      when:
        - not ansible_check_mode
        - not (dev_in_tailnet | default(false) | bool)
      vars:
        tailscale_authkey: "{{ lookup('env', 'TAILSCALE_AUTHKEY') }}"
        # Метка обязательна. У машин без метки ключ узла истекает через
        # полгода, и сервер молча выпадает из сети вместе со всем доступом.
        tailscale_tags: [server]
        # --ssh намеренно НЕ включаем. Он поднимает отдельный сервер SSH,
        # который не читает наши настройки: ни запрета входа под root,
        # ни списка разрешённых пользователей.
        #
        # --accept-dns=false: резолвер частной сети виден хосту, но не виден
        # контейнерам Docker, и это ломает разрешение имён внутри них.
        tailscale_args: "--accept-dns=false"
        # present, а не latest: иначе каждый прогон тянет свежую версию,
        # и обещание «ничего не изменилось» нарушается само собой.
        tailscale_apt_state: present

    # Движок Docker плюс наши поправки к нему.
    #
    # В site.yml один пункт, а не два, и это важно. Готовая роль
    # geerlingguy.docker пишет /etc/docker/daemon.json ЦЕЛИКОМ поверх
    # docker_daemon_options — не сливает, а затирает, и тут же перезапускает
    # движок (внутри неё стоит flush_handlers). Поэтому daemon.json здесь
    # пишет ОДНА роль — dockerd: ей отданы и ротация журналов, и ключи
    # `ip` / `default-network-opts` (см. roles/dockerd/defaults/main.yml).
    # docker_daemon_options остаётся пустым намеренно: с пустым словарём
    # geerlingguy.docker файл не трогает вовсе. Два писателя одного файла
    # означали бы два перезапуска движка на КАЖДОМ прогоне и changed≠0.
    #
    # geerlingguy.docker подключена meta-зависимостью роли dockerd
    # (см. roles/dockerd/meta/main.yml), а параметры ниже достаются ей же:
    # Ansible передаёт переменные уровня роли и в её зависимости.
    - role: dockerd
      tags: [docker, dockerd]
      # Сухой прогон на машине без Docker — см. pre_tasks «Есть ли уже Docker».
      when: not (ansible_check_mode and not (dev_dockerd.stat.exists | default(false)))
      vars:
        docker_install_compose_plugin: true
        docker_install_compose: false
        docker_users: ["{{ base_deploy_user }}"]

    # Закрывает наружу ВСЁ. После tailscale, потому что закрывать вход можно
    # только с работающим запасным путём.
    #
    # И как можно раньше в остальном: всё, что идёт ниже, ходит в чужие
    # службы и умеет на них упасть — в реестры пакетов, в npm, на ntfy.sh.
    # Стой firewall последней, недоступность любой из них оставила бы
    # свежую машину с открытым публичным SSH.
    - role: firewall
      tags: [firewall]

    - role: audit
      tags: [audit]

    - role: heartbeat
      tags: [heartbeat]

    # ═══ Рабочее место ═══════════════════════════════════════════════════

    # Три вещи из старого agent-vps, аналогов которым у листейта нет:
    #
    #   ports      реестр блоков по 10 портов на проект. Без него два проекта
    #              однажды возьмут один порт «на глаз», и всплывёт это не при
    #              чтении кода, а когда второй контейнер тихо не поднимется
    #   vps-proxy  общий Caddy: Tailscale отдаёт байты как есть, без сжатия
    #              и без Cache-Control, поэтому мегабайт вёрстки перекачивается
    #              при каждой перезагрузке страницы
    #   дашборд    страница на :8062 со ссылками на все службы машины, уже
    #              готовыми для частной сети. Одна закладка вместо памяти
    #
    # До kandev: его порт публикуется тем же механизмом.
    - role: ports
      tags: [ports]

    # Дозел: журналы контейнеров в браузере, сокет только на чтение.
    # Роль взята у листейта целиком.
    - role: logs
      tags: [logs]

    # DbGate: клиент баз данных. Сам подключается к docker-сетям чужих баз,
    # опознавая их по имени образа, и достаёт до базы по имени контейнера —
    # ни один порт БД наружу открывать не надо. Аналога у листейта нет.
    - role: dbclient
      tags: [dbclient]

    # CLI агентов на хост. До kandev и aoe: оба их запускают, и логин
    # у них общий — ровно поэтому и на хост, а не в два контейнера.
    - role: agents
      tags: [agents]

    - role: kandev
      tags: [kandev]

    # Наполнение доски: роли агентов и цепочки шагов из kandev/ в корне
    # репозитория. Сразу за kandev и отдельной ролью: служба меняется редко
    # и ломается дорого, содержимое правится каждый день — а `make apply
    # t=seed` не должен трогать саму доску.
    - role: seed
      tags: [seed]

    - role: aoe
      tags: [aoe]

    # Терминал и файлы в браузере — с дашборда, без SSH и SFTP-клиентов.
    # Оба открываются в /projects и работают под тем же пользователем,
    # что Kandev и aoe: вход в CLI агента из этого терминала увидят все.
    #
    # Терминал — dinotty, на месте прежнего ttyd и на том же порту. Причина
    # замены одна: телефон. На экранной клавиатуре нет ни Ctrl, ни Esc,
    # ни стрелок, и настройкой ttyd это не лечилось; здесь они нарисованы
    # на экране. Роль сама убирает ttyd с уже настроенной машины.
    - role: dinotty
      tags: [dinotty, terminal]

    - role: files
      tags: [files]

    # VS Code в браузере — рядом с терминалом и файлами, не вместо них.
    - role: codeserver
      tags: [codeserver]

    # Мониторинг машины и контейнеров с историей и порогами.
    - role: monitor
      tags: [monitor]

    # Сколько осталось от лимитов подписок агентов — одной страницей,
    # без похода на сайт каждого поставщика. После monitor: там про железо
    # машины, здесь про исчерпаемый ресурс работы агентов.
    - role: limits
      tags: [limits]

    # Как агенты разговаривают с владельцем: один текст на все CLI,
    # правится со страницы. После agents (каталоги CLI уже есть) и
    # рядом с limits: это тоже своя страница на инфра-порту.
    - role: style
      tags: [style]

    # Ловушка почты для проектов.
    - role: mail
      tags: [mail]

    # Ansible на самой машине: следующий прогон обвязка выполнит на ней,
    # а не по SSH задача за задачей (см. roles/pull и scripts/run-playbook.sh).
    - role: pull
      tags: [pull]

    # ═══ Чего здесь намеренно нет ════════════════════════════════════
    #
    # Провайдера уведомлений внутри Kandev. Роли агентов и цепочки шагов
    # теперь ставит роль seed из каталога kandev/, но уведомления — нет:
    # они требуют внешней службы и ключа к ней, а это отдельный разговор.
    #
    # Снимок базы Kandev по расписанию входит в роль kandev: снимок и ключ
    # шифрования надо забирать вместе, порознь они бесполезны.

  post_tasks:
    - name: Проверить, нужна ли перезагрузка
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required
      tags: always

    - name: Напомнить про перезагрузку
      # Автоматически не перезагружаем: перезагрузка без присмотра — это
      # авария, о которой узнаёшь потом.
      ansible.builtin.debug:
        msg: >
          Установлены обновления, которым нужна перезагрузка.
          Выбери время и выполни: sudo reboot
      when: reboot_required.stat.exists
      tags: always
