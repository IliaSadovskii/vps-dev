# Менеджер проекта — побочная роль (`ASIDE-PLAN.md` §11). Просыпается, когда
# задача доведена до конца или снята, и делает две вещи, которых не делает
# ни один шаг цепочки: копит решения проекта и сверяет с ними бэклог.
#
# Копилка нужна потому, что все шаги начинают с чистой памятью: без неё
# каждая новая задача переоткрывает те же грабли и заново отвергает то, что
# уже отвергали. Бэклог нужен потому, что законченная задача может сделать
# лежащие в нём заявки неверными, а увидеть это некому: шаг видит свою
# задачу, владелец смотрит доску глазами.
#
# Он ничего не решает и никого не двигает: права ровно два — читать и
# писать свою копилку. Канал наружу ему не нужен.
name: manager
title: Менеджер проекта
scope: project
enabled: false

workspace: task
memory: project
rights: [read, memory]
budget: { runs_per_task: 4 }

wakes:
  - on: [done, closed]
    prompt: role-manager
    run: { agent: claude, model: sonnet, effort: medium }
