# Deep — ещё не известно, что делать: сначала надо разобраться в вариантах.
#
# Это Standard плюс блок исследования: Research отсеивает мнимые развилки
# и ищет по оставшимся — именно по ним, а не по теме вообще, — Solution
# Synthesis сводит найденное в один вариант, и человек утверждает его до
# планирования.
#
# Прежняя цепочка Standard Development была фактически этим маршрутом.
#
# Общее начало — Backlog, Discovery, Scoping — и общий хвост от Code Review
# до Done описаны одинаково во всех трёх файлах.
# Дублируется только скелет: имя, цвет, события. Смысл роли лежит в одном
# файле ../prompts/<роль>.md, на который ссылаются все дорожки, поэтому
# правка формулировки делается в одном месте.
#
# Каждый автоматический шаг требует явного `step_complete_kandev`. Обычное
# завершение ответа, вопрос человеку, ошибка или пустая заглушка промпта
# задачу не продвигают.
#
# Условий по содержанию в переносимом YAML нет: все переходы безусловны.
# Маршрут выбирает человек, заводя карточку сразу на нужной дорожке, а не
# агент по дороге. Отдельной колонки выбора маршрута нет.
version: 1
type: kandev_workflow
workflows:
  - name: Deep Development
    description: "Развилки, точечное исследование, выбранное решение, план с ревью, реализация, ревью, PR."
    prompt: |
      @custom-artifact-protocol
      @custom-git-safety
      @custom-test-ownership
    steps:
      # Ручная очередь на вход: у шага нет событий, поэтому новая задача
      # ждёт здесь, пока её не двинут на Discovery. Есть время дописать
      # условие, прежде чем стартует агент.
      - name: Backlog
        position: 0
        color: bg-neutral-400
        events: {}
        is_start_step: true
        show_in_command_panel: false
        allow_manual_move: true
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false

      # Разведка проекта: стек, правила, структура, существенные файлы.
      # Одинакова во всех трёх дорожках. Её артефакт читают все роли,
      # которым сбросили контекст, — иначе они не знают конвенций проекта.
      - name: Discovery
        position: 1
        color: bg-purple-500
        prompt: |
          @custom-discovery

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Границы задачи: что входит, что намеренно нет и почему, что принято
      # на веру. Маршрут здесь не выбирается — дорожку выбрал человек, заводя
      # карточку. Артефакт нужен ролям со сброшенным контекстом: без него
      # ревью не отличит «забыли сделать» от «намеренно не делаем».
      - name: Scoping
        position: 2
        color: bg-purple-500
        prompt: |
          @custom-scoping

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Без единой настоящей развилки роль сама переносит карточку на
      # Planning мимо Solution Synthesis и Solution Approval: утверждать
      # нечего (решение 50). Пропущенные колонки агента не запускают.
      # Отсев мнимых развилок и поиск по оставшимся — один ход: обе
      # половины и так шли в одном контексте, а порядок «сначала отбери,
      # потом ищи» держится внутри промпта. Память сброшена: чтение
      # репозитория Discovery доезжает файлом, а страницы из интернета не
      # должны лечь в память Planning (решение 43).
      - name: Research
        position: 3
        color: bg-purple-500
        prompt: |
          @custom-research

          {{task_prompt}}
        events:
          on_enter:
            - type: reset_agent_context
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      - name: Solution Synthesis
        position: 4
        color: bg-purple-500
        prompt: |
          @custom-solution-synthesis

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Ворота человека: выбрать решение до того, как оно превратится в план.
      - name: Solution Approval
        position: 5
        color: bg-orange-500
        # Принять: перетащить вправо, на Planning. Возразить: написать
        # столько заметок, сколько нужно, и перетащить карточку на Solution
        # Synthesis, когда мысль закончена. Сообщение здесь агента не
        # двигает: колонка отвечает «записал» и ждёт (решение 39).
        prompt: |
          @custom-gate
        events: {}
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false

      # Память сброшена: все входы Planning — файлы и нативный План, а
      # первый отрезок цепочки иначе тянулся бы на пять шагов.
      - name: Planning
        position: 6
        color: bg-purple-500
        prompt: |
          @custom-planning

          {{task_prompt}}
        events:
          on_enter:
            - type: reset_agent_context
            - type: enable_plan_mode
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
          on_exit:
            - type: disable_plan_mode
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Свежий контекст: автор плана не должен быть его единственным критиком.
      - name: Plan Review
        position: 7
        color: bg-yellow-500
        prompt: |
          @custom-plan-review

          {{task_prompt}}
        events:
          on_enter:
            - type: reset_agent_context
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Ворота человека: утвердить план до первой правки рабочего кода.
      - name: Plan Approval
        position: 8
        color: bg-orange-500
        # Принять: перетащить вправо, на Test Authoring. Возразить: написать
        # заметки и перетащить карточку на Planning — единственного владельца
        # нативного Plan; план снова пройдёт Plan Review.
        prompt: |
          @custom-gate
        events: {}
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false

      # Начало контекста реализации. Шаг обязан оставить реально падающие
      # тесты: документ с их описанием ничем не обеспечивает test-first.
      - name: Test Authoring
        position: 9
        color: bg-blue-500
        prompt: |
          @custom-test-authoring

          {{task_prompt}}
        events:
          on_enter:
            - type: reset_agent_context
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      - name: Implementation
        position: 10
        color: bg-blue-500
        prompt: |
          @custom-implementation

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Замыкает red-green цикл в том же контексте, что Test Authoring
      # и Implementation. Кода не пишет: красный прогон один раз возвращает
      # карточку на Implementation через move_task_kandev, второй раз идёт
      # вперёд с пометкой «Не решено».
      - name: Verification
        position: 11
        color: bg-blue-500
        prompt: |
          @custom-verification

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      - name: Code Review
        position: 12
        color: bg-yellow-500
        prompt: |
          @custom-review-code

          {{task_prompt}}
        events:
          on_enter:
            - type: reset_agent_context
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Если ни у него, ни у Code Review нет находок, сам переносит карточку
      # на Final Verification мимо Review Fixes и Fix Review (решение 50).
      # Стоит во всех трёх маршрутах: «трогает ли безопасность» не связано
      # с размером задачи. Роль сначала делает дешёвую проверку
      # применимости и обычно сразу отвечает, что поверхность не затронута.
      - name: Security Review
        position: 13
        color: bg-amber-500
        prompt: |
          @custom-security-review

          {{task_prompt}}
        events:
          on_enter:
            - type: reset_agent_context
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Может быть пустым, если замечаний нет. Сюда возвращают: Fix Review
      # и Final Verification (не больше одного автовозврата на заход) и
      # человек сообщением с Human Review или Done.
      - name: Review Fixes
        position: 14
        color: bg-blue-500
        prompt: |
          @custom-review-fixes

          {{task_prompt}}
        events:
          on_enter:
            - type: reset_agent_context
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Свежим взглядом проверяет именно правки по ревью. Без этого между
      # Review Fixes и человеком был только прогон тестов: логическую ошибку
      # в исправлении никто независимо не читал.
      - name: Fix Review
        position: 15
        color: bg-yellow-500
        prompt: |
          @custom-fix-review

          {{task_prompt}}
        events:
          on_enter:
            - type: reset_agent_context
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Память сброшена: ревью правок ей не нужно, все входы — файлы.
      # Гоняет полный прогон после правок — поэтому у неё свой промпт.
      # Возврат на Review Fixes — только если в этом заходе автовозврата
      # ещё не было; предел один на заход для Fix Review и Final
      # Verification вместе. Documentation и Draft PR продолжают её память.
      - name: Final Verification
        position: 16
        color: bg-blue-500
        prompt: |
          @custom-final-verification

          {{task_prompt}}
        events:
          on_enter:
            - type: reset_agent_context
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Документация проекта после того, как правки по ревью улеглись.
      # Работает в контексте Final Verification, читает review-fixes.md
      # файлом, чинит разошедшееся с кодом и не трогает сам код.
      - name: Documentation
        position: 17
        color: bg-teal-500
        prompt: |
          @custom-documentation

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # PR создаётся draft, при повторном заходе обновляется, а не
      # создаётся второй. CI auto-fix намеренно выключен: его коммиты
      # появились бы уже после Code/Security/Fix Review. Раздел «Не решено»
      # в описании PR собирается из plan-review, fix-review и
      # final-verification.
      - name: Draft PR
        position: 18
        color: bg-indigo-500
        prompt: |
          @custom-pull-request

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Последние ворота человека. Назад — за правками, вперёд — в Done.
      - name: Human Review
        position: 19
        color: bg-yellow-500
        # Принять: дождаться CI, проверить итоговый diff и перетащить вправо,
        # в Done. Доработать: написать замечания и перетащить на Review
        # Fixes — хвост до PR пройдёт снова. Если менялся план или сама
        # задача — на Planning или Scoping: только человек знает, что
        # именно передумал.
        prompt: |
          @custom-gate
        events: {}
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false

      - name: Done
        position: 20
        color: bg-green-500
        # Переоткрыть: написать, что изменилось, и перетащить на Review
        # Fixes, тем же путём, что и с Human Review.
        prompt: |
          @custom-gate
        events: {}
        is_start_step: false
        show_in_command_panel: false
        allow_manual_move: true
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false
