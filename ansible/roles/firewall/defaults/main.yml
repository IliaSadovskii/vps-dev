# Брандмауэр: что закрыто и от кого.
#
# У этого сервера, в отличие от боевого, нет портов сайта и списка сетей
# Cloudflare — обсуждать больше нечего. Наружу не смотрит НИЧЕГО, кроме
# входа в частную сеть.

# Имя интерфейса Tailscale. Не вынесено в секрет и не читается из системы:
# сама библиотека Tailscale называет его так на Linux всегда.
firewall_tailscale_interface: tailscale0

# Порт прямых соединений Tailscale. Без него трафик идёт через ретранслятор
# Tailscale и работает заметно медленнее.
firewall_tailscale_direct_port: 41641

# Публичный SSH, пока частной сети нет. Закрывается ролью, как только
# на машине появляется адрес Tailscale.
firewall_ssh_port: 22

# Наша цепочка внутри DOCKER-USER матчится по префиксу этого комментария
# (см. tasks/main.yml) — переименование строки не задублирует блок
# в after.rules. Строка не собрана из переменных, которые могут поменяться:
# от этого и защищает матч по префиксу.
firewall_docker_user_marker: "DOCKER-USER (vps-dev firewall)"
