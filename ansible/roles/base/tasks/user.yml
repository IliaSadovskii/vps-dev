# Пользователь, под которым идёт вся дальнейшая работа.
#
# Заводится первым: остальные шаги опираются на то, что он уже есть,
# а укрепление SSH (ssh.yml) запрещает вход под root по сети.

- name: Завести пользователя {{ base_deploy_user }}
  ansible.builtin.user:
    name: "{{ base_deploy_user }}"
    groups: sudo
    # append обязателен. Без него список групп заменяется целиком, и когда
    # роль docker позже добавит пользователя в группу docker, повторный
    # прогон этой роли молча вырежет его оттуда снова.
    append: true
    shell: /bin/bash
    create_home: true
    # Пароля нет вовсе: вход только по ключу. Для аварийного входа через
    # веб-консоль провайдера — отдельный пароль root, ниже.
    password_lock: true
    state: present

- name: Разрешить sudo без пароля
  # Пароля у пользователя нет — с паролем sudo и не сработал бы. Защита
  # тут не в пароле, а в том, что войти на машину можно только по ключу.
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ base_deploy_user }}"
    content: "{{ base_deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: '0440'
    owner: root
    group: root
    # ОБЯЗАТЕЛЬНАЯ проверка синтаксиса ДО того, как файл окажется на месте:
    # `validate` прогоняет visudo по временной копии и, если она битая,
    # даже не подкладывает её. Без этой строки битый sudoers лишил бы
    # sudo всю машину, а заметили бы это только при следующей попытке
    # им воспользоваться.
    validate: /usr/sbin/visudo -csf %s

- name: Пароль root для аварийной веб-консоли
  # Не противоречит правилу «пароли по SSH запрещены»: PasswordAuthentication
  # no в ssh.yml выключает пароли для входа по СЕТИ, всем без исключения,
  # включая root. Этот пароль работает только в веб-консоли провайдера —
  # а это не сеть до машины, а эмуляция клавиатуры и монитора: всё равно
  # что подойти к серверу в дата-центре. Даёт он ровно одно: аварию
  # (сеть/SSH не работают) решить за минуту, а не искать другой путь внутрь.
  ansible.builtin.user:
    name: root
    # Хеш считается на месте: сам пароль в плейбук и в отчёт прогона
    # не попадает, а из хеша его не восстановить.
    password: "{{ base_root_password | password_hash('sha512', 65534 | random(seed=inventory_hostname) | string) }}"
  # Скрываем только сам пароль/хеш, а не всю задачу: no_log: true спрятал бы
  # и причину падения, и разбираться пришлось бы вслепую.
  no_log: "{{ base_root_password | length > 0 }}"
  when: base_root_password | length > 0

- name: Сказать, что пароль root не задан
  # Не останавливаем прогон — в servers.yml пароль явно объявлен опциональным
  # (только для аварийного входа), но и молчать не стоит: без него
  # веб-консоль провайдера в аварию не поможет, и лучше узнать об этом
  # сейчас, а не когда она понадобится.
  ansible.builtin.debug:
    msg: >
      base_root_password не задан — аварийный вход через веб-консоль
      провайдера паролем работать не будет. Это ожидаемо, если он не нужен;
      если нужен — задай VPS_DEV_ROOT_PASSWORD в окружении/секретах.
  when: base_root_password | length == 0

- name: Проверить, что список ключей не пуст
  # Список — единственный источник правды о том, кому можно войти, а задача
  # ниже стирает с машины всё, чего в нём нет. Пустой список означал бы
  # потерю доступа по SSH целиком, и остаётся только веб-консоль провайдера.
  ansible.builtin.assert:
    that: base_deploy_ssh_keys | length > 0
    fail_msg: >-
      base_deploy_ssh_keys пуст. Настройка стёрла бы все ключи доступа
      и заперла бы машину. Список задаётся в servers.yml.

# Проверка ПЕРЕД стиранием, а не после.
#
# Задача ниже удаляет с машины любой ключ, которого нет в списке. Проверка
# входа (verify-access.yml) идёт ШАГОМ ПОЗЖЕ — то есть уже после того, как
# лишние ключи стёрты, и на сломанном сценарии она лишь констатировала бы
# факт: войти нельзя, ключ уже вычищен. Поэтому спрашиваем заранее: есть ли
# в списке та самая открытая половина ключа, которым мы прямо сейчас
# подключены. Нет — останавливаемся, ничего не тронув.
- name: Узнать открытую половину ключа, которым мы подключены
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -y
      - -f
      - "{{ hostvars[inventory_hostname].ansible_ssh_private_key_file }}"
  delegate_to: localhost
  become: false
  register: base_current_pubkey
  changed_when: false
  # Не падаем: ключ может быть под паролем — превращать эту проверку
  # в новый повод для отказа незачем.
  failed_when: false
  check_mode: false

- name: Открытые половины из списка, без подписей
  # Подпись в конце строки (например, «ноутбук») у каждого своя, сравнивать
  # нужно только тело ключа. Сравнение подстрокой не годится: в base64
  # есть знаки + и /, а они значащие для регулярных выражений.
  ansible.builtin.set_fact:
    base_key_bodies: >-
      {{ base_deploy_ssh_keys | map('trim')
         | map('regex_replace', '^(\S+)\s+(\S+).*$', '\2') | list }}

- name: Остановиться, если нашего ключа нет в списке
  when: base_current_pubkey.rc == 0
  ansible.builtin.assert:
    that: base_current_pubkey.stdout.split()[1] in base_key_bodies
    fail_msg: >-
      Ключа, которым идёт это подключение, нет в base_deploy_ssh_keys.
      Следующий шаг стёр бы его с машины, и войти стало бы нельзя — остались
      бы только веб-консоль провайдера и пароль root. Настройка остановлена,
      машина не тронута. Проверь список в servers.yml.
    success_msg: "Наш ключ в списке — стирать лишние безопасно"

- name: Открытые ключи, которым разрешён вход
  # exclusive: true — ключи, которых нет в списке, УДАЛЯЮТСЯ. Именно это
  # и обещано: убрал строку в servers.yml, прогнал настройку — доступ отозван.
  #
  # Ключи передаются ОДНОЙ строкой через перевод строки, а не циклом.
  # С циклом и exclusive каждый следующий виток стирал бы предыдущий,
  # и на машине остался бы ровно последний ключ из списка — классическая
  # ловушка этого модуля.
  ansible.posix.authorized_key:
    user: "{{ base_deploy_user }}"
    key: "{{ base_deploy_ssh_keys | join('\n') }}"
    state: present
    exclusive: true
  # В сухом прогоне на свежей машине пользователя ещё нет, и модуль не может
  # проверить, что сделает. Это ограничение сухого режима, а не ошибка:
  # при настоящем запуске пользователь уже создан задачей выше.
  ignore_errors: "{{ ansible_check_mode }}"
