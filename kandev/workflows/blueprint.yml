# Blueprint — описание продукта в репозитории проекта (docs/knowledge/):
# продукт, акторы, сущности, действия, экраны, интеграции, сценарии, стек.
#
# Служебная цепочка, как Conventions: владелец надиктовывает в текст карточки,
# что хочет сказать о продукте (идею, одну часть целиком, весь продукт заново,
# список того, что не совпало после использования), роль показывает, что
# рассказ меняет в записанном, спрашивает одним пакетом только о противоречиях
# и концовках сценариев, раскладывает остальное по файлам, а пробелы записывает
# допущениями. Вторая роль сверяет разложенное с рассказом. Человек читает
# и принимает.
#
# Описание необязательно: проект без docs/knowledge/ дорожка Deep
# обслуживает как прежде. Когда папка есть, роли Deep читают её первой
# после каждого сброса памяти, наравне с AGENTS.md, и в неё не пишут.
#
# Машинная проверка стоит перед человеком по той же причине, что Plan Review
# в Deep: висячий ключ и потерянный кусок рассказа вниз по цепочке никто не
# ловит. Предел — один автовозврат между сообщениями человека; память
# проверяющего не сбрасывается, поэтому он сам знает, израсходован ли возврат.
#
# Возврат — заметками на Human Review и перетаскиванием на Blueprint, когда
# мысль закончена; память не сбрасывается, агент видит все заметки.
version: 1
type: kandev_workflow
workflows:
  - name: Blueprint
    # Порядок дорожек на доске (ключ наш, не Kandev; выкатка вырезает его перед импортом).
    sort_order: 0
    description: "docs/knowledge/: разложить рассказ владельца о продукте по описанию, спросить только о противоречиях и концовках, сверить разложенное с рассказом, отдать на приёмку."
    prompt: |
      @custom-git-safety
    steps:
      - name: Backlog
        position: 0
        color: bg-neutral-400
        agent_profile:
          agent_name: Claude
          model: sonnet
          mode: bypassPermissions
        prompt: |
          @custom-gate

          Колонка сейчас: Backlog, первые ворота. Обычно карточка здесь ещё
          не работала, и приёмочную записку писать не из чего: тогда скажи
          одной строкой, что задача ждёт запуска. Начать работу — перетащить
          на Blueprint.

          Если в этом сообщении есть текст от человека — сначала допиши его
          дословно в `.kandev/artifacts/$KANDEV_TASK_ID/notes.md`, потом отвечай.
          Пишется любое сообщение, кроме начинающихся с `?` — это вопрос тебе.

        events: {}
        is_start_step: true
        show_in_command_panel: false
        allow_manual_move: true
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false

      # Форма восьми файлов подключена вместе с ролью: роль пишет по ней,
      # а не по памяти о том, как выглядит запись.
      - name: Blueprint
        position: 1
        color: bg-purple-500
        agent_profile:
          agent_name: Claude
          model: sonnet
          mode: bypassPermissions
        prompt: |
          @custom-blueprint

          @custom-knowledge-shape

          Колонка сейчас: Blueprint. Если в этой сессии ты уже работал, карточку
          вернули сюда: прочитай все заметки человека с прошлого раза и
          действуй по ним.

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Форма нужна и проверяющему: без неё «ключ обязан существовать в своём
      # файле» проверить не по чему. Память не сбрасывается нарочно: на втором
      # заходе роль проверяет, закрыты ли её же находки, и знает, что
      # автовозврат уже израсходован.
      - name: Blueprint Review
        position: 2
        color: bg-yellow-500
        # Модель другая, чем у автора, не ради силы, а ради сессии: Kandev
        # заводит сессию на профиль, и ревьюер на том же профиле продолжал бы
        # разговор автора — своей же работы свежим взглядом не прочитать.
        # Профиль по имени: тройка у Opus high и xhigh одна.
        agent_profile:
          agent_name: Claude
          model: opus[1m]
          mode: bypassPermissions
          profile_name: Opus
        prompt: |
          @custom-blueprint-check

          @custom-knowledge-shape

          Колонка сейчас: Blueprint Review. Возврат — на Blueprint, дальше —
          на Human Review.

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Ворота человека: прочитать разложенное и список «решил за вас»,
      # при PR — diff. Принять — в Done. Поправить — написать, что не так,
      # и перетащить на Blueprint.
      - name: Human Review
        position: 3
        color: bg-orange-500
        agent_profile:
          agent_name: Claude
          model: sonnet
          mode: bypassPermissions
        prompt: |
          @custom-gate

          Колонка сейчас: Human Review, ворота человека. Принять — перетащить
          в Done. Доработать — написать заметки и перетащить на Blueprint;
          описание снова пройдёт Blueprint Review.

          Если в этом сообщении есть текст от человека — сначала допиши его
          дословно в `.kandev/artifacts/$KANDEV_TASK_ID/notes.md`, потом отвечай.
          Пишется любое сообщение, кроме начинающихся с `?` — это вопрос тебе.

        events: {}
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: false
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false

      - name: Done
        position: 4
        color: bg-green-500
        agent_profile:
          agent_name: Claude
          model: sonnet
          mode: bypassPermissions
        prompt: |
          @custom-gate

          Колонка сейчас: Done, работа принята. Переоткрыть — написать, что
          изменилось, и перетащить на Blueprint.

          Если в этом сообщении есть текст от человека — сначала допиши его
          дословно в `.kandev/artifacts/$KANDEV_TASK_ID/notes.md`, потом отвечай.
          Пишется любое сообщение, кроме начинающихся с `?` — это вопрос тебе.

        events: {}
        is_start_step: false
        show_in_command_panel: false
        allow_manual_move: true
        auto_archive_after_hours: 168
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false
