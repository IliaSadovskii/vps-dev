# Файл подкачки.
#
# Провайдеры обычно не дают подкачки вовсе. Без неё всплеск памяти при
# сборке образа или установке зависимостей убивает процесс без внятного
# объяснения — подкачка здесь не «расширение памяти», а подушка от таких
# всплесков.
#
# КРИТИЧНО: сколько подкачки уже есть, считаем СУММОЙ активных устройств
# из /proc/swaps, а не наличием файла /swapfile. Если владелец однажды
# докрутил своп руками (добавил второй файл, раздел) или base_swap_size_gb
# в servers.yml подняли, проверка «по имени файла» решила бы, что подкачки
# мало, и создала бы ещё один swapfile поверх уже достаточного объёма —
# машина получила бы вдвое больше свопа, чем нужно, при каждом таком случае.

- name: Узнать, сколько подкачки уже подключено
  ansible.builtin.shell:
    # Третья колонка /proc/swaps — размер устройства в килобайтах,
    # первая строка — заголовок, её пропускаем.
    cmd: set -o pipefail; awk 'NR>1 {sum+=$3} END {print sum+0}' /proc/swaps
    executable: /bin/bash
  changed_when: false
  check_mode: false
  register: base_swap_current_kib

- name: Сколько подкачки должно быть и какой запас на заголовок mkswap
  ansible.builtin.set_fact:
    base_swap_target_kib: "{{ (base_swap_size_gb | int) * 1024 * 1024 }}"
    # mkswap отъедает у файла несколько десятков килобайт под собственный
    # заголовок, и то, что подключено, в /proc/swaps всегда чуть меньше
    # выделенного файла. ~64 МБ запаса — чтобы это не читалось как
    # «не хватает» и не плодило новый файл при каждом прогоне.
    base_swap_tolerance_kib: 65536

- name: Досоздать файл подкачки, если суммарного объёма не хватает
  # Сравнение без вычета допуска из недостачи: пока фактическая нехватка
  # меньше запаса на заголовок mkswap, это в пределах допуска, а не повод
  # действовать.
  when: (base_swap_target_kib | int) - (base_swap_current_kib.stdout | int) > (base_swap_tolerance_kib | int)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      # Имя не должно столкнуться с уже существующим свопом: то, что суммы
      # не хватает, не значит, что /swapfile свободен — он мог быть создан
      # вручную под меньшим объёмом и уже занят активными данными. Такой
      # своп НЕ трогаем (не увеличиваем, не пересоздаём) — только добавляем
      # рядом ещё один файл на недостающий объём.
      name=/swapfile
      n=2
      while [ -e "$name" ]; do
        name="/swapfile$n"
        n=$((n + 1))
      done

      # Собираем под временным именем и переименовываем последним шагом.
      # Так «файл нужного имени существует» означает «все шаги дошли до
      # конца» — оборвись прогон между fallocate и mkswap, на диске остался
      # бы файл без заголовка подкачки, и swapon при загрузке молча падал бы.
      tmp="${name}.new"
      rm -f "$tmp"
      fallocate -l {{ (((base_swap_target_kib | int) - (base_swap_current_kib.stdout | int)) / 1024 / 1024) | round(0, 'ceil') | int }}G "$tmp"
      # Права только для root: в файле подкачки лежат куски памяти процессов.
      chmod 600 "$tmp"
      chown root:root "$tmp"
      # Вывод mkswap — в никуда: stdout этой задачи читается как имя файла
      # (base_swap_new_file ниже), и однажды две строки mkswap уже уехали
      # в /etc/fstab мусорными записями.
      mkswap "$tmp" >/dev/null
      mv "$tmp" "$name"
      swapon "$name"
      echo "$name"
    executable: /bin/bash
  register: base_swap_created
  # Задача либо пропущена условием `when` выше (нехватки нет), либо реально
  # создаёт файл и включает его командой swapon — промежуточного состояния
  # «выполнилась, но менять было нечего» тут не бывает.
  changed_when: true
  notify: Подключить новый файл подкачки при загрузке

- name: Запомнить имя нового файла подкачки для обработчика
  # Обработчики срабатывают позже (в конце всего прогона) и не видят
  # register этой роли напрямую, только факты — поэтому имя файла кладём
  # в факт здесь, пока base_swap_created ещё под рукой. Без `when`: если
  # задача выше была пропущена, здесь просто ляжет пустая строка — обработчик
  # её не увидит, потому что notify выше сработал только при реальном
  # изменении.
  ansible.builtin.set_fact:
    base_swap_new_file: "{{ (base_swap_created.stdout_lines | default([]) | last) | default('') | trim }}"

# ═══ Уменьшение ══════════════════════════════════════════════════════
#
# Своп на диске — это место: 12 ГБ файла были шестой частью всего диска.
# Уменьшаем, только когда своп ровно один и это наш /swapfile: чужие
# устройства (раздел, второй файл руками) не трогаем, а только говорим.
#
# Без окна «совсем без подкачки»: сначала включается временный файл нужного
# размера, страницы переезжают на него с /swapfile при swapoff, /swapfile
# пересоздаётся меньшим, и временный выключается — страницы переезжают
# обратно. Условие — занятое сейчас помещается в новый размер с запасом
# в гигабайт и на диске есть место под временный файл. Не выполнено —
# задача пропускается и говорит почему; следующий прогон попробует снова.

- name: Сколько подкачки занято и какие устройства подключены
  ansible.builtin.shell:
    cmd: set -o pipefail; awk 'NR>1 {print $1, $3, $4}' /proc/swaps
    executable: /bin/bash
  changed_when: false
  check_mode: false
  register: base_swap_devices

- name: Нужно ли уменьшать подкачку
  ansible.builtin.set_fact:
    base_swap_shrink: >-
      {{ (base_swap_current_kib.stdout | int) - (base_swap_target_kib | int) > (base_swap_tolerance_kib | int)
         and base_swap_devices.stdout_lines | length == 1
         and base_swap_devices.stdout_lines[0].split()[0] == '/swapfile' }}
    base_swap_used_kib: "{{ (base_swap_devices.stdout_lines[0].split()[2] | int) if base_swap_devices.stdout_lines | length > 0 else 0 }}"

- name: Сказать, что подкачки больше нужного, но устройство не наше
  ansible.builtin.debug:
    msg: >-
      Подкачки {{ ((base_swap_current_kib.stdout | int) / 1048576) | round(1) }} ГБ при
      base_swap_size_gb={{ base_swap_size_gb }}, но устройства не одно /swapfile
      ({{ base_swap_devices.stdout_lines | join('; ') }}) — уменьшать не берусь.
  when:
    - (base_swap_current_kib.stdout | int) - (base_swap_target_kib | int) > (base_swap_tolerance_kib | int)
    - not base_swap_shrink

- name: Сказать, что в сухом прогоне подкачка не уменьшается
  ansible.builtin.debug:
    msg: >-
      Сухой прогон: /swapfile будет уменьшен
      с {{ ((base_swap_current_kib.stdout | int) / 1048576) | round(1) }} до {{ base_swap_size_gb }} ГБ
      (занято сейчас {{ ((base_swap_used_kib | int) / 1048576) | round(1) }} ГБ).
  when: base_swap_shrink and ansible_check_mode

- name: "Уменьшить /swapfile до размера в ГБ — {{ base_swap_size_gb }}"
  when: base_swap_shrink
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      target={{ base_swap_size_gb | int }}G
      used_kib={{ base_swap_used_kib | int }}
      need_kib=$(( {{ base_swap_target_kib | int }} - 1048576 ))
      if [ "$used_kib" -gt "$need_kib" ]; then
        echo "занято ${used_kib} КиБ подкачки — в ${target} с запасом не помещается, пропускаю" >&2
        exit 3
      fi
      free_kib=$(df --output=avail -k / | tail -1)
      if [ "$free_kib" -lt $(( {{ base_swap_target_kib | int }} + 2097152 )) ]; then
        echo "на диске нет места под временный файл подкачки, пропускаю" >&2
        exit 3
      fi
      tmp=/swapfile.shrink
      swapoff "$tmp" 2>/dev/null || true
      rm -f "$tmp" /swapfile.new
      fallocate -l "$target" "$tmp"
      chmod 600 "$tmp"
      mkswap "$tmp" >/dev/null
      swapon "$tmp"
      swapoff /swapfile
      rm -f /swapfile
      fallocate -l "$target" /swapfile.new
      chmod 600 /swapfile.new
      mkswap /swapfile.new >/dev/null
      mv /swapfile.new /swapfile
      swapon /swapfile
      swapoff "$tmp"
      rm -f "$tmp"
    executable: /bin/bash
  register: base_swap_shrunk
  # Код 3 — «условие не выполнено», не авария: прогон идёт дальше.
  failed_when: base_swap_shrunk.rc not in [0, 3]
  changed_when: base_swap_shrunk.rc == 0

- name: Сказать, почему подкачка не уменьшена
  ansible.builtin.debug:
    msg: "{{ base_swap_shrunk.stderr }}"
  when:
    - base_swap_shrunk is not skipped
    - base_swap_shrunk.rc | default(0) == 3

- name: Убрать из fstab мусор от прежнего вывода mkswap
  # Две строки вида «Setting\040up\040swapspace…» и «no\040label,\040UUID=…»
  # попали туда, когда имя нового файла читалось из всего stdout задачи
  # (исправлено выше). systemd на загрузке на них ругается.
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '{{ item }}'
    state: absent
  loop:
    - '^Setting\\040up\\040swapspace'
    - '^no\\040label,'
