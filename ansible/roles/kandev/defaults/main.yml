# Kandev — доска, где задача едет по шагам, а на каждом свой агент.
#
# Служба на хосте, не в Docker. В контейнере CLI агентов пришлось бы ставить
# и логинить отдельно от agent-of-empires — то есть заходить в каждого
# провайдера дважды. См. roles/agents для устройства общего входа.

# Версия — kandev_version из servers.yml, точная, не latest. Релизы Kandev
# выходят раз в два дня, миграции схемы применяются автоматически при
# старте, а откат старой версии на уже мигрированную базу не гарантирован:
# случайный «latest» в день выкатки может однажды не суметь съехать назад.

# Каталог данных. Явно /var/lib/kandev, а не домашний ~/.kandev по умолчанию
# у самого Kandev: службе --system положено собственное системное место,
# не зависящее от того, что происходит с домашним каталогом пользователя.
kandev_home_dir: /var/lib/kandev

# Порт — из общего для машины реестра инфраструктурных портов (см. README
# vps-dev): 8060 Dozzle, 8061 DbGate, 8062 дашборд, 8064 — Kandev.
kandev_port: 8064

# Автопоиск репозиториев на машине. По умолчанию у Kandev это пустой
# список — без него доска не находит вообще ничего в /projects.
kandev_repository_discovery_roots:
  - /projects
kandev_repository_discovery_max_depth: 3

# Куда Kandev клонирует репозитории, которые сам достаёт с GitHub.
kandev_repo_clone_base_path: /projects

# ═══ Резервное копирование ═══════════════════════════════════════════════
#
# Своей команды снимка базы у kandev CLI нет (проверено по
# https://kandev.ai/docs/operations — снимок делается только через
# Settings > System > Backups в интерфейсе, либо вручную `sqlite3 ...
# VACUUM INTO`). VACUUM INTO работает на живой базе в режиме WAL и не
# требует останавливать службу — поэтому снимаем им, а не через
# `sqlite3 ... .backup` и не остановкой службы.
kandev_backup_dir: "{{ kandev_home_dir }}/data/backups"

# Раз в сутки, в тихий час.
kandev_backup_hour: "3"

# Снимков не чистит сам Kandev («Manual snapshots are never automatically
# pruned» — та же страница документации). Чистим сами, иначе каталог растёт
# без предела.
kandev_backup_keep: 14
