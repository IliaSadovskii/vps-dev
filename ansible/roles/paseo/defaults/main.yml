# Paseo — второй клиент к тем же CLI агентов, что видит терминал: веб и
# телефон вместо SSH-сессии, рядом с aoe. Тот же пользователь и тот же
# $PATH — CLI и логин уже поставила roles/agents, paseo их только находит.
#
# npm-пакет, версия зафиксирована, а не latest — как и у посредника
# браузера (roles/browser): обновление сменой строки здесь, а не молча
# под работающими агентами.
paseo_version: "0.8.0"

# Порт — из общего реестра инфраструктурных портов машины (см. README
# vps-dev и roles/ports/files/ports): 8075, первый живой свободный после
# herdr (8074) — 8073 в RESERVED_NOTE выглядел свободным, но занят
# orch-chains, который в заметке не упомянут (проверено `ss -ltnp`, не
# только чтением заметки).
paseo_port: 8075

# Каталог состояния демона: конфиг, ключи пары устройств, реестр агентов.
paseo_home: "/home/{{ base_deploy_user }}/.paseo"
