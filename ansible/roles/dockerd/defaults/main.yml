---
# Всё содержимое /etc/docker/daemon.json.
#
# Файл пишет ТОЛЬКО эта роль. Готовая geerlingguy.docker тоже умеет писать
# его — целиком, поверх docker_daemon_options, и сразу перезапускает движок
# (внутри неё flush_handlers). Отдай ей хоть один ключ, и на каждом прогоне
# она затирала бы наши, а мы дописывали бы их обратно: два перезапуска
# Docker за прогон, все контейнеры дважды подпрыгивают, changed≠0 навсегда.
# Поэтому docker_daemon_options в site.yml не задаётся вовсе (пустой словарь
# роль geerlingguy.docker не пишет), а ротация журналов живёт здесь.
#
# ПУБЛИКАЦИЯ ПОРТОВ ТОЛЬКО НА LOCALHOST — самое важное в этой роли. Docker
# пишет правила прямо в iptables ДО цепочек UFW, поэтому `ports: "5432:5432"`
# в любом compose открыл бы порт всему интернету несмотря на
# `ufw default deny incoming`. Доступ снаружи даёт только Tailscale
# (см. роль ports и firewall).
#
# Ключей ДВА, и одного мало:
#   ip                   — действует ТОЛЬКО на стандартный bridge (docker0).
#   default-network-opts — то же самое, но для КАЖДОЙ создаваемой bridge-сети,
#                           включая пользовательские сети, а их создаёт любой
#                           `docker compose up`.
#
# Проверено на Docker 29: `docker run -p` слушает 127.0.0.1, а
# `docker compose up` того же образа — 0.0.0.0. То есть для реальных
# проектов, а их сети всегда пользовательские, одного "ip" не хватает.
#
# Требует Docker >= 28 — вышестоящая geerlingguy.docker ставит docker-ce
# из официального репозитория, версия там всегда актуальная.
dockerd_daemon_extra:
  ip: "127.0.0.1"
  default-network-opts:
    bridge:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
  # Ротация журналов обязательна: без неё журнал одного разговорчивого
  # контейнера однажды заполняет диск целиком, и падает всё сразу.
  log-driver: json-file
  log-opts:
    max-size: "10m"
    max-file: "3"
