# Свой сервер уведомлений (ntfy) — а не публичный ntfy.sh.
#
# В уведомления летят заголовки задач и вопросы агентов. На публичном
# сервере топик — это по сути пароль: угадавший строку читает всё, что
# в неё когда-либо публиковали. Свой сервер за Tailscale снимает риск
# целиком — до него в принципе не дотянуться снаружи частной сети.

ntfy_dir: /srv/vps-dev/ntfy

# Версия закреплена точно — тот же смысл, что у logs_image и dbclient_image.
ntfy_image: binwiederhier/ntfy:v2.28.0

ntfy_container_name: vps-dev-ntfy

# Порт на адресе частной сети. Третий занятый в инфра-диапазоне 8060-8069
# (см. bin/ports в /home/dev/vps): 8060 — Dozzle, 8061 — DbGate, 8062 —
# дашборд ports-web.
ntfy_port: 8063

# Докер-том для очереди недоставленных сообщений и файла кеша.
ntfy_volume: vps-dev-ntfy-data

# Лёгкий демон на Go — 128 МБ с большим запасом.
ntfy_memory_limit: 128m

# Сутки-двое: это оповещения, а не архив. Формат — собственный синтаксис
# ntfy (число + единица: h — часы, d — дни).
ntfy_cache_duration: "48h"

# Топик, в который пишут heartbeat и агенты. Берётся из окружения:
# scripts/lib.sh включает VPS_DEV_NTFY_TOPIC в SECRETS — список всего,
# что вообще доезжает до контейнера с Ansible.
#
# Определяем здесь, в defaults, а не через set_fact в задачах ниже — и это
# важно. В site.yml роль ntfy идёт ПОСЛЕ heartbeat, но переменные из
# defaults/main.yml статически подключённой роли Ansible подгружает для
# ВСЕЙ пьесы заранее, при разборе site.yml, ещё до первой задачи. set_fact
# так не умеет: он появился бы только когда до задачи ntfy дойдёт очередь,
# и heartbeat увидел бы пустоту. Поэтому именно defaults — способ сделать
# факт доступным роли, которая выполняется раньше по списку.
ntfy_topic: "{{ lookup('env', 'VPS_DEV_NTFY_TOPIC') | default('', true) }}"
