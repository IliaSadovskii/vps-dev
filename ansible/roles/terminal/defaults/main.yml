# Терминал в браузере (ttyd) — с дашборда, без SSH-клиента под рукой.
#
# Открывается сразу в каталоге проектов: клонировать репозиторий, войти
# в CLI агента браузером, посмотреть `ports map`. Внутри — общая tmux-сессия
# «console»: закрыл вкладку, открыл снова — всё на месте, и начатый в ней
# вход в провайдера не пропадёт.
#
# Пароля нет: границу держит Tailscale, как у Kandev и aoe. Это терминал
# пользователя {{ base_deploy_user }} с sudo без пароля — то есть root для
# любого участника частной сети. Ровно столько же даёт Kandev.
terminal_version: "1.7.7"
terminal_install_dir: /usr/local/bin
# Порт из инфра-заповедника 8060-8079 (см. roles/ports/files/ports).
terminal_port: 8066
# Где открывается: каталог проектов из роли base.
terminal_cwd: "{{ base_projects_dir }}"
