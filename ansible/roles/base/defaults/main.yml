# Значения по умолчанию роли base.
#
# Что относится к площадке (кто заходит, какой пароль) — в servers.yml,
# в переменных с теми же именами: там выше приоритет, и оно перекрывает
# значения отсюда. Здесь — то, что роль умеет сама, без внешней настройки.

# Под root не работаем: опечатка в команде обходится дороже, чем неудобство
# писать sudo. Пользователь — тот же, что заведёт себе аварийную сессию
# claude-project и будет постоянно жить на машине.
base_deploy_user: dev

# Открытые ключи, которым разрешён вход. Своих у роли нет: без списка
# она остановится на проверке, что дальше некуда, и это правильно —
# см. tasks/user.yml.
base_deploy_ssh_keys: []

# Пароль root. Пустая строка — «не задавать»: аварийный вход через
# веб-консоль провайдера в этом случае просто не будет работать.
base_root_password: ""

# UTC — сервер один, но привычка сравнимых логов важна, а личный часовой
# пояс владельца в общем для сервера коде не место.
base_server_timezone: Etc/UTC

# Своп. Провайдеры обычно не дают подкачки вовсе, а сборка образов и
# установка зависимостей время от времени даёт всплеск памяти, который
# без подушки убивает процесс без внятного объяснения.
#
# 8, а не 12: на dev-hel1-3 (7,6 ГБ памяти) за 10 дней sar своп в пике
# занимал 4,7 ГБ, обычно 2–3 ГБ, а доступной памяти в тот же час оставалось
# 3 ГБ — в своп уезжают холодные страницы простаивающих CLI агентов, а не
# нехватка. Обратно они почти не читаются (pswpin в пике 17 страниц/с), так
# что zram выигрыша не даёт. 8 ГБ — пик плюс 3 ГБ запаса; 4 ГБ было бы
# меньше пика. Файл уменьшается на месте (tasks/swap.yml), без окна без
# подкачки.
base_swap_size_gb: 8

# fail2ban для sshd. Пороги мягкие НАМЕРЕННО.
#
# Вход только по ключу (PasswordAuthentication no), поэтому перебор пароля
# невозможен в принципе — fail2ban здесь лишь чистит мусор в логах, а не
# защищает от взлома. Жёсткие пороги с эскалацией срока раньше приводили
# к самобану ВЛАДЕЛЬЦА при входе с динамического IP (несколько неудачных
# попыток подряд — например, IDE переподключается со старым сохранённым
# ключом — и человек сам себя банил на растущий срок). Отсюда: попыток
# много, срок бана короткий и не растёт.
base_fail2ban_maxretry: 10
base_fail2ban_findtime: 10m
base_fail2ban_bantime: 15m

# Каталог, где будут жить репозитории проектов. Он же подмонтирован
# в дом пользователя (почему — tasks/projects-dir.yml).
base_projects_dir: /projects
base_projects_home_dir: "/home/{{ base_deploy_user }}/projects"
