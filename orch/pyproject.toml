[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orch"
version = "0.1.0"
description = "Оркестратор ролей поверх Agent of Empires"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
orch = "orch.cli:main"
orch-plugin = "orch.plugin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["live: ходит в живой Agent of Empires на 127.0.0.1:8065"]
testpaths = ["tests"]
