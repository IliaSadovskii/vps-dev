# Менеджер проекта — побочная роль (`ASIDE-PLAN.md` §11). Просыпается, когда
# задача доведена до конца или снята, и делает две вещи, которых не делает
# ни один шаг цепочки: копит решения проекта и сверяет с ними бэклог.
#
# Копилка нужна потому, что все шаги начинают с чистой памятью: без неё
# каждая новая задача переоткрывает те же грабли и заново отвергает то, что
# уже отвергали. Бэклог нужен потому, что законченная задача может сделать
# лежащие в нём заявки неверными, а увидеть это некому: шаг видит свою
# задачу, владелец смотрит доску глазами.
#
# Задачи он не двигает и в прогон не вмешивается. Но устоявшееся знание
# должно уезжать из копилки в документацию проекта, поэтому у него есть своя
# копия проекта и право коммитить: он открывает PR с правкой документов, а
# владелец читает его и решает. Молчаливой правки нет — только PR.
name: manager
title: Менеджер проекта
scope: project
enabled: false

workspace: task            # копия задачи — читать, что было сделано
mirror: worktree:project   # своя копия проекта — писать документацию в свою ветку
memory: project
rights: [read, memory, patch, pr]
# Просыпается один раз — на закрытии задачи. Второй ход про запас: сессия
# может умереть на полпути, и движок заведёт её заново.
budget: { runs_per_task: 2 }

wakes:
  - on: [done, closed]
    title: Задача доведена до конца или снята
    prompt: role-manager
    run: { agent: claude, model: sonnet, effort: medium }
