# Paseo — веб/мобильный клиент к CLI агентов: ставим npm-пакетом,
# поднимаем демоном на хосте от того же пользователя. Он находит
# claude/codex/opencode на $PATH и их логин сам (roles/agents),
# досогласовывать нечего.

# --- Agent of Empires и orch, которые стояли здесь до Paseo -----------------
# Роли aoe и orch из репозитория удалены, но с уже настроенной машины их
# должен убрать кто-то: удалённая роль не выполняется и ничего не сносит.
# На машине, где их не было или их уже убрали, задачи ничего не делают.
#
# Вместе со службами уходят их данные: настройки и сессии aoe, база задач
# orch и её снимки. Рабочие копии задач orch (`<проект>-orch` в /projects)
# остаются — это ветки проектов, а не состояние orch. Хуки aoe в
# settings.json Claude Code убирает роль style: у файла один писатель.

- name: Какие юниты aoe и orch ещё есть
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  loop: [aoe-web.service, orch-chains.service, orch-sweep.timer, orch-sweep.service]
  register: paseo_retired_units
  check_mode: false

- name: Остановить и выключить службы aoe и orch
  # orch-sweep.service без [Install]: её запускает таймер, гасим его.
  ansible.builtin.systemd:
    name: "{{ item.item }}"
    state: stopped
    enabled: false
  loop: "{{ paseo_retired_units.results | selectattr('stat.exists') | rejectattr('item', 'eq', 'orch-sweep.service') }}"
  loop_control:
    label: "{{ item.item }}"

- name: Убрать юниты, программы и данные aoe и orch
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/aoe-web.service
    - /etc/systemd/system/orch-chains.service
    - /etc/systemd/system/orch-sweep.service
    - /etc/systemd/system/orch-sweep.timer
    - /usr/local/bin/aoe
    - /usr/local/bin/orch
    - /usr/local/bin/orch-plugin
    - /usr/local/bin/orch-chains
    - /usr/local/bin/orch-sweep
    - /usr/local/bin/orch-backup.sh
    # Настройки, сессии, журналы aoe и плагин orch в нём.
    - /home/{{ base_deploy_user }}/.config/agent-of-empires
    # База задач, venv и правленые цепочки orch.
    - /home/{{ base_deploy_user }}/.local/share/orch
    - /var/backups/vps-dev/orch
    # Копия orch/, которую обвязка присылала для прогона на машине.
    - /home/{{ base_deploy_user }}/.vps-dev/src/orch

- name: Перечитать systemd после удаления юнитов aoe и orch
  ansible.builtin.systemd:
    daemon_reload: true
  when: paseo_retired_units.results | selectattr('stat.exists') | list | length > 0

- name: Убрать ночной снимок базы orch
  ansible.builtin.cron:
    name: "orch: снимок базы задач"
    user: "{{ base_deploy_user }}"
    state: absent

- name: Убрать версию aoe, выбранную на машине
  # Её писала страница обновлений (roles/updates) в файл версий машины;
  # службы aoe там больше нет, строка осталась бы мёртвой.
  ansible.builtin.lineinfile:
    path: /var/lib/vps-dev/versions.yml
    regexp: '^aoe_version:'
    state: absent

# --- сам Paseo ---------------------------------------------------------------

- name: Есть ли уже npm
  ansible.builtin.stat:
    path: /usr/bin/npm
  register: paseo_npm_bin
  check_mode: false
  when: ansible_check_mode

- name: Пакет paseo {{ paseo_version }}
  community.general.npm:
    name: "@getpaseo/cli"
    version: "{{ paseo_version }}"
    global: true
    state: present
  when: not (ansible_check_mode and not (paseo_npm_bin.stat.exists | default(false)))
  register: paseo_installed

- name: Каталог состояния paseo
  ansible.builtin.file:
    path: "{{ paseo_home }}"
    state: directory
    owner: "{{ base_deploy_user }}"
    group: "{{ base_deploy_user }}"
    mode: '0700'

- name: Узнать имя машины в частной сети
  # Демон принимает запросы только с заголовком Host из своего списка
  # (--hostnames, защита от DNS rebinding): имя в tailnet нужно передать
  # явно.
  ansible.builtin.shell:
    cmd: set -o pipefail; tailscale status --json | jq -r '.Self.DNSName // empty' | sed 's/\.$//'
    executable: /bin/bash
  register: paseo_dnsname
  changed_when: false
  failed_when: false
  check_mode: false

- name: Предупредить, если частной сети нет
  ansible.builtin.debug:
    msg:
      - "Машина не в частной сети — демон paseo поднимаю только на 127.0.0.1."
      - "Подними Tailscale и прогони настройку заново: клиент станет доступен из сети."
  when: paseo_dnsname.rc != 0 or (paseo_dnsname.stdout | trim | length == 0)

- name: Запомнить имя
  ansible.builtin.set_fact:
    paseo_tailnet_host: "{{ paseo_dnsname.stdout | trim if paseo_dnsname.rc == 0 else '' }}"

- name: Служба демона
  ansible.builtin.template:
    src: paseo.service.j2
    dest: /etc/systemd/system/paseo.service
    owner: root
    group: root
    mode: '0644'
  register: paseo_unit

# Намеренно не обработчик: службу поднимает следующая задача, обработчик опоздал бы.
- name: Перечитать systemd, если юнит изменился  # noqa: no-handler
  ansible.builtin.systemd:
    daemon_reload: true
  when: paseo_unit.changed

- name: Есть ли уже юнит демона
  # Сухой прогон файл юнита не создаёт, а systemd не умеет включать то,
  # чего нет. На настроенной машине юнит на месте.
  ansible.builtin.stat:
    path: /etc/systemd/system/paseo.service
  register: paseo_unit_exists
  check_mode: false
  when: ansible_check_mode

- name: Демон включён и работает
  # restarted — если сменился пакет или юнит, иначе просто started: рестарт
  # ради рестарта на каждом прогоне оборвал бы текущие сессии агентов.
  ansible.builtin.systemd:
    name: paseo
    enabled: true
    state: "{{ 'restarted' if (paseo_installed.changed | default(false) or paseo_unit.changed) else 'started' }}"
  when: not (ansible_check_mode and not (paseo_unit_exists.stat.exists | default(false)))

- name: Демон слушает порт
  # systemd считает службу запущенной сразу после exec: если новая версия
  # не приняла командную строку, модуль выше всё равно вернёт успех, а
  # демон уйдёт в цикл перезапусков. Страница обновлений судит по коду
  # выкатки — без этой проверки она покажет «успешно» над мёртвой службой.
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ paseo_port }}"
    timeout: 120
  when: not ansible_check_mode

- name: Куда смотреть
  ansible.builtin.debug:
    msg: >-
      Paseo: https://{{ paseo_tailnet_host | default('<машина>.ts.net', true) }}:{{ paseo_port }}
      — только из частной сети, карточка на дашборде. Пароля нет:
      границу держит Tailscale, как и у остальных служб машины.
