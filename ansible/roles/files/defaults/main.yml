# Файлы в браузере (File Browser): посмотреть, скачать, загрузить,
# поправить — без SFTP-клиента и без терминала.
#
# Корень — вся машина: владелец хочет видеть сервер целиком, а не только
# проекты. Ссылка с дашборда ведёт сразу в каталог проектов, выше — можно.
# Работает под {{ base_deploy_user }}, не под root: видно всё, что видно
# ему (то есть почти всё), править — своё; системные файлы правятся
# из терминала через sudo, а не из веб-формы без пароля.
#
# Пароля нет: границу держит Tailscale, как у остальных служб машины.
files_version: "2.63.23"
files_install_dir: /usr/local/bin
# Порт из инфра-заповедника 8060-8079 (см. roles/ports/files/ports).
files_port: 8067
files_root: /
# Куда ведёт ссылка с дашборда: путь File Browser к каталогу проектов.
files_start_path: "/files{{ base_projects_dir }}"
# База настроек File Browser (пользователи, вид) — рядом с остальным
# состоянием платформы, владелец — пользователь службы.
files_state_dir: /var/lib/vps-dev/files
