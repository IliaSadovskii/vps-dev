---
# Справочник чужих библиотек для агентов: Context7 как MCP-сервер.
#
# ЗАЧЕМ. Агент помнит синтаксис по обучению, а оно отстаёт от версий,
# которые стоят в проекте. Отсюда выдуманные методы и параметры, которых
# в этой версии уже нет. Context7 отдаёт документацию нужной версии прямо
# в контекст: агент смотрит, а не вспоминает.
#
# ГРАНИЦА. Тексты он берёт из публичного реестра, то есть это чужой текст
# в контексте агента — был случай, когда через такой реестр агентам
# подсовывали вредные указания. Годится смотреть синтаксис, не годится
# слушаться как инструкции; это сказано и в справке.
#
# ЧЕГО ЗДЕСЬ НЕТ. Документация самого Laravel под версии проекта — дело
# проекта, а не машины: её отдаёт laravel/boost, который ставится
# зависимостью и подключается проектным .mcp.json.

# Пакет посредника, версия закреплена: инструмент, к которому агент ходит
# в каждой задаче, не должен меняться сам по себе.
context7_mcp_package: "@upstash/context7-mcp@4.1.0"
# Имя команды, которую даёт этот пакет.
context7_mcp_command: /usr/bin/context7-mcp
# Имя, под которым инструмент видят агенты.
context7_mcp_name: context7

# От чьего имени работают агенты — им прописываются настройки MCP.
context7_user: "{{ base_deploy_user }}"

# Справка: свой файл в каталоге справок по машине, как у браузера.
context7_help_file: /var/lib/vps-dev/style/machine/context7.md
