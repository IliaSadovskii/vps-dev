# Мониторинг (Beszel, MIT): процессор, память, диск, сеть по машине и по
# каждому контейнеру, с историей и порогами. Хаб 12 МБ, агент 8 МБ, один
# бинарник каждый, без облака и подписок. Netdata красивее, но 300+ МБ.
#
# Хаб и агент — на этой же машине. Вход в хаб отключён (AUTO_LOGIN): границу
# держит Tailscale. Первый пользователь и пароль создаются один раз из
# файла окружения, который роль генерирует на машине; пароль нигде больше
# не нужен — он только чтобы API хаба пустил роль зарегистрировать агента.
monitor_version: "0.18.8"
monitor_install_dir: /usr/local/bin
# Порт из инфра-заповедника 8060-8079 (см. roles/ports/files/ports).
monitor_port: 8068
monitor_agent_port: 45876
monitor_state_dir: /var/lib/vps-dev/beszel
