# Deep — ещё не известно, что делать: сначала надо разобраться в вариантах.
#
# Это Standard плюс блок исследования: Research отсеивает мнимые развилки
# и ищет по оставшимся — именно по ним, а не по теме вообще, — Solution
# Synthesis сводит найденное в один вариант, и человек утверждает его до
# планирования.
#
# Прежняя цепочка Standard Development была фактически этим маршрутом.
#
# Общее начало — Backlog, Discovery, Scoping — и общий хвост от Code Review
# до Done описаны одинаково во всех трёх файлах.
# Дублируется только скелет: имя, цвет, события. Смысл роли лежит в одном
# файле ../prompts/<роль>.md, на который ссылаются все дорожки, поэтому
# правка формулировки делается в одном месте.
#
# Каждый автоматический шаг требует явного `step_complete_kandev`. Обычное
# завершение ответа, вопрос человеку, ошибка или пустая заглушка промпта
# задачу не продвигают.
#
# Условий по содержанию в переносимом YAML нет: все переходы безусловны.
# Маршрут выбирает человек, заводя карточку сразу на нужной дорожке, а не
# агент по дороге. Отдельной колонки выбора маршрута нет.
#
# Настройки колонки и как они расставлены (решение 57):
#   is_start_step            — только Backlog: новые карточки встают туда.
#   show_in_command_panel    — карточки колонки видны в быстром поиске
#                              Cmd+K; выключено у Backlog и Done, чтобы не
#                              засорять поиск.
#   allow_manual_move        — можно ли перетащить карточку сюда руками;
#                              открыты только колонки из PROCESS.md, куда
#                              тащит человек (решение 55).
#   auto_advance_requires_signal — переход по on_turn_complete только после
#                              step_complete_kandev; true у всех агентных
#                              колонок, false у ворот и Backlog/Done.
#   cancel_triggers_turn_complete — false везде: остановка агента кнопкой
#                              Stop не считается завершением шага.
#   auto_archive_after_hours — только Done: карточка уходит в архив через
#                              неделю, доска не зарастает.
#   wip_limit, pull_from_step_position, agent_profile — не заданы; профиль
#                              модели по колонкам отложен (решение 12).
#   stage_type               — не задаётся: переключает боковую панель
#                              карточки в режим «ревьюеры/одобряющие»,
#                              который нам не нужен.
#   Цвета: фиолетовый — понять и спланировать, синий — сделать, жёлтый —
#   ревью, янтарный — безопасность, оранжевый — ворота человека, индиго —
#   PR, зелёный — Done, серый — Backlog.
version: 1
type: kandev_workflow
# Имя цепочки на доске — «Development»: дорожка одна, и слово Deep в
# интерфейсе ничего не добавляло. Deep остаётся именем маршрута в
# документах и в имени файла. У свежего Kandev есть своя цепочка с тем же
# именем «Development»: выкатка находит её по имени и перестраивает под
# эту, колонки-образцы без задач удаляются.
workflows:
  - name: Development
    # Порядок дорожек на доске (ключ наш, не Kandev; выкатка вырезает его перед импортом).
    sort_order: 1
    description: "Развилки, точечное исследование, выбранное решение, план с ревью, реализация, ревью, PR."
    prompt: |
      @custom-artifact-protocol
      @custom-git-safety
      @custom-test-ownership
    steps:
      # Ручная очередь на вход: у шага нет событий, поэтому новая задача
      # ждёт здесь, пока её не двинут на Discovery. Есть время дописать
      # условие, прежде чем стартует агент.
      - name: Backlog
        position: 0
        color: bg-neutral-400
        agent_profile:
          agent_name: Claude
          model: sonnet
          mode: bypassPermissions
        # Промпт ворот: сообщение в карточке на Backlog не должно запускать
        # работу без роли.
        prompt: |
          @custom-gate

          Колонка сейчас: Backlog, первые ворота. Обычно карточка здесь ещё
          не работала, и приёмочную записку писать не из чего: тогда скажи
          одной строкой, что задача ждёт запуска. Начать работу — перетащить
          на Discovery.

          Адресат заметок по умолчанию — `.kandev/artifacts/$KANDEV_TASK_ID/notes-scoping.md`;
          ответ, назвавший вариант, идёт роли впереди по общему правилу.

        events:
          on_enter:
            - type: auto_start_agent
        is_start_step: true
        show_in_command_panel: false
        allow_manual_move: true
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false

      # Разведка проекта: стек, правила, структура, существенные файлы.
      # Одинакова во всех трёх дорожках. Её артефакт читают все роли,
      # которым сбросили контекст, — иначе они не знают конвенций проекта.
      - name: Discovery
        position: 1
        color: bg-purple-500
        agent_profile:
          agent_name: Claude
          model: sonnet
          mode: bypassPermissions
        prompt: |
          @custom-discovery

          Колонка сейчас: Discovery. Если в этой сессии ты уже работал, карточку
          вернули сюда: прочитай все заметки человека с прошлого раза и
          действуй по ним.

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Границы задачи: что входит, что намеренно нет и почему, что принято
      # на веру. Маршрут здесь не выбирается — дорожку выбрал человек, заводя
      # карточку. Артефакт нужен ролям со сброшенным контекстом: без него
      # ревью не отличит «забыли сделать» от «намеренно не делаем».
      - name: Scoping
        position: 2
        color: bg-purple-500
        agent_profile:
          agent_name: Claude
          model: sonnet
          mode: bypassPermissions
        prompt: |
          @custom-scoping

          Колонка сейчас: Scoping. Если в этой сессии ты уже работал, карточку
          вернули сюда: прочитай все заметки человека с прошлого раза и
          действуй по ним.

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Без единой настоящей развилки роль сама переносит карточку на
      # Planning мимо Solution Synthesis и Solution Approval: утверждать
      # нечего (решение 50). Пропущенные колонки агента не запускают.
      # Отсев мнимых развилок и поиск по оставшимся — один ход: обе
      # половины и так шли в одном контексте, а порядок «сначала отбери,
      # потом ищи» держится внутри промпта. Память сброшена: чтение
      # репозитория Discovery доезжает файлом, а страницы из интернета не
      # должны лечь в память Planning (решение 43).
      - name: Research
        position: 3
        color: bg-purple-500
        agent_profile:
          agent_name: Claude
          model: sonnet
          mode: bypassPermissions
        prompt: |
          @custom-research

          Колонка сейчас: Research. Если в этой сессии ты уже работал, карточку
          вернули сюда: прочитай все заметки человека с прошлого раза и
          действуй по ним.

          {{task_prompt}}
        events:
          on_enter:
            - type: reset_agent_context
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Память сброшена: все входы — файлы, а профиль модели здесь может
      # отличаться от Research (решение 58), смена модели память и так рвёт.
      - name: Solution Synthesis
        position: 4
        color: bg-purple-500
        agent_profile:
          agent_name: Claude
          model: opus[1m]
          mode: bypassPermissions
          # Усилие xhigh: решение и план размножаются по всей цепочке
          # (решение 66). Профиль по имени, тройка Opus high/xhigh одна.
          profile_name: Opus xhigh
        prompt: |
          @custom-solution-synthesis

          Колонка сейчас: Solution Synthesis. Если в этой сессии ты уже работал, карточку
          вернули сюда: прочитай все заметки человека с прошлого раза и
          действуй по ним.

          {{task_prompt}}
        events:
          on_enter:
            - type: reset_agent_context
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Ворота человека: выбрать решение до того, как оно превратится в план.
      - name: Solution Approval
        position: 5
        color: bg-orange-500
        agent_profile:
          agent_name: Claude
          model: sonnet
          mode: bypassPermissions
        # Сообщение здесь агента не двигает: колонка отвечает «записал»
        # и ждёт (решение 39).
        prompt: |
          @custom-gate

          Колонка сейчас: Solution Approval, ворота человека. Любой вариант
          из предложенных, в том числе не рекомендованный, — это принятие:
          вперёд, на Planning, он построит выбранное. Назад, на Solution
          Synthesis, — когда ни один не подходит: он перепишет разбор вокруг
          заметок и вернёт карточку сюда.

          Доклад владельцу лежит в `solution-synthesis.md`, раздел «Для владельца» — опубликуй его
          дословно. Раздела нет — скажи об этом строкой и собери сам.

          Адресат заметок по умолчанию — `.kandev/artifacts/$KANDEV_TASK_ID/notes-solution-synthesis.md`;
          ответ, назвавший вариант, идёт роли впереди по общему правилу.

        events:
          on_enter:
            - type: auto_start_agent
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: false
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false

      # Память сброшена: все входы Planning — файлы и нативный План, а
      # первый отрезок цепочки иначе тянулся бы на пять шагов.
      - name: Planning
        position: 6
        color: bg-purple-500
        agent_profile:
          agent_name: Claude
          model: opus[1m]
          mode: bypassPermissions
          # Усилие xhigh: решение и план размножаются по всей цепочке
          # (решение 66). Профиль по имени, тройка Opus high/xhigh одна.
          profile_name: Opus xhigh
        prompt: |
          @custom-planning

          Колонка сейчас: Planning. Если в этой сессии ты уже работал, карточку
          вернули сюда: прочитай все заметки человека с прошлого раза и
          действуй по ним.

          {{task_prompt}}
        # Без enable_plan_mode: он подмешивает баннер платформы «сохрани
        # план и остановись, жди ревью», который спорит с сигналом
        # завершения. План и так пишется только в нативный Plan.
        events:
          on_enter:
            - type: reset_agent_context
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Свежий контекст: автор плана не должен быть его единственным критиком.
      - name: Plan Review
        position: 7
        color: bg-yellow-500
        agent_profile:
          agent_name: Codex
          model: gpt-5.6-sol
          mode: default
        prompt: |
          @custom-plan-review

          Колонка сейчас: Plan Review. Если в этой сессии ты уже работал, карточку
          вернули сюда: прочитай все заметки человека с прошлого раза и
          действуй по ним.

          {{task_prompt}}
        events:
          on_enter:
            - type: reset_agent_context
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: false
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Ворота человека: утвердить план до первой правки рабочего кода.
      - name: Plan Approval
        position: 8
        color: bg-orange-500
        agent_profile:
          agent_name: Claude
          model: sonnet
          mode: bypassPermissions
        prompt: |
          @custom-gate

          Колонка сейчас: Plan Approval, ворота человека. Принять — вперёд,
          на Test Authoring. Назад, на Planning, — с заметками: он
          единственный владелец нативного Плана, поправит его и отправит
          снова через Plan Review, то есть карточка вернётся сюда.

          Доклад владельцу лежит в `plan-review.md`, раздел «Для владельца» — опубликуй его
          дословно. Раздела нет — скажи об этом строкой и собери сам.

          Адресат заметок по умолчанию — `.kandev/artifacts/$KANDEV_TASK_ID/notes-planning.md`;
          ответ, назвавший вариант, идёт роли впереди по общему правилу.

        events:
          on_enter:
            - type: auto_start_agent
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: false
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false

      # Начало контекста реализации. Шаг обязан оставить реально падающие
      # тесты: документ с их описанием ничем не обеспечивает test-first.
      - name: Test Authoring
        position: 9
        color: bg-blue-500
        agent_profile:
          agent_name: Claude
          model: sonnet
          mode: bypassPermissions
        prompt: |
          @custom-test-authoring

          Колонка сейчас: Test Authoring. Если в этой сессии ты уже работал, карточку
          вернули сюда: прочитай все заметки человека с прошлого раза и
          действуй по ним.

          {{task_prompt}}
        events:
          on_enter:
            - type: reset_agent_context
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Реализация и проверка одной колонкой: Verification и раньше шла в
      # этом же контексте, своей памяти у неё не было — только свой промпт.
      # Написал и тут же прогнал — это один ход разработчика.
      #
      # Красный прогон роль чинит сама, но не бесконечно: один круг
      # «поправил — прогнал заново», дальше вперёд с пометкой «Не решено».
      - name: Implementation
        position: 10
        color: bg-blue-500
        agent_profile:
          agent_name: Claude
          model: sonnet
          mode: bypassPermissions
        prompt: |
          @custom-implementation

          @custom-verification

          Колонка сейчас: Implementation. Здесь две работы подряд: написать код
          по первой роли, потом прогнать проверки по второй и записать
          `verification.md`. Красный прогон чини сам и прогони заново — но
          только один раз за заход; если после этого всё ещё красно, иди
          вперёд, а несделанное запиши через `kd-state open не-решено
          Implementation "<что>"`.

          Тесты остаются чужими: правило владения из общего промпта действует
          и здесь, красный тест не чинится правкой теста.

          Если в этой сессии ты уже работал, карточку вернули сюда: прочитай
          все заметки человека с прошлого раза и действуй по ним.

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: false
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # на Draft PR мимо Review Fixes и Fix Review (решение 50).
      - name: Code Review
        position: 11
        color: bg-yellow-500
        agent_profile:
          agent_name: Claude
          model: opus[1m]
          mode: bypassPermissions
        prompt: |
          @custom-review-code

          @custom-security-review

          Колонка сейчас: Code Review. Здесь два чтения одного диффа, и делают
          их разные подагенты, а не ты сам подряд: чтение на дефекты по роли
          выше и чтение на безопасность по роли под ней. Запусти их своим
          родным механизмом подагентов, каждому отдай его роль целиком,
          дождись обоих и сведи результат. Независимость чтений и есть смысл
          этой колонки.

          Пишешь два файла, `code-review.md` и `security-review.md`, каждый по
          форме своей роли; находки обоих публикуются через
          publish_review_findings_kandev. Вердикт колонки — худший из двух.
          `kd-state lap "Code Review"` зовёшь ты один раз, подагенты не зовут.

          Переход за ход один и делаешь его ты, а не подагенты. Находки есть
          хотя бы у одного чтения — `step_complete_kandev`, карточка идёт на
          Review Fixes. «Находки» пусты у обоих — Review Fixes и Fix Review
          работали бы вхолостую: найди шаг Draft PR и отправь карточку туда
          через move_task_kandev, одной строкой по-русски сказав, что оба
          чтения чисты. Не вызывай оба перехода: ровно один.

          Если в этой сессии ты уже работал, карточку вернули сюда: прочитай
          все заметки человека с прошлого раза и действуй по ним.

          {{task_prompt}}
        events:
          on_enter:
            - type: reset_agent_context
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: false
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Может быть пустым, если замечаний нет. Сюда возвращают: Fix Review
      # (не больше одного автовозврата на заход) и
      # человек сообщением с Human Review или Done.
      - name: Review Fixes
        position: 12
        color: bg-blue-500
        agent_profile:
          agent_name: Claude
          model: sonnet
          mode: bypassPermissions
        prompt: |
          @custom-review-fixes

          Колонка сейчас: Review Fixes. Если в этой сессии ты уже работал, карточку
          вернули сюда: прочитай все заметки человека с прошлого раза и
          действуй по ним.

          {{task_prompt}}
        events:
          on_enter:
            - type: reset_agent_context
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Свежим взглядом проверяет именно правки по ревью. Без этого между
      # Review Fixes и человеком был только прогон тестов: логическую ошибку
      # в исправлении никто независимо не читал.
      # Одна колонка на две работы, которые судят одни и те же правки:
      # свежее чтение диффа и полный прогон после него. У них и раньше был
      # общий на двоих автовозврат — то есть одна сущность, разложенная на
      # две клетки доски.
      - name: Fix Review
        position: 13
        color: bg-yellow-500
        agent_profile:
          agent_name: Claude
          model: opus[1m]
          mode: bypassPermissions
        prompt: |
          @custom-fix-review

          @custom-final-verification

          Колонка сейчас: Fix Review. Здесь две работы подряд, в этом порядке.
          Сначала прочитай правки свежим взглядом по первой роли и напиши
          `fix-review.md`. Потом прогони полное — тесты, линтер, тайпчекер,
          скрипт владения тестами — по второй роли и напиши
          `final-verification.md`. Читать чужие правки и гонять по ним прогон
          это одно решение «годится или нет», и делить его между колонками
          незачем.

          Вердикт колонки — худший из двух. `kd-state lap "Fix Review"`
          зовёшь один раз в начале хода.

          Переход за ход один и делаешь его после обеих работ. Блокирующий
          вердикт чтения или провал прогона, и `kd-state return fix_chain
          check` говорит `available`: потрать его (`spend`) и верни карточку
          на Review Fixes через move_task_kandev. Возврат потрачен или всё
          чисто — `step_complete_kandev`; несделанное запиши через
          `kd-state open не-решено "Fix Review" "<что>"` и начни закрывающее
          сообщение строкой `Не решено:`.

          Если в этой сессии ты уже работал, карточку вернули сюда: прочитай
          все заметки человека с прошлого раза и действуй по ним.

          {{task_prompt}}
        events:
          on_enter:
            - type: reset_agent_context
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: false
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # final-verification.
      - name: Draft PR
        position: 14
        color: bg-indigo-500
        agent_profile:
          agent_name: Claude
          model: haiku
          mode: bypassPermissions
        prompt: |
          @custom-pull-request

          Колонка сейчас: Draft PR. Если в этой сессии ты уже работал, карточку
          вернули сюда: прочитай все заметки человека с прошлого раза и
          действуй по ним.

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Последние ворота человека. Назад — за правками, вперёд — в Done.
      - name: Human Review
        position: 15
        color: bg-orange-500
        agent_profile:
          agent_name: Claude
          model: sonnet
          mode: bypassPermissions
        prompt: |
          @custom-gate

          Колонка сейчас: Human Review, последние ворота человека.

          Отсюда карточка может уйти в семь мест, и адресат заметок зависит
          от того, куда именно. По умолчанию — Review Fixes: замечание к коду,
          к реализации, упавший CI; хвост до PR пройдёт снова.

          | Куда | Когда | Файл заметок |
          |---|---|---|
          | Done | всё в порядке, принимаю | — |
          | Review Fixes | замечание к коду, к PR, красный CI | notes-review-fixes.md |
          | Test Authoring | нужен новый или другой тест | notes-test-authoring.md |
          | Planning | менялся план | notes-planning.md |
          | Scoping | менялась сама задача | notes-scoping.md |
          | Research | нужны новые данные по вариантам | notes-research.md |
          | Draft PR | не так оформлен пул-реквест | notes-draft-pr.md |

          Заметку человека — любое его сообщение — дословно допиши в файл
          текущего адресата и скажи, для кого записал. Адресата называй в
          расписке всегда и там же говори, что его можно сменить словами.

        events:
          on_enter:
            - type: auto_start_agent
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: false
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false

      - name: Done
        position: 16
        color: bg-green-500
        agent_profile:
          agent_name: Claude
          model: sonnet
          mode: bypassPermissions
        prompt: |
          @custom-gate

          Колонка сейчас: Done, работа принята. Переоткрыть — написать, что
          изменилось, и перетащить на Review Fixes, тем же путём, что и
          с Human Review.

          Доклад владельцу лежит в `pull-request.md`, раздел «Для владельца» — опубликуй его
          дословно. Раздела нет — скажи об этом строкой и собери сам.

          Адресат заметок по умолчанию — `.kandev/artifacts/$KANDEV_TASK_ID/notes-review-fixes.md`;
          ответ, назвавший вариант, идёт роли впереди по общему правилу.

        events:
          on_enter:
            - type: auto_start_agent
        is_start_step: false
        show_in_command_panel: false
        allow_manual_move: true
        auto_archive_after_hours: 168
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false
