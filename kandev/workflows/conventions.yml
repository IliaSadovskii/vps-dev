# Conventions — завести или обновить файл соглашений проекта для агентов
# (AGENTS.md, CLAUDE.md с @AGENTS.md).
#
# Служебная цепочка: агент собирает соглашения по коду и спрашивает владельца
# о том, чего в коде нет; вторая роль сверяет написанное с репозиторием; человек
# читает и принимает. Нужна до первой задачи на Deep: роли той цепочки читают
# этот файл первым после каждого сброса памяти.
#
# Машинная проверка стоит перед человеком по той же причине, что Code Review
# в Deep: автор только что держал весь репозиторий в голове, и правдоподобная
# строка — ровно та, которую он не перечитает. Предел — один автовозврат между
# сообщениями человека; память проверяющего не сбрасывается, поэтому он сам
# знает, израсходован ли возврат.
#
# Возврат — заметками на Human Review и перетаскиванием на Conventions, когда
# мысль закончена; память не сбрасывается, агент видит все заметки.
version: 1
type: kandev_workflow
workflows:
  - name: Conventions
    # Порядок дорожек на доске (ключ наш, не Kandev; выкатка вырезает его перед импортом).
    sort_order: 2
    description: "AGENTS.md / CLAUDE.md: собрать соглашения по коду, спросить владельца о приоритетах, сверить написанное с репозиторием, отдать на приёмку."
    prompt: |
      @custom-git-safety
    steps:
      - name: Backlog
        position: 0
        color: bg-neutral-400
        agent_profile:
          agent_name: Claude
          model: sonnet
          mode: bypassPermissions
        prompt: |
          @custom-gate

          Колонка сейчас: Backlog, первые ворота. Обычно карточка здесь ещё
          не работала, и приёмочную записку писать не из чего: тогда скажи
          одной строкой, что задача ждёт запуска. Начать работу — перетащить
          на Conventions.

          Адресат заметок по умолчанию — `.kandev/artifacts/$KANDEV_TASK_ID/notes-conventions.md`;
          ответ, назвавший вариант, идёт роли впереди по общему правилу.

        events:
          on_enter:
            - type: auto_start_agent
        is_start_step: true
        show_in_command_panel: false
        allow_manual_move: true
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false

      - name: Conventions
        position: 1
        color: bg-purple-500
        agent_profile:
          agent_name: Claude
          model: sonnet
          mode: bypassPermissions
        prompt: |
          @custom-conventions

          Колонка сейчас: Conventions. Если в этой сессии ты уже работал, карточку
          вернули сюда: прочитай все заметки человека с прошлого раза и
          действуй по ним.

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Машинная сверка перед человеком. Память не сбрасывается нарочно: на
      # втором заходе роль проверяет, закрыты ли её же находки, и знает, что
      # автовозврат уже израсходован.
      - name: Conventions Review
        position: 2
        color: bg-yellow-500
        # Модель другая, чем у автора, не ради силы, а ради сессии: Kandev
        # заводит сессию на профиль, и ревьюер на том же профиле продолжал бы
        # разговор автора — своей же работы свежим взглядом не прочитать.
        # Профиль по имени: тройка у Opus high и xhigh одна.
        agent_profile:
          agent_name: Claude
          model: opus[1m]
          mode: bypassPermissions
          profile_name: Opus
        prompt: |
          @custom-conventions-check

          Колонка сейчас: Conventions Review. Возврат — на Conventions,
          дальше — на Human Review.

          {{task_prompt}}
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false

      # Ворота человека: прочитать файл, при PR — diff. Принять — в Done.
      # Поправить — написать, что не так, и перетащить на Conventions.
      - name: Human Review
        position: 3
        color: bg-orange-500
        agent_profile:
          agent_name: Claude
          model: sonnet
          mode: bypassPermissions
        prompt: |
          @custom-gate

          Колонка сейчас: Human Review, ворота человека. Принять — перетащить
          в Done. Доработать — написать заметки и перетащить на Conventions;
          файл снова пройдёт Conventions Review.

          Доклад владельцу лежит в `conventions-review.md`, раздел «Для владельца» — опубликуй его
          дословно. Раздела нет — скажи об этом строкой и собери сам.

          Адресат заметок по умолчанию — `.kandev/artifacts/$KANDEV_TASK_ID/notes-conventions.md`;
          ответ, назвавший вариант, идёт роли впереди по общему правилу.

        events:
          on_enter:
            - type: auto_start_agent
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: false
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false

      - name: Done
        position: 4
        color: bg-green-500
        agent_profile:
          agent_name: Claude
          model: sonnet
          mode: bypassPermissions
        prompt: |
          @custom-gate

          Колонка сейчас: Done, работа принята. Переоткрыть — написать, что
          изменилось, и перетащить на Conventions.

          Адресат заметок по умолчанию — `.kandev/artifacts/$KANDEV_TASK_ID/notes-conventions.md`;
          ответ, назвавший вариант, идёт роли впереди по общему правилу.

        events:
          on_enter:
            - type: auto_start_agent
        is_start_step: false
        show_in_command_panel: false
        allow_manual_move: true
        auto_archive_after_hours: 168
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false
