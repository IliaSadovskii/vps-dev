# ttyd — один статический бинарник с GitHub Releases, версия закреплена.

- name: Имя архитектуры в имени файла релиза
  ansible.builtin.set_fact:
    terminal_arch: "{{ 'x86_64' if ansible_architecture == 'x86_64' else 'aarch64' }}"

- name: Текущая установленная версия
  ansible.builtin.command:
    cmd: "{{ terminal_install_dir }}/ttyd --version"
  register: terminal_current
  changed_when: false
  failed_when: false
  check_mode: false

- name: Нужна установка или обновление
  # `ttyd --version` печатает «ttyd version 1.7.7-40e79c7».
  ansible.builtin.set_fact:
    terminal_needs_install: "{{ terminal_current.rc != 0 or ('version ' ~ terminal_version) not in terminal_current.stdout }}"

- name: Сказать, что в сухом прогоне ttyd не скачивается
  ansible.builtin.debug:
    msg: "Сухой прогон: ttyd {{ terminal_version }} будет скачан и установлен в {{ terminal_install_dir }}."
  when: terminal_needs_install and ansible_check_mode

- name: Поставить ttyd {{ terminal_version }}
  when: terminal_needs_install and not ansible_check_mode
  block:
    - name: Скачать бинарник с проверкой контрольной суммы
      # SHA256SUMS публикуется рядом с релизом; get_url сам находит в нём
      # строку с именем файла.
      ansible.builtin.get_url:
        url: "https://github.com/tsl0922/ttyd/releases/download/{{ terminal_version }}/ttyd.{{ terminal_arch }}"
        dest: "/tmp/ttyd-{{ terminal_version }}.{{ terminal_arch }}"
        checksum: "sha256:https://github.com/tsl0922/ttyd/releases/download/{{ terminal_version }}/SHA256SUMS"
        mode: '0644'
      register: terminal_download

    - name: Поставить бинарник
      ansible.builtin.copy:
        src: "{{ terminal_download.dest }}"
        dest: "{{ terminal_install_dir }}/ttyd"
        remote_src: true
        owner: root
        group: root
        mode: '0755'
      register: terminal_installed

    - name: Убрать временный файл
      ansible.builtin.file:
        path: "{{ terminal_download.dest }}"
        state: absent

- name: Служба терминала
  ansible.builtin.template:
    src: ttyd.service.j2
    dest: /etc/systemd/system/vps-dev-terminal.service
    owner: root
    group: root
    mode: '0644'
  register: terminal_unit

# Намеренно не обработчик: службу поднимает следующая задача, обработчик опоздал бы.
- name: Перечитать systemd, если юнит изменился  # noqa: no-handler
  ansible.builtin.systemd:
    daemon_reload: true
  when: terminal_unit.changed

- name: Есть ли уже юнит терминала
  ansible.builtin.stat:
    path: /etc/systemd/system/vps-dev-terminal.service
  register: terminal_unit_exists
  check_mode: false
  # Только в сухом прогоне: на настоящем это лишний круг по SSH,
  # а условия ниже без сухого прогона и так истинны.
  when: ansible_check_mode

- name: Терминал включён и работает
  ansible.builtin.systemd:
    name: vps-dev-terminal
    enabled: true
    state: "{{ 'restarted' if (terminal_installed.changed | default(false) or terminal_unit.changed) else 'started' }}"
  when: not (ansible_check_mode and not (terminal_unit_exists.stat.exists | default(false)))

- name: Куда смотреть
  ansible.builtin.debug:
    msg: "Терминал: порт {{ terminal_port }} на дашборде https://<машина>.ts.net/ — открывается в {{ terminal_cwd }}, tmux-сессия «console»."
