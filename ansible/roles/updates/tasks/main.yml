# Обновление служб машины кнопкой. См. defaults/main.yml — зачем и как.

- name: Каталоги состояния, очереди и журналов
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ updates_user }}"
    group: "{{ updates_user }}"
    mode: '0755'
  loop:
    - "{{ updates_state_dir }}"
    - "{{ updates_state_dir }}/queue"
    - "{{ updates_state_dir }}/logs"

- name: Список служб, которые умеем обновлять
  # Один список на страницу и на исполнителя: разъехавшись, они молча
  # обновляли бы разное. Источник — defaults этой роли.
  ansible.builtin.copy:
    dest: "{{ updates_state_dir }}/services.json"
    owner: "{{ updates_user }}"
    group: "{{ updates_user }}"
    mode: '0644'
    content: "{{ updates_services | to_nice_json }}\n"

- name: Страница обновлений
  ansible.builtin.copy:
    src: vps-dev-updates
    dest: "{{ updates_install_dir }}/vps-dev-updates"
    owner: root
    group: root
    mode: '0755'
  register: updates_page_script

- name: Исполнитель заданий
  ansible.builtin.copy:
    src: vps-dev-update-run
    dest: "{{ updates_install_dir }}/vps-dev-update-run"
    owner: root
    group: root
    mode: '0755'

- name: Службы и наблюдатель за очередью
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - vps-dev-updates.service
    - vps-dev-update-run.service
    - vps-dev-update-run.path
  register: updates_units

# Намеренно не обработчик: службы поднимаются следующими задачами.
- name: Перечитать systemd, если юниты изменились  # noqa: no-handler
  ansible.builtin.systemd:
    daemon_reload: true
  when: updates_units.changed

- name: Есть ли уже юнит страницы
  ansible.builtin.stat:
    path: /etc/systemd/system/vps-dev-updates.service
  register: updates_unit_exists
  check_mode: false
  when: ansible_check_mode

- name: Страница включена и работает
  ansible.builtin.systemd:
    name: vps-dev-updates
    enabled: true
    state: "{{ 'restarted' if (updates_page_script.changed or updates_units.changed) else 'started' }}"
  when: not (ansible_check_mode and not (updates_unit_exists.stat.exists | default(false)))

- name: Наблюдатель за очередью включён
  # Только .path: сама служба-исполнитель запускается им, а не с загрузки.
  ansible.builtin.systemd:
    name: vps-dev-update-run.path
    enabled: true
    state: started
  when: not (ansible_check_mode and not (updates_unit_exists.stat.exists | default(false)))

# Страница помнит последние версии (latest.json) и прежние, на которые можно
# вернуться (state.json, ключ previous), по id службы — и сама записи не
# убирает. Служба, снятая со страницы, оставалась бы там навсегда. Убираем
# ключи служб, которых нет в updates_services; остальное как было. После
# записи services.json и запуска страницы: опрос версий берёт список оттуда,
# и снятая служба туда больше не вернётся.

- name: Есть ли состояние страницы
  ansible.builtin.stat:
    path: "{{ updates_state_dir }}/{{ item }}"
  loop: [latest.json, state.json]
  register: updates_state_files
  check_mode: false

- name: Прочитать состояние страницы
  ansible.builtin.slurp:
    src: "{{ item.stat.path }}"
  loop: "{{ updates_state_files.results | selectattr('stat.exists') }}"
  loop_control:
    label: "{{ item.item }}"
  register: updates_state_raw

- name: Убрать из состояния страницы службы, которых нет в списке
  ansible.builtin.copy:
    dest: "{{ item.source }}"
    owner: "{{ updates_user }}"
    group: "{{ updates_user }}"
    mode: '0644'
    content: "{{ updates_state_want | to_json(ensure_ascii=false) }}\n"
  loop: "{{ updates_state_raw.results }}"
  loop_control:
    label: "{{ item.source | basename }}"
  vars:
    updates_known_ids: "{{ updates_services | map(attribute='id') | list }}"
    updates_state_now: "{{ item.content | b64decode | from_json }}"
    updates_state_previous: "{{ updates_state_now.previous | default({}) }}"
    updates_state_want: >-
      {{ (updates_state_now | dict2items | selectattr('key', 'in', updates_known_ids) | items2dict)
         if item.source is search('latest\.json$') else
         (updates_state_now | combine({'previous': updates_state_previous | dict2items
                                       | selectattr('key', 'in', updates_known_ids) | items2dict})
          if updates_state_now.previous is mapping else updates_state_now) }}
  when: updates_state_want != updates_state_now

- name: Куда смотреть
  ansible.builtin.debug:
    msg: >-
      Обновления служб: порт {{ updates_port }} на дашборде. Выбранные
      версии — {{ updates_overrides_file }} (сценарий читает его первым
      делом); вернуть машину к репозиторию — кнопка «сбросить все версии»
      и следующая выкатка.
